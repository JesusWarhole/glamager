# 29/08/2026 (fix #3, Babel/slow-reload): ίδιο build step με το merge workflow, για συνέπεια —
# ένα PR preview πρέπει να δείχνει το ΠΡΑΓΜΑΤΙΚΟ built αποτέλεσμα, όχι stale committed αρχείο.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GLAMAGER_HAIR_CORNER }}
          projectId: glamager-hair-corner
