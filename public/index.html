/* 01/08: overscroll-behavior δεν σκοτώνει το native iOS rubber-band effect μέσα σε standalone
   PWA (Add to Home Screen) — μόνο το scroll-chaining στο parent/document. Σε tabs με λίγο
   περιεχόμενο (Αρχική, +) το #root δεν έχει καν πραγματικό υπερχείλισμα, οπότε ΚΑΘΕ κάθετο
   τράβηγμα το iOS το αντιμετωπίζει σαν "overscroll" και κάνει το ελαστικό bounce (μοιάζει με
   reload). Σε Ταμείο/Αναφορές δεν φαίνεται γιατί έχουν όντως αρκετό περιεχόμενο να scrollάρει.
   Fix: μπλοκάρουμε χειροκίνητα το touchmove όταν είτε (α) δεν υπάρχει καθόλου πραγματικό
   scroll στο πλησιέστερο scrollable ancestor, είτε (β) έχουμε φτάσει στο πάνω/κάτω άκρο του και
   συνεχίζουμε προς την ίδια κατεύθυνση. Οριζόντια gestures (π.χ. chip filters) αγνοούνται. */
(function(){
  var startX=0, startY=0;
  function scrollParent(el){
    while(el && el!==document.body && el!==document.documentElement){
      var cs=window.getComputedStyle(el);
      if((cs.overflowY==='auto'||cs.overflowY==='scroll') && el.scrollHeight>el.clientHeight){
        return el;
      }
      el=el.parentElement;
    }
    return document.getElementById('root');
  }
  document.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(e.touches.length!==1) return;
    var dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
    if(Math.abs(dx)>Math.abs(dy)) return; // οριζόντιο gesture, μην το πειράξεις
    var el=scrollParent(e.target);
    var atTop = el.scrollTop<=0;
    var atBottom = el.scrollTop+el.clientHeight >= el.scrollHeight-1;
    var noScroll = el.scrollHeight <= el.clientHeight+1;
    if (noScroll || (atTop && dy>0) || (atBottom && dy<0)) {
      e.preventDefault();
    }
  }, {passive:false});
})();
</script>

  testModeSectionHint: { el: "\u0386\u03BD\u03B1\u03C8\u03AD \u03C4\u03BF \u03C0\u03C1\u03B9\u03BD \u03B4\u03BF\u03BA\u03B9\u03BC\u03AC\u03C3\u03B5\u03C4\u03B5 \u03C4\u03B7 \u03C1\u03BF\u03AE \u03C3\u03C4\u03BF \u03C0\u03C1\u03B1\u03B3\u03BC\u03B1\u03C4\u03B9\u03BA\u03CC \u03BC\u03B1\u03B3\u03B1\u03B6\u03AF, \u03C3\u03B2\u03AE\u03C3' \u03C4\u03BF \u03CC\u03C4\u03B1\u03BD \u03B5\u03AF\u03C3\u03C4\u03B5 \u03AD\u03C4\u03BF\u03B9\u03BC\u03BF\u03B9 \u03B3\u03B9\u03B1 \u03BA\u03B1\u03BD\u03BF\u03BD\u03B9\u03BA\u03AE \u03C7\u03C1\u03AE\u03C3\u03B7. \u0394\u03BF\u03C5\u03BB\u03B5\u03CD\u03B5\u03B9 \u03BC\u03B1\u03B6\u03AF \u03BC\u03B5 \u03C4\u03B7\u03BD \xAB\u0395\u03C0\u03B1\u03BD\u03B1\u03C6\u03BF\u03C1\u03AC \u03C0\u03C1\u03B9\u03BD \u03C4\u03B7\u03BD \u03AD\u03BD\u03B1\u03C1\u03BE\u03B7\xBB \u03C0\u03B1\u03C1\u03B1\u03BA\u03AC\u03C4\u03C9.", en: 'Turn it on before testing the real flow in the shop, turn it off when ready for normal use. Works together with "Reset before launch" below.' },

  syncClaimsHint: { el: "\u03A0\u03AC\u03C4\u03B1 \u03C4\u03BF \u03BC\u03B5\u03C4\u03AC \u03B1\u03C0\u03CC \u03BA\u03AC\u03B8\u03B5 \u03C0\u03C1\u03CC\u03C3\u03BB\u03B7\u03C8\u03B7, \u03B1\u03BB\u03BB\u03B1\u03B3\u03AE \u03C1\u03CC\u03BB\u03BF\u03C5 \u03AE \u03B1\u03C0\u03BF\u03C7\u03CE\u03C1\u03B7\u03C3\u03B7 \u03C0\u03C1\u03BF\u03C3\u03C9\u03C0\u03B9\u03BA\u03BF\u03CD \u2014 \u03B5\u03BD\u03B7\u03BC\u03B5\u03C1\u03CE\u03BD\u03B5\u03B9 \u03C4\u03B1 \u03B4\u03B9\u03BA\u03B1\u03B9\u03CE\u03BC\u03B1\u03C4\u03B1 \u03C0\u03C1\u03CC\u03C3\u03B2\u03B1\u03C3\u03B7\u03C2 \u03CE\u03C3\u03C4\u03B5 \u03BD\u03B1 \u03C4\u03B1\u03B9\u03C1\u03B9\u03AC\u03B6\u03BF\u03C5\u03BD \u03BC\u03B5 \u03C4\u03BF \u03C4\u03B9 \u03BB\u03AD\u03B5\u03B9 \u03B7 \u03BB\u03AF\u03C3\u03C4\u03B1 \u03A0\u03C1\u03BF\u03C3\u03C9\u03C0\u03B9\u03BA\u03BF\u03CD. \u0394\u03B5\u03BD \u03B1\u03B3\u03B3\u03AF\u03B6\u03B5\u03B9 email/\u03BA\u03C9\u03B4\u03B9\u03BA\u03CC/PIN \u03BA\u03B1\u03BD\u03B5\u03BD\u03CC\u03C2.", en: "Tap this after any hire, role change, or departure \u2014 updates access permissions to match what the Staff list says. Does not touch anyone's email/password/PIN." },

  resetPreLaunchHint: { el: "\u03A3\u03B2\u03AE\u03BD\u03B5\u03B9 \u039F\u03A1\u0399\u03A3\u03A4\u0399\u039A\u0391 \u03CC\u03BB\u03B5\u03C2 \u03C4\u03B9\u03C2 \u03B5\u03C0\u03B9\u03C3\u03BA\u03AD\u03C8\u03B5\u03B9\u03C2, \u03AD\u03BE\u03BF\u03B4\u03B1, \u03C0\u03B5\u03BB\u03AC\u03C4\u03B5\u03C2, \u03B1\u03B9\u03C4\u03AE\u03BC\u03B1\u03C4\u03B1 \u03B1\u03B4\u03B5\u03B9\u03CE\u03BD, kudos \u03BA\u03B1\u03B9 \u03BA\u03BB\u03B5\u03B9\u03B4\u03CE\u03BC\u03B1\u03C4\u03B1 \u0396 \u2014 \u03CC,\u03C4\u03B9 \u03B4\u03BF\u03BA\u03B9\u03BC\u03B1\u03C3\u03C4\u03B9\u03BA\u03CC \u03AD\u03C7\u03B5\u03B9 \u03BC\u03C0\u03B5\u03B9 \u03BC\u03AD\u03C7\u03C1\u03B9 \u03C4\u03CE\u03C1\u03B1. \u0394\u0395\u039D \u03B1\u03B3\u03B3\u03AF\u03B6\u03B5\u03B9 \u03C0\u03C1\u03BF\u03C3\u03C9\u03C0\u03B9\u03BA\u03CC, \u03BA\u03B1\u03C4\u03AC\u03BB\u03BF\u03B3\u03BF, \u03C1\u03C5\u03B8\u03BC\u03AF\u03C3\u03B5\u03B9\u03C2 \u03BC\u03B1\u03B3\u03B1\u03B6\u03B9\u03BF\u03CD, \u03AE \u03C0\u03C1\u03CC\u03B3\u03C1\u03B1\u03BC\u03BC\u03B1 \u03B2\u03B1\u03C1\u03B4\u03B9\u03CE\u03BD/\u03B1\u03B4\u03B5\u03B9\u03CE\u03BD. \u039C\u03B7 \u03B1\u03BD\u03B1\u03C3\u03C4\u03C1\u03AD\u03C8\u03B9\u03BC\u03BF.", en: "PERMANENTLY deletes all visits, expenses, clients, leave requests, kudos and Z-locks \u2014 any test data entered so far. Does NOT touch staff, catalog, shop settings, or the shift/leave schedule. Irreversible." },

  "\u03A4\u03BF \u03C0\u03B1\u03B9\u03C7\u03BD\u03AF\u03B4\u03B9 \u03C0\u03BF\u03C5 \u03BB\u03AC\u03C4\u03C1\u03B5\u03C5\u03B5\u03C2 \u03BC\u03B9\u03BA\u03C1\u03CC\u03C2/\u03AE;",
  "\u03A4\u03BF \u03B5\u03C0\u03AC\u03B3\u03B3\u03B5\u03BB\u03BC\u03B1 \u03C0\u03BF\u03C5 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03BA\u03AC\u03BD\u03B5\u03B9\u03C2 \u03CC\u03C4\u03B1\u03BD \u03BC\u03B5\u03B3\u03B1\u03BB\u03CE\u03C3\u03B5\u03B9\u03C2 (\u03BA\u03B1\u03B9 \u03B4\u03B5\u03BD \u03AD\u03BA\u03B1\u03BD\u03B5\u03C2);",
  "\u03A0\u03B1\u03B9\u03B4\u03B9\u03BA\u03AE \u03C3\u03B5\u03B9\u03C1\u03AC \u03C0\u03BF\u03C5 \u03B8\u03C5\u03BC\u03AC\u03C3\u03B1\u03B9 \u03B1\u03BA\u03CC\u03BC\u03B1 \u03C4\u03B7 \u03BC\u03B5\u03BB\u03C9\u03B4\u03AF\u03B1 \u03C4\u03B7\u03C2;",
  "\u03A4\u03BF \u03C0\u03B9\u03BF \u03C4\u03C1\u03B5\u03BB\u03CC \u03C0\u03C1\u03AC\u03B3\u03BC\u03B1 \u03C0\u03BF\u03C5 \u03AD\u03BA\u03B1\u03BD\u03B5\u03C2 \u03C3\u03C4\u03BF \u03C3\u03C7\u03BF\u03BB\u03B5\u03AF\u03BF;",
  "\u039A\u03B1\u03BB\u03BF\u03BA\u03B1\u03AF\u03C1\u03B9 \u03C4\u03B7\u03C2 \u03C0\u03B1\u03B9\u03B4\u03B9\u03BA\u03AE\u03C2 \u03B7\u03BB\u03B9\u03BA\u03AF\u03B1\u03C2 \u03C0\u03BF\u03C5 \u03B8\u03C5\u03BC\u03AC\u03C3\u03B1\u03B9 \u03C0\u03B9\u03BF \u03AD\u03BD\u03C4\u03BF\u03BD\u03B1;",
  "\u03A4\u03BF \u03C0\u03C1\u03CE\u03C4\u03BF \u03BA\u03B1\u03C4\u03BF\u03B9\u03BA\u03AF\u03B4\u03B9\u03BF \u03C0\u03BF\u03C5 \u03B5\u03AF\u03C7\u03B5\u03C2;",
  "\u03A0\u03B1\u03B9\u03C7\u03BD\u03AF\u03B4\u03B9 \u03C3\u03C4\u03B7\u03BD \u03B1\u03C5\u03BB\u03AE \u03C0\u03BF\u03C5 \u03B4\u03B5\u03BD \u03C0\u03B1\u03AF\u03B6\u03B5\u03C4\u03B1\u03B9 \u03C0\u03B9\u03B1;",
  "\u039F \u03B4\u03AC\u03C3\u03BA\u03B1\u03BB\u03BF\u03C2/\u03B7 \u03B4\u03B1\u03C3\u03BA\u03AC\u03BB\u03B1 \u03C0\u03BF\u03C5 \u03B8\u03C5\u03BC\u03AC\u03C3\u03B1\u03B9 \u03C0\u03B5\u03C1\u03B9\u03C3\u03C3\u03CC\u03C4\u03B5\u03C1\u03BF;",
  "\u03A4\u03BF \u03C0\u03C1\u03CE\u03C4\u03BF \u03C4\u03C1\u03B1\u03B3\u03BF\u03CD\u03B4\u03B9 \u03C0\u03BF\u03C5 \u03AD\u03BC\u03B1\u03B8\u03B5\u03C2 \u03B1\u03C0' \u03AD\u03BE\u03C9;",
  "\u039A\u03AC\u03C4\u03B9 \u03C0\u03BF\u03C5 \u03C6\u03BF\u03B2\u03CC\u03C3\u03BF\u03C5\u03BD \u03BC\u03B9\u03BA\u03C1\u03CC\u03C2/\u03AE \u03BA\u03B1\u03B9 \u03C4\u03CE\u03C1\u03B1 \u03C3\u03BF\u03C5 \u03C6\u03B1\u03AF\u03BD\u03B5\u03C4\u03B1\u03B9 \u03B1\u03C3\u03C4\u03B5\u03AF\u03BF;",
  "\u0391\u03BD \u03BA\u03AD\u03C1\u03B4\u03B9\u03B6\u03B5\u03C2 \u03C4\u03BF \u03BB\u03B1\u03C7\u03B5\u03AF\u03BF \u03B1\u03CD\u03C1\u03B9\u03BF, \u03C4\u03B9 \u03B8\u03B1 \u03AD\u03BA\u03B1\u03BD\u03B5\u03C2 \u03C0\u03C1\u03CE\u03C4\u03BF;",
  "\u03A5\u03C0\u03B5\u03C1\u03B4\u03CD\u03BD\u03B1\u03BC\u03B7 \u03C0\u03BF\u03C5 \u03B8\u03B1 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03AD\u03C7\u03B5\u03B9\u03C2;",
  "\u0391\u03BD \u03BC\u03C0\u03BF\u03C1\u03BF\u03CD\u03C3\u03B5\u03C2 \u03BD\u03B1 \u03B6\u03AE\u03C3\u03B5\u03B9\u03C2 \u03C3\u03B5 \u03AC\u03BB\u03BB\u03B7 \u03B5\u03C0\u03BF\u03C7\u03AE, \u03C0\u03BF\u03B9\u03B1 \u03B8\u03B1 \u03B4\u03B9\u03AC\u03BB\u03B5\u03B3\u03B5\u03C2;",
  "\u0388\u03BD\u03B1 \u03C4\u03B1\u03BB\u03AD\u03BD\u03C4\u03BF \u03C0\u03BF\u03C5 \u03B8\u03B1 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03B1\u03C0\u03BF\u03BA\u03C4\u03AE\u03C3\u03B5\u03B9\u03C2 \u03C3\u03C4\u03B9\u03B3\u03BC\u03B9\u03B1\u03AF\u03B1;",
  "\u0391\u03BD \u03B5\u03AF\u03C7\u03B5\u03C2 \u03AD\u03BD\u03B1 \u03B5\u03BB\u03B5\u03CD\u03B8\u03B5\u03C1\u03BF 24\u03C9\u03C1\u03BF \u03C7\u03C9\u03C1\u03AF\u03C2 \u03C5\u03C0\u03BF\u03C7\u03C1\u03B5\u03CE\u03C3\u03B5\u03B9\u03C2, \u03C4\u03B9 \u03B8\u03B1 \u03AD\u03BA\u03B1\u03BD\u03B5\u03C2;",
  "\u0398\u03B1 \u03C0\u03C1\u03BF\u03C4\u03B9\u03BC\u03BF\u03CD\u03C3\u03B5\u03C2 \u03BD\u03B1 \u03B4\u03B9\u03B1\u03B2\u03AC\u03B6\u03B5\u03B9\u03C2 \u03C3\u03BA\u03AD\u03C8\u03B5\u03B9\u03C2 \u03AE \u03BD\u03B1 \u03B5\u03AF\u03C3\u03B1\u03B9 \u03B1\u03CC\u03C1\u03B1\u03C4\u03BF\u03C2/\u03B7;",
  "\u0391\u03BD \u03BC\u03C0\u03BF\u03C1\u03BF\u03CD\u03C3\u03B5\u03C2 \u03BD\u03B1 \u03B4\u03B5\u03B9\u03C0\u03BD\u03AE\u03C3\u03B5\u03B9\u03C2 \u03BC\u03B5 \u03BF\u03C0\u03BF\u03B9\u03BF\u03BD\u03B4\u03AE\u03C0\u03BF\u03C4\u03B5, \u03B6\u03C9\u03BD\u03C4\u03B1\u03BD\u03CC \u03AE \u03CC\u03C7\u03B9, \u03C0\u03BF\u03B9\u03BF\u03BD \u03B8\u03B1 \u03B4\u03B9\u03AC\u03BB\u03B5\u03B3\u03B5\u03C2;",
  "\u0388\u03BD\u03B1 \u03BC\u03AC\u03B8\u03B7\u03BC\u03B1 \u03C0\u03BF\u03C5 \u03B8\u03B1 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03BE\u03B1\u03BD\u03B1\u03B4\u03B9\u03B4\u03B1\u03C7\u03B8\u03B5\u03AF\u03C2 \u03C3\u03C4\u03BF \u03C3\u03C7\u03BF\u03BB\u03B5\u03AF\u03BF \u03C3\u03AE\u03BC\u03B5\u03C1\u03B1;",
  "\u0398\u03B1 \u03AC\u03BB\u03BB\u03B1\u03B6\u03B5\u03C2 \u03CC\u03BD\u03BF\u03BC\u03B1 \u03B1\u03BD \u03BC\u03C0\u03BF\u03C1\u03BF\u03CD\u03C3\u03B5\u03C2; \u03A3\u03B5 \u03C4\u03B9;",
  "\u0396\u03CE\u03BF \u03C0\u03BF\u03C5 \u03B8\u03B1 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03B5\u03AF\u03C3\u03B1\u03B9 \u03B3\u03B9\u03B1 \u03BC\u03B9\u03B1 \u03BC\u03AD\u03C1\u03B1;",
  "\u03A7\u03C1\u03AE\u03BC\u03B1 \u03AE \u03C7\u03C1\u03CC\u03BD\u03BF\u03C2 \u2014 \u03C4\u03B9 \u03BB\u03B5\u03AF\u03C0\u03B5\u03B9 \u03C0\u03B9\u03BF \u03C0\u03BF\u03BB\u03CD \u03B1\u03C5\u03C4\u03AE \u03C4\u03B7 \u03C3\u03C4\u03B9\u03B3\u03BC\u03AE;",
  "\u0391\u03BD \u03C4\u03BF \u03C3\u03C0\u03AF\u03C4\u03B9 \u03C3\u03BF\u03C5 \u03AD\u03C0\u03B9\u03B1\u03BD\u03B5 \u03C6\u03C9\u03C4\u03B9\u03AC, \u03C4\u03B9 \u03B8\u03B1 \u03AD\u03C3\u03C9\u03B6\u03B5\u03C2 \u03C0\u03C1\u03CE\u03C4\u03BF (\u03BC\u03B5\u03C4\u03AC \u03C4\u03BF\u03C5\u03C2 \u03B1\u03BD\u03B8\u03C1\u03CE\u03C0\u03BF\u03C5\u03C2/\u03BA\u03B1\u03C4\u03BF\u03B9\u03BA\u03AF\u03B4\u03B9\u03B1);",
  "\u03A0\u03BF\u03B9\u03B1 \u03B4\u03B5\u03BA\u03B1\u03B5\u03C4\u03AF\u03B1 \u03C3\u03BF\u03C5 \u03B1\u03C1\u03AD\u03C3\u03B5\u03B9 \u03B7 \u03BC\u03CC\u03B4\u03B1 \u03C4\u03B7\u03C2 \u03C0\u03B5\u03C1\u03B9\u03C3\u03C3\u03CC\u03C4\u03B5\u03C1\u03BF;",
  "\u0398\u03B1 \u03B6\u03BF\u03CD\u03C3\u03B5\u03C2 \u03BC\u03B9\u03B1 \u03B5\u03B2\u03B4\u03BF\u03BC\u03AC\u03B4\u03B1 \u03C7\u03C9\u03C1\u03AF\u03C2 \u03BA\u03B9\u03BD\u03B7\u03C4\u03CC \u03B3\u03B9\u03B1 10.000\u20AC;",
  "\u03A0\u03CE\u03C2 \u03C0\u03B5\u03C1\u03BD\u03AC\u03C2 \u03C4\u03B7\u03BD \u039A\u03C5\u03C1\u03B9\u03B1\u03BA\u03AE \u03C3\u03BF\u03C5 \u03B9\u03B4\u03B1\u03BD\u03B9\u03BA\u03AC;",
  "\u03A7\u03CC\u03BC\u03C0\u03B9 \u03C0\u03BF\u03C5 \u03B8\u03B1 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03BE\u03B5\u03BA\u03B9\u03BD\u03AE\u03C3\u03B5\u03B9\u03C2 \u03B1\u03BB\u03BB\u03AC \u03B4\u03B5\u03BD \u03B2\u03C1\u03AF\u03C3\u03BA\u03B5\u03B9\u03C2 \u03C7\u03C1\u03CC\u03BD\u03BF;",
  "\u0392\u03B9\u03B2\u03BB\u03AF\u03BF \u03AE podcast \u03C3\u03C4\u03B9\u03C2 \u03BC\u03B5\u03C4\u03B1\u03BA\u03B9\u03BD\u03AE\u03C3\u03B5\u03B9\u03C2;",
  "\u03A0\u03C1\u03C9\u03B9\u03BD\u03CC\u03C2 \u03C4\u03CD\u03C0\u03BF\u03C2 \u03AE \u03BD\u03C5\u03C7\u03C4\u03BF\u03C0\u03BF\u03CD\u03BB\u03B9;",
  "\u03A4\u03BF \u03C7\u03CC\u03BC\u03C0\u03B9 \u03C3\u03BF\u03C5 \u03C0\u03BF\u03C5 \u03BA\u03B1\u03BD\u03B5\u03AF\u03C2 \u03B4\u03B5\u03BD \u03C0\u03B5\u03C1\u03B9\u03BC\u03AD\u03BD\u03B5\u03B9;",
  "\u0391\u03BD \u03B5\u03AF\u03C7\u03B5\u03C2 \u03AD\u03BD\u03B1 \u03B5\u03BE\u03C4\u03C1\u03AC \u03C9\u03C1\u03AC\u03C1\u03B9\u03BF \u03C4\u03B7 \u03BC\u03AD\u03C1\u03B1, \u03C4\u03B9 \u03B8\u03B1 \u03AD\u03BA\u03B1\u03BD\u03B5\u03C2 \u03BC' \u03B1\u03C5\u03C4\u03CC;",
  "\u03A4\u03BF \u03C4\u03B5\u03BB\u03B5\u03C5\u03C4\u03B1\u03AF\u03BF \u03C0\u03C1\u03AC\u03B3\u03BC\u03B1 \u03C0\u03BF\u03C5 \u03AD\u03BC\u03B1\u03B8\u03B5\u03C2 \u03BC\u03CC\u03BD\u03BF\u03C2/\u03B7 \u03C3\u03BF\u03C5 online;",
  "\u03A0\u03B1\u03B9\u03C7\u03BD\u03AF\u03B4\u03B9 \u03B5\u03C0\u03B9\u03C4\u03C1\u03B1\u03C0\u03AD\u03B6\u03B9\u03BF \u03C0\u03BF\u03C5 \u03BB\u03B1\u03C4\u03C1\u03B5\u03CD\u03B5\u03B9\u03C2;",
  "\u03A0\u03BF\u03B9\u03BF \u03AC\u03B8\u03BB\u03B7\u03BC\u03B1 \u03B8\u03B1 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03B4\u03BF\u03BA\u03B9\u03BC\u03AC\u03C3\u03B5\u03B9\u03C2;",
  "\u0396\u03C9\u03B3\u03C1\u03B1\u03C6\u03B9\u03BA\u03AE, \u03BC\u03BF\u03C5\u03C3\u03B9\u03BA\u03AE \u03AE \u03B3\u03C1\u03AC\u03C8\u03B9\u03BC\u03BF \u2014 \u03C4\u03B9 \u03B8\u03B1 \u03B4\u03B9\u03AC\u03BB\u03B5\u03B3\u03B5\u03C2 \u03B1\u03BD \u03AD\u03C0\u03C1\u03B5\u03C0\u03B5;",
  "\u03A3\u03BA\u03CD\u03BB\u03BF\u03C2 \u03AE \u03B3\u03AC\u03C4\u03B1;",
  "\u03A4\u03BF \u03C0\u03B9\u03BF \u03B1\u03C3\u03C4\u03B5\u03AF\u03BF \u03C0\u03B5\u03C1\u03B9\u03C3\u03C4\u03B1\u03C4\u03B9\u03BA\u03CC \u03BC\u03B5 \u03BA\u03B1\u03C4\u03BF\u03B9\u03BA\u03AF\u03B4\u03B9\u03BF;",
  "\u0391\u03BD \u03B5\u03AF\u03C7\u03B5\u03C2 \u03BF\u03C0\u03BF\u03B9\u03BF\u03B4\u03AE\u03C0\u03BF\u03C4\u03B5 \u03B6\u03CE\u03BF \u03C3\u03B1\u03BD \u03BA\u03B1\u03C4\u03BF\u03B9\u03BA\u03AF\u03B4\u03B9\u03BF, \u03C4\u03B9 \u03B8\u03B1 \u03B4\u03B9\u03AC\u03BB\u03B5\u03B3\u03B5\u03C2;",
  "\u0395\u03C0\u03BF\u03C7\u03AE \u03C4\u03BF\u03C5 \u03C7\u03C1\u03CC\u03BD\u03BF\u03C5 \u03C0\u03BF\u03C5 \u03BB\u03B1\u03C4\u03C1\u03B5\u03CD\u03B5\u03B9\u03C2 \u03C0\u03B9\u03BF \u03C0\u03BF\u03BB\u03CD;",
  "\u0389\u03BB\u03B9\u03BF\u03C2 \u03AE \u03B2\u03C1\u03BF\u03C7\u03AE \u03B3\u03B9\u03B1 \u03B4\u03B9\u03AC\u03B8\u03B5\u03C3\u03B7;",
  "\u03A4\u03BF \u03B1\u03B3\u03B1\u03C0\u03B7\u03BC\u03AD\u03BD\u03BF \u03C3\u03BF\u03C5 \u03BB\u03BF\u03C5\u03BB\u03BF\u03CD\u03B4\u03B9/\u03C6\u03C5\u03C4\u03CC;",
  "\u0398\u03AC\u03BB\u03B1\u03C3\u03C3\u03B1 \u03C4\u03BF \u03C0\u03C1\u03C9\u03AF \u03AE \u03C4\u03BF \u03B7\u03BB\u03B9\u03BF\u03B2\u03B1\u03C3\u03AF\u03BB\u03B5\u03BC\u03B1;",
  "\u03A4\u03BF \u03C0\u03B9\u03BF \u03CC\u03BC\u03BF\u03C1\u03C6\u03BF \u03B7\u03BB\u03B9\u03BF\u03B2\u03B1\u03C3\u03AF\u03BB\u03B5\u03BC\u03B1 \u03C0\u03BF\u03C5 \u03AD\u03C7\u03B5\u03B9\u03C2 \u03B4\u03B5\u03B9;",
  "\u0388\u03BD\u03B1 \u03C4\u03C1\u03B1\u03B3\u03BF\u03CD\u03B4\u03B9 \u03C0\u03BF\u03C5 \u03B4\u03B5\u03BD \u03B2\u03B1\u03C1\u03B9\u03AD\u03C3\u03B1\u03B9 \u03C0\u03BF\u03C4\u03AD \u03BD\u03B1 \u03B1\u03BA\u03BF\u03CD\u03C2;",

  "\u03A0\u03BF\u03B9\u03BF \u03BC\u03BF\u03C5\u03C3\u03B9\u03BA\u03CC \u03CC\u03C1\u03B3\u03B1\u03BD\u03BF \u03B8\u03B1 \u03AE\u03B8\u03B5\u03BB\u03B5\u03C2 \u03BD\u03B1 \u03BE\u03AD\u03C1\u03B5\u03B9\u03C2 \u03BD\u03B1 \u03C0\u03B1\u03AF\u03B6\u03B5\u03B9\u03C2;",

  "\u0391\u03BD \u03BC\u03C0\u03BF\u03C1\u03BF\u03CD\u03C3\u03B5\u03C2 \u03BD\u03B1 \u03B6\u03AE\u03C3\u03B5\u03B9\u03C2 \u03BC\u03B9\u03B1 \u03B5\u03B2\u03B4\u03BF\u03BC\u03AC\u03B4\u03B1 \u03C3\u03B5 \u03AC\u03BB\u03BB\u03B7 \u03C7\u03CE\u03C1\u03B1 \u03B4\u03C9\u03C1\u03B5\u03AC\u03BD, \u03C0\u03BF\u03B9\u03B1 \u03B8\u03B1 \u03B4\u03B9\u03AC\u03BB\u03B5\u03B3\u03B5\u03C2;",

  "\u0397 \u03B1\u03B3\u03B1\u03C0\u03B7\u03BC\u03AD\u03BD\u03B7 \u03C3\u03BF\u03C5 \u03B5\u03C0\u03BF\u03C7\u03AE \u03B3\u03B9\u03B1 \u03B2\u03CC\u03BB\u03C4\u03B1 \u03C3\u03C4\u03B7\u03BD \u03C0\u03CC\u03BB\u03B7;",

  "\u0388\u03BD\u03B1 \u03C7\u03CC\u03BC\u03C0\u03B9 \u03C0\u03BF\u03C5 \u03BE\u03B5\u03BA\u03AF\u03BD\u03B7\u03C3\u03B5\u03C2 \u03BA\u03B1\u03B9 \u03C4\u03BF \u03C0\u03B1\u03C1\u03AC\u03C4\u03B7\u03C3\u03B5\u03C2 \u2014 \u03B8\u03B1 \u03C4\u03BF \u03BE\u03B1\u03BD\u03AC\u03C0\u03B9\u03B1\u03BD\u03B5\u03C2;",

  "\u0398\u03B1 \u03C0\u03C1\u03BF\u03C4\u03B9\u03BC\u03BF\u03CD\u03C3\u03B5\u03C2 \u03BD\u03B1 \u03BE\u03AD\u03C1\u03B5\u03B9\u03C2 \u03C4\u03BF \u03BC\u03AD\u03BB\u03BB\u03BF\u03BD \u03AE \u03BD\u03B1 \u03BE\u03B5\u03C7\u03BD\u03AC\u03C2 \u03C4\u03BF \u03C0\u03B1\u03C1\u03B5\u03BB\u03B8\u03CC\u03BD;",

  "\u03A4\u03BF \u03C0\u03B9\u03BF \u03C0\u03B5\u03C1\u03AF\u03B5\u03C1\u03B3\u03BF compliment \u03C0\u03BF\u03C5 \u03AD\u03C7\u03B5\u03B9\u03C2 \u03BA\u03AC\u03BD\u03B5\u03B9 \u03C3\u03B5 \u03AC\u03B3\u03BD\u03C9\u03C3\u03C4\u03BF;",

  "\u0398\u03B1 \u03B6\u03BF\u03CD\u03C3\u03B5\u03C2 \u03C3\u03B5 \u03BD\u03B7\u03C3\u03AF \u03BC\u03CC\u03BD\u03B9\u03BC\u03B1 \u03AE \u03C3\u03BF\u03C5 \u03B1\u03C1\u03BA\u03B5\u03AF \u03C4\u03BF \u03BA\u03B1\u03BB\u03BF\u03BA\u03B1\u03AF\u03C1\u03B9;",

  "\u03A4\u03BF \u03C0\u03B9\u03BF \u03B4\u03CD\u03C3\u03BA\u03BF\u03BB\u03BF \u03BC\u03AC\u03B8\u03B7\u03BC\u03B1 \u03C3\u03C4\u03BF \u03C3\u03C7\u03BF\u03BB\u03B5\u03AF\u03BF \u03B3\u03B9\u03B1 \u03C3\u03AD\u03BD\u03B1;",

  "\u03A0\u03BF\u03B9\u03BF \u03B5\u03BB\u03BB\u03B7\u03BD\u03B9\u03BA\u03CC \u03BD\u03B7\u03C3\u03AF \u03AD\u03C7\u03B5\u03B9\u03C2 \u03C3\u03B5 \u03BB\u03AF\u03C3\u03C4\u03B1 \u03B3\u03B9\u03B1 \u03C6\u03AD\u03C4\u03BF\u03C2;",

  "\u03A0\u03BF\u03B9\u03BF \u03C4\u03C1\u03B1\u03B3\u03BF\u03CD\u03B4\u03B9 \u03C3\u03B5 \u03B2\u03AC\u03B6\u03B5\u03B9 \u03C3\u03B5 mood \u03B4\u03B9\u03B1\u03BA\u03BF\u03C0\u03CE\u03BD \u03B1\u03BA\u03CC\u03BC\u03B1 \u03BA\u03B1\u03B9 \u03C4\u03BF\u03BD \u03C7\u03B5\u03B9\u03BC\u03CE\u03BD\u03B1;",
  "\u0391\u03BD \u03AD\u03C0\u03C1\u03B5\u03C0\u03B5 \u03BD\u03B1 \u03B4\u03B9\u03B4\u03AC\u03BE\u03B5\u03B9\u03C2 \u03BA\u03AC\u03C4\u03B9 \u03C3\u03B5 \u03BC\u03B9\u03B1 \u03C4\u03AC\u03BE\u03B7, \u03C4\u03B9 \u03B8\u03B1 \u03AE\u03C4\u03B1\u03BD;",

  "\u03A0\u03BF\u03B9\u03BF \u03B5\u03AF\u03BD\u03B1\u03B9 \u03C4\u03BF \u03B1\u03B3\u03B1\u03C0\u03B7\u03BC\u03AD\u03BD\u03BF \u03C3\u03BF\u03C5 \u03BC\u03BF\u03C5\u03C3\u03B9\u03BA\u03CC \u03B5\u03AF\u03B4\u03BF\u03C2 \u03C0\u03BF\u03C5 \u03B4\u03B5\u03BD \u03C4\u03BF \u03BF\u03BC\u03BF\u03BB\u03BF\u03B3\u03B5\u03AF\u03C2 \u03B5\u03CD\u03BA\u03BF\u03BB\u03B1;",

const zodiacOn = (ds) => {

  return ZODIAC.find((z) => {
    const [s, e] = z.range;
    return s <= e ? md >= s && md <= e : md >= s || md <= e;
  });
};
const zodiacFactOn = (ds) => {
  const z = zodiacOn(ds);

  return { ...z, trait: z.traits[_dayOfYear(ds) % z.traits.length] };
};

  { el: "\u0397 \u03BA\u03B1\u03C1\u03B4\u03B9\u03AC \u03B5\u03BD\u03CC\u03C2 \u03B5\u03BD\u03AE\u03BB\u03B9\u03BA\u03B1 \u03C7\u03C4\u03C5\u03C0\u03AC\u03B5\u03B9 \u03C0\u03B5\u03C1\u03AF\u03C0\u03BF\u03C5 100.000 \u03C6\u03BF\u03C1\u03AD\u03C2 \u03C4\u03B7 \u03BC\u03AD\u03C1\u03B1.", en: "An adult heart beats about 100,000 times a day." },

  { el: "\u03A4\u03B1 \u03BC\u03B1\u03BB\u03BB\u03B9\u03AC \u03BC\u03B1\u03C2 \u03BC\u03B5\u03B3\u03B1\u03BB\u03CE\u03BD\u03BF\u03C5\u03BD \u03BA\u03B1\u03C4\u03AC \u03BC\u03AD\u03C3\u03BF \u03CC\u03C1\u03BF \u03C0\u03B5\u03C1\u03AF\u03C0\u03BF\u03C5 1-1,5 \u03B5\u03BA\u03B1\u03C4\u03BF\u03C3\u03C4\u03CC \u03C4\u03BF\u03BD \u03BC\u03AE\u03BD\u03B1.", en: "Hair grows on average about 1-1.5 cm per month." },
  { el: "\u03A4\u03BF \u03B1\u03BD\u03B8\u03C1\u03CE\u03C0\u03B9\u03BD\u03BF \u03C3\u03CE\u03BC\u03B1 \u03B1\u03BD\u03B1\u03BD\u03B5\u03CE\u03BD\u03B5\u03B9 \u03C4\u03BF \u03B5\u03BE\u03C9\u03C4\u03B5\u03C1\u03B9\u03BA\u03CC \u03C3\u03C4\u03C1\u03CE\u03BC\u03B1 \u03C4\u03BF\u03C5 \u03B4\u03AD\u03C1\u03BC\u03B1\u03C4\u03BF\u03C2 \u03C0\u03B5\u03C1\u03AF\u03C0\u03BF\u03C5 \u03BA\u03AC\u03B8\u03B5 \u03BC\u03AE\u03BD\u03B1.", en: "The human body renews the outer layer of skin about every month." },
  { el: "\u03A4\u03BF \u03B1\u03BD\u03B8\u03C1\u03CE\u03C0\u03B9\u03BD\u03BF \u03BC\u03AC\u03C4\u03B9 \u03BC\u03C0\u03BF\u03C1\u03B5\u03AF \u03BD\u03B1 \u03BE\u03B5\u03C7\u03C9\u03C1\u03AF\u03C3\u03B5\u03B9 \u03C0\u03B5\u03C1\u03AF\u03C0\u03BF\u03C5 10 \u03B5\u03BA\u03B1\u03C4\u03BF\u03BC\u03BC\u03CD\u03C1\u03B9\u03B1 \u03B1\u03C0\u03BF\u03C7\u03C1\u03CE\u03C3\u03B5\u03B9\u03C2 \u03C7\u03C1\u03CE\u03BC\u03B1\u03C4\u03BF\u03C2.", en: "The human eye can distinguish about 10 million shades of color." },
  { el: "\u03A4\u03BF \u03C7\u03B1\u03BC\u03CC\u03B3\u03B5\u03BB\u03BF \u03B5\u03BD\u03B5\u03C1\u03B3\u03BF\u03C0\u03BF\u03B9\u03B5\u03AF \u03BC\u03CD\u03B5\u03C2 \u03C0\u03BF\u03C5 \u03BC\u03C0\u03BF\u03C1\u03BF\u03CD\u03BD \u03BD\u03B1 \u03B2\u03B5\u03BB\u03C4\u03B9\u03CE\u03C3\u03BF\u03C5\u03BD \u03BB\u03AF\u03B3\u03BF \u03C4\u03B7 \u03B4\u03B9\u03AC\u03B8\u03B5\u03C3\u03AE \u03BC\u03B1\u03C2, \u03B1\u03BA\u03CC\u03BC\u03B1 \u03BA\u03B9 \u03CC\u03C4\u03B1\u03BD \u03BE\u03B5\u03BA\u03B9\u03BD\u03AC \xAB\u03C8\u03B5\u03CD\u03C4\u03B9\u03BA\u03BF\xBB.", en: 'Smiling activates muscles that can genuinely lift your mood a little, even when it starts out "fake."' },
  { el: "\u039F \u03AE\u03C7\u03BF\u03C2 \xAB\u03BA\u03BB\u03B9\u03BA\xBB \u03CC\u03C4\u03B1\u03BD \u03C3\u03C0\u03AC\u03BC\u03B5 \u03C4\u03B1 \u03B4\u03AC\u03C7\u03C4\u03C5\u03BB\u03B1 \u03C0\u03C1\u03BF\u03AD\u03C1\u03C7\u03B5\u03C4\u03B1\u03B9 \u03B1\u03C0\u03CC \u03C6\u03C5\u03C3\u03B1\u03BB\u03AF\u03B4\u03B5\u03C2 \u03B1\u03B5\u03C1\u03AF\u03BF\u03C5 \u03BC\u03AD\u03C3\u03B1 \u03C3\u03C4\u03BF \u03C5\u03B3\u03C1\u03CC \u03C4\u03C9\u03BD \u03B1\u03C1\u03B8\u03C1\u03CE\u03C3\u03B5\u03C9\u03BD.", en: 'The "click" sound when we crack our knuckles comes from gas bubbles in the joint fluid.' },
  { el: "\u0397 \u0395\u03BB\u03BB\u03AC\u03B4\u03B1 \u03AD\u03C7\u03B5\u03B9 \u03C0\u03AC\u03BD\u03C9 \u03B1\u03C0\u03CC 6.000 \u03BD\u03B7\u03C3\u03B9\u03AC \u03BA\u03B1\u03B9 \u03BD\u03B7\u03C3\u03AF\u03B4\u03B5\u03C2 \u2014 \u03BC\u03CC\u03BD\u03BF \u03C0\u03B5\u03C1\u03AF\u03C0\u03BF\u03C5 227 \u03BA\u03B1\u03C4\u03BF\u03B9\u03BA\u03BF\u03CD\u03BD\u03C4\u03B1\u03B9.", en: "Greece has over 6,000 islands and islets \u2014 only about 227 are inhabited." },
  { el: "\u0397 \u0399\u03C3\u03BB\u03B1\u03BD\u03B4\u03AF\u03B1 \u03B4\u03B5\u03BD \u03AD\u03C7\u03B5\u03B9 \u03BA\u03B1\u03B8\u03CC\u03BB\u03BF\u03C5 \u03BA\u03BF\u03C5\u03BD\u03BF\u03CD\u03C0\u03B9\u03B1.", en: "Iceland has no mosquitoes at all." },
  { el: "\u03A4\u03BF \u0392\u03B1\u03C4\u03B9\u03BA\u03B1\u03BD\u03CC \u03B5\u03AF\u03BD\u03B1\u03B9 \u03C4\u03BF \u03BC\u03B9\u03BA\u03C1\u03CC\u03C4\u03B5\u03C1\u03BF \u03B1\u03BD\u03B5\u03BE\u03AC\u03C1\u03C4\u03B7\u03C4\u03BF \u03BA\u03C1\u03AC\u03C4\u03BF\u03C2 \u03C3\u03C4\u03BF\u03BD \u03BA\u03CC\u03C3\u03BC\u03BF.", en: "The Vatican is the smallest independent state in the world." },
  { el: "\u0397 \u03A1\u03C9\u03C3\u03AF\u03B1 \u03B5\u03BA\u03C4\u03B5\u03AF\u03BD\u03B5\u03C4\u03B1\u03B9 \u03C3\u03B5 11 \u03B4\u03B9\u03B1\u03C6\u03BF\u03C1\u03B5\u03C4\u03B9\u03BA\u03AD\u03C2 \u03B6\u03CE\u03BD\u03B5\u03C2 \u03CE\u03C1\u03B1\u03C2.", en: "Russia spans 11 different time zones." },
  { el: "\u0397 \u0391\u03BD\u03C4\u03B1\u03C1\u03BA\u03C4\u03B9\u03BA\u03AE \u03B5\u03AF\u03BD\u03B1\u03B9 \u03C4\u03B5\u03C7\u03BD\u03B9\u03BA\u03AC \u03B7 \u03BC\u03B5\u03B3\u03B1\u03BB\u03CD\u03C4\u03B5\u03C1\u03B7 \u03AD\u03C1\u03B7\u03BC\u03BF\u03C2 \u03C3\u03C4\u03BF\u03BD \u03BA\u03CC\u03C3\u03BC\u03BF, \u03B5\u03C0\u03B5\u03B9\u03B4\u03AE \u03AD\u03C7\u03B5\u03B9 \u03B5\u03BB\u03AC\u03C7\u03B9\u03C3\u03C4\u03B7 \u03B2\u03C1\u03BF\u03C7\u03CC\u03C0\u03C4\u03C9\u03C3\u03B7.", en: "Antarctica is technically the largest desert in the world, because it gets so little precipitation." },
  { el: "\u0397 \u0399\u03B1\u03C0\u03C9\u03BD\u03AF\u03B1 \u03B1\u03C0\u03BF\u03C4\u03B5\u03BB\u03B5\u03AF\u03C4\u03B1\u03B9 \u03B1\u03C0\u03CC \u03C0\u03AC\u03BD\u03C9 \u03B1\u03C0\u03CC 6.800 \u03BD\u03B7\u03C3\u03B9\u03AC.", en: "Japan is made up of over 6,800 islands." },
  { el: "\u0397 \u0392\u03B5\u03BD\u03B5\u03C4\u03AF\u03B1 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03C7\u03C4\u03B9\u03C3\u03BC\u03AD\u03BD\u03B7 \u03C0\u03AC\u03BD\u03C9 \u03C3\u03B5 \u03C0\u03B5\u03C1\u03B9\u03C3\u03C3\u03CC\u03C4\u03B5\u03C1\u03B1 \u03B1\u03C0\u03CC 100 \u03BC\u03B9\u03BA\u03C1\u03AC \u03BD\u03B7\u03C3\u03AC\u03BA\u03B9\u03B1.", en: "Venice is built on more than 100 small islets." },
  { el: "\u0397 \u039A\u03BB\u03B5\u03BF\u03C0\u03AC\u03C4\u03C1\u03B1 \u03AD\u03B6\u03B7\u03C3\u03B5 \u03C7\u03C1\u03BF\u03BD\u03B9\u03BA\u03AC \u03C0\u03B9\u03BF \u03BA\u03BF\u03BD\u03C4\u03AC \u03C3\u03C4\u03B7\u03BD \u03C0\u03C1\u03CE\u03C4\u03B7 \u03C0\u03C1\u03BF\u03C3\u03B3\u03B5\u03AF\u03C9\u03C3\u03B7 \u03C3\u03C4\u03BF \u03C6\u03B5\u03B3\u03B3\u03AC\u03C1\u03B9 \u03C0\u03B1\u03C1\u03AC \u03C3\u03C4\u03B7\u03BD \u03BA\u03B1\u03C4\u03B1\u03C3\u03BA\u03B5\u03C5\u03AE \u03C4\u03C9\u03BD \u03C0\u03C5\u03C1\u03B1\u03BC\u03AF\u03B4\u03C9\u03BD \u03C4\u03B7\u03C2 \u0393\u03BA\u03AF\u03B6\u03B1\u03C2.", en: "Cleopatra lived closer in time to the first Moon landing than to the building of the Giza pyramids." },
  { el: "\u039F\u03B9 \u039F\u03BB\u03C5\u03BC\u03C0\u03B9\u03B1\u03BA\u03BF\u03AF \u0391\u03B3\u03CE\u03BD\u03B5\u03C2 \u03BE\u03B5\u03BA\u03AF\u03BD\u03B7\u03C3\u03B1\u03BD \u03C3\u03C4\u03B7\u03BD \u03B1\u03C1\u03C7\u03B1\u03AF\u03B1 \u0395\u03BB\u03BB\u03AC\u03B4\u03B1 \u03C4\u03BF 776 \u03C0.\u03A7.", en: "The Olympic Games began in ancient Greece in 776 BC." },
  { el: "\u03A3\u03C4\u03B7\u03BD \u03B1\u03C1\u03C7\u03B1\u03AF\u03B1 \u0395\u03BB\u03BB\u03AC\u03B4\u03B1 \u03BF\u03B9 \u03B1\u03B8\u03BB\u03B7\u03C4\u03AD\u03C2 \u03B1\u03B3\u03C9\u03BD\u03AF\u03B6\u03BF\u03BD\u03C4\u03B1\u03BD \u03B3\u03C5\u03BC\u03BD\u03BF\u03AF \u2014 \u03B1\u03C0\u03CC \u03B5\u03BA\u03B5\u03AF \u03C0\u03C1\u03BF\u03AD\u03C1\u03C7\u03B5\u03C4\u03B1\u03B9 \u03B7 \u03BB\u03AD\u03BE\u03B7 \xAB\u03B3\u03C5\u03BC\u03BD\u03B1\u03C3\u03C4\u03B9\u03BA\u03AE\xBB (\u03B3\u03C5\u03BC\u03BD\u03CC\u03C2).", en: `In ancient Greece, athletes competed naked \u2014 that's where the word "gymnastics" comes from (gymnos = naked).` },
  { el: "\u0397 \u03BC\u03B5\u03B3\u03AC\u03BB\u03B7 \u03C0\u03C5\u03C1\u03B1\u03BC\u03AF\u03B4\u03B1 \u03C4\u03B7\u03C2 \u0393\u03BA\u03AF\u03B6\u03B1\u03C2 \u03AE\u03C4\u03B1\u03BD \u03C4\u03BF \u03C8\u03B7\u03BB\u03CC\u03C4\u03B5\u03C1\u03BF \u03B1\u03BD\u03B8\u03C1\u03CE\u03C0\u03B9\u03BD\u03BF \u03BA\u03B1\u03C4\u03B1\u03C3\u03BA\u03B5\u03CD\u03B1\u03C3\u03BC\u03B1 \u03B3\u03B9\u03B1 \u03C0\u03AC\u03BD\u03C9 \u03B1\u03C0\u03CC 3.800 \u03C7\u03C1\u03CC\u03BD\u03B9\u03B1.", en: "The Great Pyramid of Giza was the tallest human-made structure for over 3,800 years." },
  { el: "\u0397 \u03B5\u03BB\u03BB\u03B7\u03BD\u03B9\u03BA\u03AE \u03B3\u03BB\u03CE\u03C3\u03C3\u03B1 \u03AD\u03C7\u03B5\u03B9 \u03C4\u03B7\u03BD \u03C0\u03B9\u03BF \u03BC\u03B1\u03BA\u03C1\u03CC\u03C7\u03C1\u03BF\u03BD\u03B7 \u03BA\u03B1\u03C4\u03B1\u03B3\u03B5\u03B3\u03C1\u03B1\u03BC\u03BC\u03AD\u03BD\u03B7 \u03B9\u03C3\u03C4\u03BF\u03C1\u03AF\u03B1 \u03B1\u03C0' \u03CC\u03BB\u03B5\u03C2 \u03C4\u03B9\u03C2 \u03B6\u03C9\u03BD\u03C4\u03B1\u03BD\u03AD\u03C2 \u03B5\u03C5\u03C1\u03C9\u03C0\u03B1\u03CA\u03BA\u03AD\u03C2 \u03B3\u03BB\u03CE\u03C3\u03C3\u03B5\u03C2.", en: "Greek has the longest recorded history of any living European language." },
  { el: "\u03A0\u03AC\u03BD\u03C9 \u03B1\u03C0\u03CC 150.000 \u03BB\u03AD\u03BE\u03B5\u03B9\u03C2 \u03C4\u03B7\u03C2 \u03B1\u03B3\u03B3\u03BB\u03B9\u03BA\u03AE\u03C2 \u03B3\u03BB\u03CE\u03C3\u03C3\u03B1\u03C2 \u03AD\u03C7\u03BF\u03C5\u03BD \u03B5\u03BB\u03BB\u03B7\u03BD\u03B9\u03BA\u03AE \u03C1\u03AF\u03B6\u03B1.", en: "Over 150,000 English words have Greek roots." },
  { el: "\u0397 \u03BB\u03AD\u03BE\u03B7 \xAB\u03BC\u03BF\u03C5\u03C3\u03B9\u03BA\u03AE\xBB \u03C0\u03C1\u03BF\u03AD\u03C1\u03C7\u03B5\u03C4\u03B1\u03B9 \u03B1\u03C0\u03CC \u03C4\u03B9\u03C2 \u039C\u03BF\u03CD\u03C3\u03B5\u03C2 \u03C4\u03B7\u03C2 \u03B1\u03C1\u03C7\u03B1\u03AF\u03B1\u03C2 \u03B5\u03BB\u03BB\u03B7\u03BD\u03B9\u03BA\u03AE\u03C2 \u03BC\u03C5\u03B8\u03BF\u03BB\u03BF\u03B3\u03AF\u03B1\u03C2.", en: 'The word "music" comes from the Muses of ancient Greek mythology.' },
  { el: "\u03A4\u03BF \u03BC\u03AD\u03BB\u03B9 \u03B4\u03B5\u03BD \u03C7\u03B1\u03BB\u03AC\u03B5\u03B9 \u03C0\u03BF\u03C4\u03AD \u03B1\u03BD \u03B5\u03AF\u03BD\u03B1\u03B9 \u03C3\u03C9\u03C3\u03C4\u03AC \u03B1\u03C0\u03BF\u03B8\u03B7\u03BA\u03B5\u03C5\u03BC\u03AD\u03BD\u03BF \u2014 \u03AD\u03C7\u03BF\u03C5\u03BD \u03B2\u03C1\u03B5\u03B8\u03B5\u03AF \u03B4\u03B5\u03AF\u03B3\u03BC\u03B1\u03C4\u03B1 3.000 \u03B5\u03C4\u03CE\u03BD \u03B1\u03BA\u03CC\u03BC\u03B1 \u03B2\u03C1\u03CE\u03C3\u03B9\u03BC\u03B1.", en: "Honey never spoils if stored properly \u2014 3,000-year-old samples have been found still edible." },
  { el: "\u039F\u03B9 \u03BD\u03C4\u03BF\u03BC\u03AC\u03C4\u03B5\u03C2 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03B5\u03C0\u03B9\u03C3\u03C4\u03B7\u03BC\u03BF\u03BD\u03B9\u03BA\u03AC \u03C6\u03C1\u03BF\u03CD\u03C4\u03BF, \u03CC\u03C7\u03B9 \u03BB\u03B1\u03C7\u03B1\u03BD\u03B9\u03BA\u03CC.", en: "Tomatoes are scientifically a fruit, not a vegetable." },
  { el: "\u03A4\u03BF \u03BA\u03B1\u03C1\u03CC\u03C4\u03BF \u03AE\u03C4\u03B1\u03BD \u03B1\u03C1\u03C7\u03B9\u03BA\u03AC \u03BC\u03C9\u03B2, \u03CC\u03C7\u03B9 \u03C0\u03BF\u03C1\u03C4\u03BF\u03BA\u03B1\u03BB\u03AF.", en: "Carrots were originally purple, not orange." },
  { el: "\u03A4\u03B1 \u03C6\u03B9\u03C3\u03C4\u03AF\u03BA\u03B9\u03B1 \u03B4\u03B5\u03BD \u03B5\u03AF\u03BD\u03B1\u03B9 \u03BE\u03B7\u03C1\u03BF\u03AF \u03BA\u03B1\u03C1\u03C0\u03BF\u03AF \u2014 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03CC\u03C3\u03C0\u03C1\u03B9\u03B1.", en: "Peanuts aren't nuts \u2014 they're legumes." },
