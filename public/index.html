                    <p className="text-xs font-bold" style={{color:'var(--text-dim)'}}>{fmtD(k.date)} → {emp?.name||k.byName||'—'}</p>
                    <p className="text-sm mt-1" style={{color:'var(--text)'}}>{k.msg}</p>
                  </div>
                  <button onClick={()=>{ if(window.confirm(t('hardDeleteConfirm'))) onDelete(k.id); }}
                    title={t('hardDeleteTitleAttr')} className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:'var(--soft)'}}>
                    <Ic n="trash" s={13} c="#dc2626"/>
                  </button>
                </div>
              );
            })}
          </div>}
    </div>
  );
};

/* ═══════════════ ΑΠΟΔΟΣΗ ΠΡΟΣΩΠΙΚΟΥ (Master) ═══════════════
   Κινήσεις/αποδοτικότητα ανά Ημέρα/Εβδομάδα/Μήνα: ώρες παραγωγικής
   δουλειάς, τζίρος, €/ώρα (δείκτης ισονομίας), μείγμα υπηρεσιών,
   μεταπωλήσεις χωριστά, tips. Tap σε υπάλληλο → όλες οι γραμμές του. */
const PerfReports = ({visits,staff,clients}) => {
  const [period,setPeriod] = useState('day');
  const [anchor,setAnchor] = useState(today());
  const [open,setOpen] = useState(null); // staffId drill-down

  let s,e,label;
  if(period==='day'){ s=e=anchor; label = anchor===today()?`📅 ${t('todayLabel')}`:fmtDLong(anchor); }
  else if(period==='week'){ const wd=weekOf(anchor); s=wd[0]; e=wd[6]; label=`${fmtD(s)} – ${fmtD(e)}`; }
  else { const d=new Date(anchor+'T12:00:00'); const r=monthRange(d.getFullYear(),d.getMonth()+1); s=r.s; e=r.e; label=`${monName(d.getMonth()+1)} ${d.getFullYear()}`; }

  const nav = dir => {
    if(period==='day') { const n=addDays(anchor,dir); if(n<=today()) setAnchor(n); }
    else if(period==='week') { const n=addDays(anchor,7*dir); if(weekOf(n)[0]<=today()) setAnchor(n); }
    else { const d=new Date(anchor+'T12:00:00'); d.setDate(1); d.setMonth(d.getMonth()+dir); const n=d.toISOString().slice(0,10); if(n<=today()) setAnchor(n); }
  };

  const fV = visits.filter(v=>v.date>=s&&v.date<=e);
  const act = fV.filter(v=>!isDel(v));
  const stf = staffSummary(fV,staff).sort((a,b)=>b.rev-a.rev);

  /* Δείκτης ισονομίας με βάση το 1.0 = μέσο €/ώρα του ΜΑΓΑΖΙΟΥ στην περίοδο.
     1.1-1.3 = προσφέρει πάνω από τον μέσο όρο · 0.8-0.9 = down under. */
  const withH = stf.filter(x=>x.hours>0);
  const shopPerHour = withH.length>0 ? withH.reduce((a,x)=>a+x.rev,0) / withH.reduce((a,x)=>a+x.hours,0) : 0;
  const idxOf = st => (st.hours>0 && shopPerHour>0) ? st.perHour/shopPerHour : null;
  const idxColor = i => i>=1.05 ? '#059669' : i<=0.95 ? '#dc2626' : 'var(--text-dim)';

  const mixOf = id => { const m={}; act.forEach(v=>v.lines.forEach(l=>{ if(l.staffId===id&&l.kind!=='product') m[l.name]=(m[l.name]||0)+1; })); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3); };
  const linesOf = id => { const out=[]; [...act].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).forEach(v=>v.lines.forEach((l,i)=>{ if(l.staffId===id) out.push({v,l,key:v.id+'-'+i}); })); return out; };

  return (
    <div>
      {/* Περίοδος */}
      <div className="rounded-xl p-1 flex gap-1 mb-2" style={{background:'var(--soft)'}}>
        {[['day',t('dayFullLabel')],['week',t('weekFullLabel')],['month',t('vatChipMonth')]].map(([v,l])=>(
          <button key={v} onClick={()=>{setPeriod(v);setAnchor(today());setOpen(null);}} className={`flex-1 py-2 rounded-lg text-xs font-bold ${period===v?'shadow':''}`} style={period===v?{background:'var(--surface)',color:'var(--accent-600)'}:{color:'var(--text-dim)'}}>{l}</button>
        ))}
      </div>
      <div className="flex items-center gap-2 mb-3">
        <button onClick={()=>nav(-1)} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="back" s={16} c="var(--text-dim)"/></button>
        <div className="flex-1 text-center"><p className="text-sm font-black" style={{color:'var(--text)'}}>{label}</p></div>
        <button onClick={()=>nav(1)} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="next" s={16} c="var(--text-dim)"/></button>
      </div>

      {/* Κάρτες ανά υπάλληλο */}
      <div className="space-y-2">
        {stf.map(st=>{
          const mix = mixOf(st.id);
          const isOpen = open===st.id;
          const zero = st.cnt===0 && st.tips===0;
          return (
            <div key={st.id} className={`card overflow-hidden ${zero?'opacity-40':''}`}>
              <button onClick={()=>setOpen(isOpen?null:st.id)} className="w-full px-4 py-3 text-left">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-full flex items-center justify-center" style={{background:'var(--accent-100)'}}><Ic n="user" s={16} c="var(--accent-600)"/></div>
                    <div>
                      <p className="text-sm font-black" style={{color:'var(--text)'}}>{st.name}</p>
                      <p className="text-xs" style={{color:'var(--text-dim)'}}>{st.cnt} {t('linesLabel')} · {st.hours.toFixed(1)}{t('hourAbbrev')} {t('productiveLabel')}</p>
                    </div>
                  </div>
                  <div className="text-right">
                    <p className="font-black amt" style={{color:'var(--accent-600)'}}>{fmt(st.rev)}</p>
                    {st.hours>0 && <p className="text-xs font-bold amt" style={{color:'#d97706'}}>
                      {fmt(st.perHour)}{t('perHourSuffixLabel')}
                      {idxOf(st)!=null && <span className="ml-1.5 px-1.5 py-0.5 rounded-md font-black" style={{background:'var(--soft)',color:idxColor(idxOf(st))}}>×{idxOf(st).toFixed(2)}</span>}
                    </p>}
                  </div>
                </div>
                {(mix.length>0 || st.resale>0 || st.tips>0) && (
                  <div className="flex gap-1.5 flex-wrap mt-2">
                    {mix.map(([n,c])=><span key={n} className="text-[10px] font-bold px-2 py-1 rounded-lg" style={{background:'var(--accent-50)',color:'var(--accent-600)'}}>{n} ×{c}</span>)}
                    {st.resale>0 && <span className="text-[10px] font-bold px-2 py-1 rounded-lg" style={{background:'#ede9fe',color:'#7c3aed'}}>🏷️ {t('resaleInlineLabel')} {fmt(st.resale)}</span>}
                    {st.tips>0 && <span className="text-[10px] font-bold px-2 py-1 rounded-lg" style={{background:'#fef9c3',color:'#ca8a04'}}>💛 tips {fmt(st.tips)}</span>}
                  </div>
                )}
              </button>
              {isOpen && (
                <div className="px-3 pb-3 space-y-1.5" style={{borderTop:'1px solid var(--border)',paddingTop:10}}>
                  {linesOf(st.id).map(r=>(
                    <div key={r.key} className="flex items-center gap-2 rounded-xl px-3 py-2 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
                      <div className="flex-1 min-w-0">
                        <p className="text-xs font-bold truncate" style={{color:'var(--text)'}}>{r.l.name}</p>
                        <p className="text-[10px]" style={{color:'var(--text-dim)'}}>{period!=='day'?fmtD(r.v.date)+' · ':''}{r.v.time}{r.v.clientId?` · ${clients.find(c=>c.id===r.v.clientId)?.name||''}`:''}{r.l.dur>0?` · ${r.l.dur}′`:''}</p>
                      </div>
                      <p className="text-xs font-black amt" style={{color:'var(--accent-600)'}}>{fmt(lineTotal(r.l))}</p>
                    </div>
                  ))}
                  {linesOf(st.id).length===0&&<p className="text-xs text-center py-2" style={{color:'var(--text-dim)'}}>{t('noLinesInPeriodLabel')}</p>}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* Οικονομικές αναφορές (Master) — περίοδοι, ΦΠΑ, ισονομία υπαλλήλων */
const FinReports = ({visits,expenses,staff,clients}) => {
  const [tab,setTab] = useState('month');
  const now = new Date();
  const {fV,fE,label} = useMemo(()=>{
    let s,e,label;
    if(tab==='week'){ const wd=weekOf(today()); s=wd[0]; e=wd[6]; label=`${t('weekFullLabel')} ${fmtD(s)} – ${fmtD(e)}`; }
    else if(tab==='month'){ const r=monthRange(now.getFullYear(),now.getMonth()+1); s=r.s; e=r.e; label=`${monName(now.getMonth()+1)} ${now.getFullYear()}`; }
    else { const q=Math.ceil((now.getMonth()+1)/3); const r=quarterRange(now.getFullYear(),q); s=r.s; e=r.e; label=`${t('quarterFullLabel')} ${LANG==='en'?'Q':'Τ'}${q}/${now.getFullYear()}`; }
    return { fV:visits.filter(v=>v.date>=s&&v.date<=e), fE:expenses.filter(x=>x.date>=s&&x.date<=e), label };
  },[tab,visits,expenses]);
  const sum = summarize(fV,fE);
  const stf = staffSummary(fV,staff).filter(s=>s.cnt>0).sort((a,b)=>b.rev-a.rev);

  /* Νέοι vs επαναλαμβανόμενοι — retention δείκτης */
  const firstVisit = {};
  visits.filter(v=>v.clientId&&!isDel(v)).forEach(v=>{ if(!firstVisit[v.clientId]||v.date<firstVisit[v.clientId]) firstVisit[v.clientId]=v.date; });
  const perClients = [...new Set(fV.filter(v=>v.clientId&&!isDel(v)).map(v=>v.clientId))];
  const newC = perClients.filter(c=>fV.some(v=>v.clientId===c&&v.date===firstVisit[c])).length;

  /* CSV ταμείου για λογιστή — μία γραμμή ανά γραμμή εσόδου + tip + έξοδο, με ΦΠΑ ανάλυση.
     Έξοδα καταγράφονται ως αρνητικά ώστε το άθροισμα της στήλης Σύνολο να δίνει καθαρό υπόλοιπο. */
  const exportLedgerCSV = () => {
    const rows = [[t('csvDateCol'), t('csvTimeCol'), t('typeLabel'), t('csvDescCol'), t('clientLabel'), t('csvEmployeeCol'), t('paymentLabel'), t('netLabel'), t('vatAbbrev'), t('totalLabel'), t('csvNoteCol')]];
    fV.filter(v=>!isDel(v)).forEach(v=>{
      const client = v.clientId ? (clients.find(c=>c.id===v.clientId)?.name||'') : '';
      v.lines.forEach(l=>{
        const tot = lineTotal(l), vat = vatOf(tot,l.vat||24), net = tot-vat;
        rows.push([v.date,v.time,t('incomeTab'),l.name,client,staff.find(s=>s.id===l.staffId)?.name||'',pmName(v.pm),net.toFixed(2),vat.toFixed(2),tot.toFixed(2),v.note||'']);
      });
      if(v.tip>0){
        if(v.tipSplit?.length>1){
          v.tipSplit.forEach(id=>{
            rows.push([v.date,v.time,'Tip',`${t('tipDescLabel')} (split)`,client,staff.find(s=>s.id===id)?.name||'',v.tipPm?pmName(v.tipPm):'','','',tipShareFor(v,id).toFixed(2),`÷${v.tipSplit.length}`]);
          });
        } else {
          rows.push([v.date,v.time,'Tip',t('tipDescLabel'),client,staff.find(s=>s.id===v.tipStaffId)?.name||'',v.tipPm?pmName(v.tipPm):'','','',Number(v.tip).toFixed(2),'']);
        }
      }
    });
    fE.filter(e=>!isDel(e)).forEach(e=>{
      const cat = LIVE_EXP_CATS.find(x=>x.name===e.cat);
      const vat = cat&&cat.vat>0 ? vatOf(e.amt,cat.vat) : 0, net = e.amt-vat;
      rows.push([e.date,e.time,t('expenseTab'),e.cat,'','','',(-net).toFixed(2),(-vat).toFixed(2),(-e.amt).toFixed(2),e.note||'']);
    });
    downloadCSV(`Glamager_Ταμείο_${label.replace(/\s+/g,'_')}.csv`, rows);
  };

  return (
    <div>
      <div className="flex items-center gap-2 mb-3">
        <div className="rounded-xl p-1 flex gap-1 flex-1" style={{background:'var(--soft)'}}>
          {[['week',t('weekFullLabel')],['month',t('vatChipMonth')],['quarter',t('quarterFullLabel')]].map(([v,l])=>(
            <button key={v} onClick={()=>setTab(v)} className={`flex-1 py-2 rounded-lg text-xs font-bold ${tab===v?'shadow':''}`} style={tab===v?{background:'var(--surface)',color:'var(--accent-600)'}:{color:'var(--text-dim)'}}>{l}</button>
          ))}
        </div>
        <button onClick={exportLedgerCSV} title={t('exportLedgerTitleAttr')} className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'var(--accent-50)'}}><Ic n="download" s={16} c="var(--accent-600)"/></button>
      </div>

      <div className="hero rounded-2xl p-5 text-white hero-shadow mb-3">
        <p className="text-white/70 text-xs font-semibold uppercase tracking-wider mb-1">{label}</p>
        <p className="text-3xl font-black amt mb-3">{fmt(sum.gross)}</p>
        <div className="grid grid-cols-4 gap-2 pt-3 border-t border-white/20 text-center text-xs">
          {[[t('cashLabel'),sum.cash],[t('posLabel'),sum.pos],[t('tipsLabel'),sum.tips],[t('discountsLabel'),sum.discounts]].map(([l,v])=>(
            <div key={l}><p className="text-white/70">{l}</p><p className="font-bold amt">{fmt(v)}</p></div>
          ))}
        </div>
      </div>

      {/* ΦΠΑ — συντηρητική εκτίμηση «τι να έχεις στην άκρη».
          Η επίσημη εκκαθάριση γίνεται εκτός εφαρμογής από τον λογιστή. */}
      <div className="card overflow-hidden mb-3">
        <div className="px-4 py-2.5" style={{background:'#fffbeb',borderBottom:'1px solid #fef3c7'}}><p className="text-xs font-black uppercase tracking-wider" style={{color:'#b45309'}}>{t('vatEstimateUpperBoundLabel')}</p></div>
        {[[t('vatOutLabel'),sum.vatOut,'#dc2626'],[t('vatInDeductibleLabel'),sum.vatIn,'#059669'],[t('netVatSetAsideLabel'),sum.netVat,'#b45309']].map(([l,v,c],i)=>(
          <div key={l} className="flex justify-between items-center px-4 py-3" style={i>0?{borderTop:'1px solid var(--border)'}:{}}>
            <span className="text-sm" style={{color:'var(--text-dim)'}}>{l}</span>
            <span className="amt font-bold" style={{color:c}}>{fmt(v)}</span>
          </div>
        ))}
      </div>

      {/* Ισονομία: ώρες παραγωγικής δουλειάς + €/ώρα (spec §7) */}
      {stf.length>0 && (
        <div className="card overflow-hidden mb-3">

/* ═══════════════ Ζ — ΚΛΕΙΣΙΜΟ ΗΜΕΡΑΣ ═══════════════
   ΑΥΤΟΥΣΙΟ από SalonPro («τίποτα δεν θέλει — όπως είναι, δουλεύει»).
   Διαφορές: δεν είναι tab (Master μόνο, από Αρχική) + κλειδώνει την ημέρα. */
const ZScreen = ({visits,expenses,staff,zmap,onSaveZ,onBack}) => {
  const [date,setDate] = useState(today());
  const dV = visits.filter(v=>v.date===date), dE = expenses.filter(e=>e.date===date);
  const sum = summarize(dV,dE);
  const appPosTotal = sum.pos + sum.posTips;
  const stf = staffSummary(dV,staff).filter(s=>s.tips>0);

  const [cashZ,setCashZ] = useState('');
  const [posZ,setPosZ] = useState('');
  const [notes,setNotes] = useState('');
  const [tipsGiven,setTipsGiven] = useState(false);
  const [saved,setSaved] = useState(false);

  useEffect(()=>{
    const z = zmap[date]||{};
    setCashZ(z.cashZ!=null?String(z.cashZ):'');
    setPosZ(z.posZ!=null?String(z.posZ):'');
    setNotes(z.notes||'');
    setTipsGiven(z.tipsGiven||false);
    setSaved(false);
  },[date,zmap]);

  const cashZn = parseFloat(cashZ)||0, posZn = parseFloat(posZ)||0;
  const cashDiff = cashZn-sum.cash, posDiff = posZn-appPosTotal;
  const hasMachine = cashZn>0||posZn>0;

  const DiffBadge = ({val}) => {
    if(!hasMachine) return null;
    const ok = Math.abs(val)<0.01;
    return <span className={`text-xs font-black px-2 py-0.5 rounded-full ${ok?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-600'}`}>{ok?t('okBadgeLabel'):(val>0?'+':'')+fmt(val)}</span>;
  };

  return (
    <div className="safe-pb">
      <div className="flex items-center gap-2 px-4 py-3" style={{background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
        <button onClick={onBack} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="x" s={16} c="var(--text-dim)"/></button>
        <button onClick={()=>setDate(addDays(date,-1))} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="back" s={16} c="var(--text-dim)"/></button>
        <div className="flex-1 text-center"><p className="text-sm font-black" style={{color:'var(--text)'}}>⚡ Ζ — {date===today()?t('todayLabel'):fmtD(date)} {zmap[date]&&'· 🔒'}</p></div>
        <button onClick={()=>{const n=addDays(date,1); if(n<=today()) setDate(n);}} disabled={date>=today()} className="w-9 h-9 rounded-xl flex items-center justify-center disabled:opacity-30" style={{background:'var(--soft)'}}><Ic n="next" s={16} c="var(--text-dim)"/></button>
      </div>

      <div className="px-4 mt-4 space-y-3">
        <div className="card overflow-hidden">
          <div className="px-4 py-2.5" style={{background:'var(--accent-600)'}}><p className="text-xs font-black text-white uppercase tracking-wider">{t('appCalcHeaderLabel')}</p></div>
          {[[t('cashServicesLabel'),sum.cash],[t('posServicesLabel'),sum.pos],[t('posTipsLabel'),sum.posTips],[t('posTerminalTotalLabel'),appPosTotal],[t('expLabel'),-sum.expTotal]].map(([l,v],i)=>(
            <div key={l} className="flex justify-between items-center px-4 py-2.5" style={i>0?{borderTop:'1px solid var(--border)'}:{}}>
              <span className={`text-sm ${String(l).startsWith('─')?'font-black':''}`} style={{color:String(l).startsWith('─')?'var(--text)':'var(--text-dim)'}}>{String(l).replace('─── ','')}</span>
              <span className="font-bold amt text-sm" style={{color:l===t('expLabel')?'#ef4444':String(l).startsWith('─')?'#3b82f6':'var(--text)'}}>{v<0?'-':''}{fmt(Math.abs(v))}</span>
            </div>
          ))}
        </div>

        <div className="card overflow-hidden">
          <div className="px-4 py-2.5 bg-gray-700"><p className="text-xs font-black text-white uppercase tracking-wider">{t('fromMachinesHeaderLabel')}</p></div>
          <div className="p-4 space-y-3">
            <div>
              <p className="text-xs font-bold mb-1" style={{color:'var(--text-dim)'}}>{t('cashRegisterZLabel')}</p>
              <div className="flex items-center gap-2 rounded-xl px-4 py-3 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
                <span className="font-bold" style={{color:'var(--text-dim)'}}>€</span>
                <input type="number" value={cashZ} onChange={e=>setCashZ(e.target.value)} placeholder="0,00" step="0.01" inputMode="decimal" className="flex-1 bg-transparent outline-none font-black text-lg amt" style={{color:'var(--text)'}}/>
                <DiffBadge val={cashDiff}/>
              </div>
            </div>
            <div>
              <p className="text-xs font-bold mb-1" style={{color:'var(--text-dim)'}}>{t('posTerminalZLabel')}</p>
              <div className="flex items-center gap-2 rounded-xl px-4 py-3 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
                <span className="font-bold" style={{color:'var(--text-dim)'}}>€</span>
                <input type="number" value={posZ} onChange={e=>setPosZ(e.target.value)} placeholder="0,00" step="0.01" inputMode="decimal" className="flex-1 bg-transparent outline-none font-black text-lg amt" style={{color:'var(--text)'}}/>
                <DiffBadge val={posDiff}/>
              </div>
            </div>
          </div>
        </div>

        {hasMachine && (
          <div className="card overflow-hidden">
            <div className="px-4 py-2.5" style={{background:Math.abs(cashDiff)<0.01&&Math.abs(posDiff)<0.01?'var(--accent-50)':'#fee2e2'}}><p className="text-xs font-black uppercase tracking-wider" style={{color:'var(--text)'}}>{t('differencesHeaderLabel')}</p></div>
            {[[t('cashRegisterShortLabel'),cashDiff],[t('posTerminalShortLabel'),posDiff]].map(([l,v],i)=>(
              <div key={l} className="flex justify-between items-center px-4 py-3" style={i>0?{borderTop:'1px solid var(--border)'}:{}}>
                <span className="text-sm" style={{color:'var(--text-dim)'}}>{l}</span>
                <span className="font-black text-sm amt" style={{color:Math.abs(v)<0.01?'#059669':v>0?'#3b82f6':'#dc2626'}}>{Math.abs(v)<0.01?t('zeroDiffLabel'):(v>0?'+':'')+fmt(v)}</span>
              </div>
            ))}
          </div>
        )}

        {stf.length>0 && (
          <div className="card overflow-hidden">
            <div className="px-4 py-2.5 flex items-center justify-between" style={{background:'#fefce8',borderBottom:'1px solid #fef9c3'}}>
              <p className="text-xs font-black uppercase tracking-wider" style={{color:'#ca8a04'}}>{t('tipsDistributionHeaderLabel')}</p>
              <button onClick={()=>setTipsGiven(!tipsGiven)} className={`px-3 py-1 rounded-full text-xs font-bold border ${tipsGiven?'bg-emerald-500 text-white border-emerald-500':'border-gray-300'}`} style={!tipsGiven?{color:'var(--text-dim)',background:'var(--surface)'}:{}}>
                {tipsGiven?t('tipsGivenLabel'):t('tipsPendingLabel')}
              </button>
            </div>
            {stf.map((s,i)=>(
              <div key={s.id} className="flex justify-between items-center px-4 py-3" style={i>0?{borderTop:'1px solid var(--border)'}:{}}>
                <span className="text-sm font-bold" style={{color:'var(--text)'}}>{s.name}</span>
                <span className="font-black amt text-yellow-500">{fmt(s.tips)}</span>
              </div>
            ))}
          </div>
        )}

        <div className="card px-4 py-3">
          <input type="text" value={notes} onChange={e=>setNotes(e.target.value)} placeholder={t('zNotesPlaceholder')} className="w-full text-sm outline-none bg-transparent" style={{color:'var(--text)'}}/>
        </div>

        <button onClick={async()=>{
            try{ await onSaveZ(date,{cashZ:cashZn,posZ:posZn,notes,tipsGiven,closedAt:nowTime()}); setSaved(true); }
            catch(err){ window.alert(t('saveFailedPrefix')+' '+((err&&(err.message||err.code))||String(err))); }
          }}
          className="w-full py-4 rounded-2xl font-black text-white text-base" style={{background:'var(--accent-600)'}}>
          {saved?t('zSavedLockedLabel'):t('zSaveLockBtn')}
        </button>
        <p className="text-xs text-center pb-2" style={{color:'var(--text-dim)'}}>{t('zLockHintLabel')}</p>
      </div>
    </div>
  );
};

/* ── ΠΡΟΣΩΠΙΚΟ (Ρυθμίσεις, 18/07) — Add/Edit προφίλ ατόμου: όνομα/email/ρόλος/γενέθλια/πρόσληψη/

const AUTO_LOCK_OPTIONS = [1,3,5,10,15,30];

/* ── Αλλαγή κωδικού — self-service, διαθέσιμο σε ΟΛΟΥΣ (Master/Staff/Reception).
   Χρειάζεται reauthenticate με τον τρέχοντα κωδικό πριν το updatePassword (Firebase απαίτηση
   ασφαλείας — "recent login"). Δουλεύει ΧΩΡΙΣ να χρειάζεται πραγματικό email domain. ── */
const ChangePasswordCard = ({onChangePassword}) => {
  const [cur,setCur] = useState('');
  const [nw,setNw] = useState('');
  const [cf,setCf] = useState('');
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(null);

  const inputCls = "w-full rounded-xl px-3 py-2.5 text-sm font-bold outline-none border";
  const inputStyle = {background:'var(--surface)',color:'var(--text)',borderColor:'var(--border)'};

  const submit = async () => {
    setMsg(null);
    if(nw.length<6){ setMsg({err:true,text:t('changePwWeak')}); return; }
    if(nw!==cf){ setMsg({err:true,text:t('changePwMismatch')}); return; }
    setBusy(true);
    try{
      await onChangePassword(cur,nw);
      setMsg({err:false,text:t('changePwSuccess')});
      setCur(''); setNw(''); setCf('');
    }catch(e){
      const code = (e && e.code) || '';
      setMsg({err:true, text: code.includes('wrong-password')||code.includes('invalid-credential') ? t('changePwWrongCurrent') : t('changePwGeneric')});
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="card p-4 mb-5">
      <div className="flex flex-col gap-2 mb-3">
        <input type="password" autoComplete="current-password" value={cur} onChange={e=>setCur(e.target.value)}
          placeholder={t('changePwCurrentPh')} className={inputCls} style={inputStyle}/>
        <input type="password" autoComplete="new-password" value={nw} onChange={e=>setNw(e.target.value)}
          placeholder={t('changePwNewPh')} className={inputCls} style={inputStyle}/>
        <input type="password" autoComplete="new-password" value={cf} onChange={e=>setCf(e.target.value)}
          placeholder={t('changePwConfirmPh')} className={inputCls} style={inputStyle}/>
      </div>
      {msg && <p className="text-xs font-semibold mb-2" style={{color: msg.err ? '#dc2626' : 'var(--accent-600)'}}>{msg.text}</p>}
      <button onClick={submit} disabled={busy || !cur || !nw || !cf}
        className="w-full py-2.5 rounded-xl text-sm font-black" style={{background:'var(--accent-600)',color:'white',opacity:(busy||!cur||!nw||!cf)?.6:1}}>
        {busy ? t('changePwBusy') : t('changePwBtn')}
      </button>
    </div>
  );
};

/* ── Αλλαγή PIN — καθημερινή ταυτότητα, ΟΧΙ security boundary. Καμία re-authentication (σε
   αντίθεση με το ChangePasswordCard) — απλή επαλήθευση τρέχοντος PIN. Μόνο ψηφία, 4 χαρακτήρες. */
const PinChangeCard = ({onChangePin}) => {
  const [cur,setCur] = useState('');
  const [nw,setNw] = useState('');
  const [cf,setCf] = useState('');
  const [msg,setMsg] = useState(null);

  const inputCls = "w-full rounded-xl px-3 py-2.5 text-sm font-bold outline-none border";
  const inputStyle = {background:'var(--surface)',color:'var(--text)',borderColor:'var(--border)'};
  const onlyDigits = v => v.replace(/\D/g,'').slice(0,4);

  const submit = () => {
    setMsg(null);
    if(nw.length!==4){ setMsg({err:true,text:t('changePinWeak')}); return; }
    if(nw!==cf){ setMsg({err:true,text:t('changePinMismatch')}); return; }
    try{
      onChangePin(cur,nw);
      setMsg({err:false,text:t('changePinSuccess')});
      setCur(''); setNw(''); setCf('');
    }catch(e){
      const code = (e && e.code) || '';
      setMsg({err:true, text: code==='wrong-pin' ? t('changePinWrongCurrent') : t('changePwGeneric')});
    }
  };

  return (
    <div className="card p-4 mb-5">
      <div className="flex flex-col gap-2 mb-3">
        <input type="password" inputMode="numeric" autoComplete="off" value={cur} onChange={e=>setCur(onlyDigits(e.target.value))}
          placeholder={t('currentPinPh')} className={inputCls} style={inputStyle}/>
        <input type="password" inputMode="numeric" autoComplete="off" value={nw} onChange={e=>setNw(onlyDigits(e.target.value))}
          placeholder={t('newPinPh')} className={inputCls} style={inputStyle}/>
        <input type="password" inputMode="numeric" autoComplete="off" value={cf} onChange={e=>setCf(onlyDigits(e.target.value))}
          placeholder={t('confirmPinPh')} className={inputCls} style={inputStyle}/>
      </div>
      {msg && <p className="text-xs font-semibold mb-2" style={{color: msg.err ? '#dc2626' : 'var(--accent-600)'}}>{msg.text}</p>}
      <button onClick={submit} disabled={!cur || nw.length!==4 || cf.length!==4}
        className="w-full py-2.5 rounded-xl text-sm font-black" style={{background:'var(--accent-600)',color:'white',opacity:(!cur||nw.length!==4||cf.length!==4)?.6:1}}>
        {t('changePinBtn')}
      </button>
    </div>
  );
};

      <button onClick={()=>{ if(window.confirm(t('fullSignOutConfirm'))) onFullSignOut(); }}
        className="w-full py-2.5 rounded-xl text-xs font-bold mb-1" style={{background:'var(--soft)',color:'#dc2626'}}>
        {t('fullSignOutBtn')}
      </button>
      <p className="text-xs mb-2" style={{color:'var(--text-dim)'}}>{t('fullSignOutHint')}</p>
    </div>
  </div>
  );
};

/* ═══════════════ ROOT APP ═══════════════ */

  /* ── Firebase Auth: ΔΥΟ ξεχωριστά επίπεδα ταυτότητας, ΕΠΙΤΗΔΕΣ διαφορετικά:
     1) fbUser — το πραγματικό Firebase session (email/password). Γίνεται ΜΙΑ φορά ανά συσκευή
        και ΜΕΝΕΙ συνδεδεμένο επ' αόριστον (το Firebase το θυμάται μόνο του) — ΔΕΝ κάνει signOut
        στο κλείδωμα/αλλαγή χεριού, μόνο σε ρητή «πλήρης αποσύνδεση» (βλ. fullSignOut παρακάτω).

     Άγνωστο email στο fbUser = δεν έχει πρόσβαση στο μαγαζί → αποσύνδεση αμέσως. Πρέπει να
     οριστούν ΠΡΙΝ το data block παρακάτω, γιατί το `authed` (gate για τα Firebase listeners)
     βασίζεται πλέον στο fbUser, ΟΧΙ στο operator — ώστε τα `pins` να φορτώνουν πριν διαλέξει
     κανείς όνομα στο OperatorPicker. ── */
  const [fbUser,setFbUser] = useState(null);
  const [authReady,setAuthReady] = useState(false);
  const [authBusy,setAuthBusy] = useState(false);
  const [authErr,setAuthErr] = useState('');

  /* 18/07: αφαιρέθηκε ο παλιός συγχρονισμένος έλεγχος «άγνωστο email → signOut αμέσως» εδώ μέσα.
     Λόγος: μαζί με το staff CRUD refactor, το AUTH_ACCOUNTS δεν είναι πια module-level constant
     (χτισμένο συγχρονισμένα από DEMO_STAFF/DEMO_MASTERS στη φόρτωση του script) — είναι πλέον
     `authAccounts` useMemo παρακάτω, παραγόμενο από το ζωντανό `staff` Firebase state. Το ίδιο
     αυτό `staff` state ΔΕΝ έχει φορτωθεί ακόμα τη στιγμή που τρέχει αυτό το effect (χρειάζεται
     πρώτα `fbUser`/`authed` για να ανοίξει καν listener) — circular αν προσπαθούσαμε να το
     ελέγξουμε ΕΔΩ. Λύση: η πραγματική security boundary είναι το ίδιο το Firebase Auth (μόνο
     λογαριασμοί που έφτιαξε ο Ανδρέας στο Console μπορούν να κάνουν sign in) — ο έλεγχος «υπάρχει
     αντίστοιχη εγγραφή staff» μετατέθηκε σε ξεχωριστό reactive effect πιο κάτω, ΑΦΟΥ πρώτα
     φορτώσει το `staff` (έστω από το seed, που ήδη περιέχει τα 5 πραγματικά email). */
  useEffect(()=>{
    const unsub = fbAuth.onAuthStateChanged(u=>{
      setFbUser(u);
      if(!u) setOperator(null); // πλήρης αποσύνδεση συσκευής -> καθαρίζει και την τοπική ταυτότητα
      setAuthReady(true);
    });
    return unsub;
  },[]);

  /* Πλήρης αποσύνδεση συσκευής — ΣΠΑΝΙΑ χρήση (π.χ. αλλάζει ιδιοκτήτη το tablet).

  const fullSignOut = () => { fbAuth.signOut(); };

  /* Live Firebase RTDB state — ενεργοποιείται μόλις υπάρχει έγκυρο Firebase session (authed),

  const authed = authReady && !!fbUser;
  const [pins,setPins] = useFirebaseState('pins', DEFAULT_PINS, authed);
  const [staff,setStaff] = useFirebaseState('staff', DEFAULT_STAFF, authed);
  /* staffOnly: Ρεσεψιόν+Προσωπικό χωρίς Masters — χρησιμοποιείται ΜΟΝΟ πλέον για πρόγραμμα/άδειες
     (schedule-eligibility), ΟΧΙ για attribution υπηρεσιών — βλ. serviceStaff παρακάτω για αυτό. */
  const staffOnly = useMemo(()=>staff.filter(s=>s.role!==ROLE.MASTER),[staff]);
  /* serviceStaff (31/07) — ποιος εμφανίζεται ως επιλογή «ποιος εξυπηρέτησε» σε γραμμή/tip.
     ΑΝΕΞΑΡΤΗΤΟ από role: βασίζεται αποκλειστικά στο servesClients flag ανά άτομο (StaffManager).
     Λύνει το bug όπου η Ρεσεψιόν (Μαργαρίτα) εμφανιζόταν σαν επιλογή «ποιος έκανε το κούρεμα»
     επειδή το παλιό φίλτρο ήταν μόνο role!==MASTER. */
  /* ⚠️ Migration: το 'staff' path υπάρχει ΗΔΗ live στο Firebase (από πριν αυτό το field υπάρξει),

     μάντεμα, καλύπτει Τάνια/Λαούρα αυτόματα)· η Σοφία (Master) ΔΕΝ θα καλυφθεί αυτόματα από αυτό

     φορά, μετά μένει μόνιμα στο Firebase σαν πραγματική τιμή. */
  const serviceStaff = useMemo(()=>staff.filter(s=>s.servesClients ?? s.role===ROLE.STAFF),[staff]);
  /* Login lookup: email (lowercase) → {id,name,role}. Πριν ήταν module-level AUTH_ACCOUNTS
     χτισμένο ΜΙΑ φορά από DEMO_STAFF/DEMO_MASTERS· τώρα ζωντανό, βγαίνει από το πραγματικό
     `staff` — ώστε μια αλλαγή email/ρόλου μέσω του StaffManager να πιάνει αμέσως. */
  const authAccounts = useMemo(()=>{
    const acc = {};
    staff.forEach(s=>{ if(s.email) acc[s.email.toLowerCase()] = { id:s.id, name:s.name, role:s.role, email:s.email }; });
    return acc;
  },[staff]);
  /* Δεύτερη γραμμή του παλιού ελέγχου «άγνωστο email»: τρέχει ΑΦΟΥ έχει ήδη φορτώσει έστω το
     seed του staff (άρα καμία circular εξάρτηση), σημειώνει σφάλμα + σε αποσυνδέει αν το
     συνδεδεμένο email δεν αντιστοιχεί σε καμία ενεργή εγγραφή προσωπικού. */
  useEffect(()=>{
    if(!fbUser) return;
    if(!authAccounts[(fbUser.email||'').toLowerCase()]){
      setAuthErr(t('loginNotFound'));
      fbAuth.signOut();
    }
  },[fbUser, authAccounts]);
  const [visits,setVisits] = useFirebaseState('visits', DEMO_VISITS, authed);
  const [expenses,setExpenses] = useFirebaseState('expenses', DEMO_EXPENSES, authed);
  const [clients,setClients] = useFirebaseState('clients', DEMO_CLIENTS, authed);
  const [services,setServices] = useFirebaseState('services', DEMO_SERVICES, authed);
  const [products,setProducts] = useFirebaseState('products', DEMO_PRODUCTS, authed);
  const [catalogOpen,setCatalogOpen] = useState(false);
  const [templatePickerOpen,setTemplatePickerOpen] = useState(false);
  const [schedData,setSchedData] = useFirebaseState('schedData', DEMO_SCHED, authed);
  const [leaveReqs,setLeaveReqs] = useFirebaseState('leaveReqs', DEMO_LEAVE_REQS, authed);
  const [zmap,setZmap] = useFirebaseState('zmap', {}, authed);
  const [selVisit,setSelVisit] = useState(null);
  /* Kudos — seed ένα για demo (η πρώτη φορά μόνο, μετά είναι ό,τι υπάρχει στο Firebase) */
  const [kudos,setKudos] = useFirebaseState('kudos', [{id:'k1', empId:'s3', date:TODAY_ISO, msg:'Τέλεια δουλειά με τη δύσκολη βαφή χθες — η πελάτισσα έφυγε χαρούμενη!'}], authed);
  /* Ρυθμίσεις καταστήματος (spec §1α) */
  const [settings,setSettingsState] = useFirebaseState('settings', DEMO_SETTINGS, authed);
  const [expCats,setExpCats] = useFirebaseState('expCats', EXP_CATS, authed);
  const [fixedExpenses,setFixedExpenses] = useFirebaseState('fixedExpenses', DEMO_FIXED_EXPENSES, authed);
  const [expCatsOpen,setExpCatsOpen] = useState(false);
  const [fixedExpOpen,setFixedExpOpen] = useState(false);
  const [staffManagerOpen,setStaffManagerOpen] = useState(false);

  const setTheme = t => { setThemeState(t); applyTheme(t); };
  const setAccent = a => { setAccentState(a); applyAccent(a); };
  /* accent/theme: τοπικές προτιμήσεις συσκευής — τρέχουν μία φορά στο mount */
  useEffect(()=>{ applyAccent(accent); applyTheme(theme); },[]);
  /* currency/lang: ΜΕΡΟΣ του settings που έρχεται από Firebase — πρέπει να ξαναεφαρμόζεται

  useEffect(()=>{ applyCurrency(settings.currency); applyLang(settings.lang); },[settings.currency, settings.lang]);
  /* module-level mirror ώστε components χωρίς direct πρόσβαση στο state (LIVE_EXP_CATS pattern)

  useEffect(()=>{ LIVE_EXP_CATS = expCats; },[expCats]);

  const updateSettings = patch => setSettingsState(s=>({...s,...patch}));
  const saveExpCat = c => setExpCats(cs => c.id ? cs.map(x=>x.id===c.id?c:x) : [...cs,{...c,id:uid()}]);
  const deleteExpCat = id => setExpCats(cs => cs.filter(x=>x.id!==id));
  const saveFixedExpense = fe => setFixedExpenses(list => fe.id ? list.map(x=>x.id===fe.id?fe:x) : [...list,{...fe,id:uid()}]);
  const deleteFixedExpense = id => setFixedExpenses(list=>list.filter(x=>x.id!==id));
  /* Προσωπικό (StaffManager, 18/07) — upsert προφίλ ατόμου. Δημιουργεί/ενημερώνει ΜΟΝΟ την
     εγγραφή μέσα στην εφαρμογή (όνομα/ρόλος/γενέθλια/πρόσληψη/άδειες) — ΔΕΝ φτιάχνει λογαριασμό
     σύνδεσης (Firebase Auth email/password), αυτό παραμένει χειροκίνητο βήμα στο Firebase Console
     μέχρι να χτιστεί μελλοντικό Cloud Function invite flow. Καμία delete/deactivate ακόμα σκόπιμα
     — ιστορικό attribution (visits/expenses) εξαρτάται από αυτά τα id, θέλει πιο προσεκτικό

  const saveStaffMember = p => setStaff(list => p.id ? list.map(x=>x.id===p.id?p:x) : [...list,{...p,id:uid()}]);

  /* Καθαρισμός demo δεδομένων — one-off οικιακή δουλειά, ΟΧΙ γενικό hard-delete εργαλείο.
     Τα demo seed records (v1-v8, e1, c1-c4, k1, lr1 + οι δοκιμαστικές sick/leave μέρες) έχουν
     ήδη γραφτεί στο Firebase την πρώτη φορά που άνοιξε η εφαρμογή (seed-on-empty-path). Το
     soft-delete ΕΠΙΤΗΔΕΣ δεν τα σβήνει πραγματικά (immutable audit trail, spec §1β) — γι' αυτό

  const DEMO_SEED_IDS = { visits:['v1','v2','v3','v4','v5','v6','v7','v8'], expenses:['e1'], clients:['c1','c2','c3','c4'], leaveReqs:['lr1'], kudos:['k1'] };

  /* ── «Διόρθωση δοκιμαστικών» (31/07) — Master-only hard delete, ΞΕΧΩΡΙΣΤΟ από wipeDemoData.
     Λόγος ύπαρξης: το wipeDemoData παραπάνω σβήνει ΜΟΝΟ τα γνωστά DEMO_SEED_IDS (αυτά που ήρθαν
     έτοιμα με την εφαρμογή) — οτιδήποτε δημιουργήθηκε ΜΕΤΑ, χειροκίνητα, από πραγματικό χειριστή
     δοκιμάζοντας τη ροή (π.χ. ένα δοκιμαστικό αίτημα άδειας που εγκρίθηκε/απορρίφθηκε απλά για τεστ),
     δεν το πιάνει καθόλου — έμενε μόνιμα κολλημένο χωρίς κανένα κουμπί διαγραφής πουθενά.
     ΠΕΔΙΟ ΕΦΑΡΜΟΓΗΣ: μόνο μη-οικονομικές οντότητες (άδειες/kudos/πελάτες). Ταμείο/έξοδα/επισκέψεις
     ΔΕΝ αγγίζονται εδώ — αυτά παραμένουν soft-delete + audit, κλειδωμένο spec decision, immutable
     μετά το Ζ. Πελάτης διαγράφεται ΜΟΝΟ αν δεν έχει ΚΑΜΙΑ επίσκεψη (ούτε soft-deleted) στο όνομά
     του — αλλιώς η επίσκεψη θα έμενε με «ορφανό» clientId και θα έσπαγε το VisitDetail/CSV. */
  const deleteLeaveReq = id => setLeaveReqs(rs=>rs.filter(r=>r.id!==id));
  const deleteKudos = id => setKudos(ks=>ks.filter(k=>k.id!==id));
  const deleteClient = id => {
    if(visits.some(v=>v.clientId===id)) return { ok:false, reason:'hasVisits' };
    setClients(cs=>cs.filter(c=>c.id!==id));
    return { ok:true };
  };

  /* Async + diagnostic ΕΠΙΤΗΔΕΣ (μετά από αναφορά ότι το πρώτο πάτημα δεν έσβησε τίποτα):
     1) μετράει ΠΟΣΑ demo records βρέθηκαν πραγματικά πριν κάνει οτιδήποτε — αν βγει 0, σημαίνει
        ότι τα id δεν ταιριάζουν με ό,τι όντως υπάρχει στο Firebase (π.χ. already-wiped ή διαφορετικό
        seed) και το λέει καθαρά αντί να αποτυγχάνει σιωπηλά.
     2) περιμένει (await) το πραγματικό write() σε κάθε path και πιάνει errors — αν τα Security Rules
        μπλοκάρουν την εγγραφή (π.χ. permission-denied), θα το δούμε ρητά αντί να "μηδενιστεί" τοπικά
        και μετά να ξαναγεμίσει από τον live listener με τα ίδια (αμετάβλητα) server δεδομένα. */
  const wipeDemoData = async () => {
    const found = {
      visits: visits.filter(v=>DEMO_SEED_IDS.visits.includes(v.id)).length,
      expenses: expenses.filter(e=>DEMO_SEED_IDS.expenses.includes(e.id)).length,
      clients: clients.filter(c=>DEMO_SEED_IDS.clients.includes(c.id)).length,
      leaveReqs: leaveReqs.filter(r=>DEMO_SEED_IDS.leaveReqs.includes(r.id)).length,
      kudos: kudos.filter(k=>DEMO_SEED_IDS.kudos.includes(k.id)).length,
    };
    const totalFound = Object.values(found).reduce((a,b)=>a+b,0);
    if(totalFound===0){
      return { ok:true, totalFound:0, totalNow:0 };
    }
    try{
      await Promise.all([
        setVisits(vs=>vs.filter(v=>!DEMO_SEED_IDS.visits.includes(v.id))),
        setExpenses(es=>es.filter(e=>!DEMO_SEED_IDS.expenses.includes(e.id))),
        setClients(cs=>cs.filter(c=>!DEMO_SEED_IDS.clients.includes(c.id))),
        setLeaveReqs(rs=>rs.filter(r=>!DEMO_SEED_IDS.leaveReqs.includes(r.id))),
        setKudos(ks=>ks.filter(k=>!DEMO_SEED_IDS.kudos.includes(k.id))),
        setSchedData(sd=>{
          const next = JSON.parse(JSON.stringify(sd));
          const y=CUR_Y, m=pad2(CUR_M);
          if(next[y]?.[m]?.s2) delete next[y][m].s2['02'];
          if(next[y]?.[m]?.s3){ delete next[y][m].s3['06']; delete next[y][m].s3['07']; }
          return next;
        }),
      ]);
      return { ok:true, totalFound, found };
    }catch(err){
      return { ok:false, totalFound, found, error: (err && (err.message||err.code)) || String(err) };
    }
  };

  /* Κλείδωμα/αλλαγή χεριού — ΚΑΘΗΜΕΡΙΝΗ χρήση. ΔΕΝ κάνει signOut (το Firebase session μένει
     ζωντανό στο παρασκήνιο) — απλά καθαρίζει τον τοπικό operator, γυρνάει στο OperatorPicker. */
  const lockNow = useCallback(()=>{
    setOperator(null); setTab('home'); setShowSettings(false); setSelVisit(null);
  },[]);

  const doLogin = async (email,pw) => {
    setAuthBusy(true); setAuthErr('');
    try{
      await fbAuth.signInWithEmailAndPassword(email,pw);
    }catch(e){
      const code = e && e.code || '';
      setAuthErr(code.includes('user-not-found')||code.includes('wrong-password')||code.includes('invalid-credential')||code.includes('invalid-email')
        ? t('loginBadCreds') : t('loginGeneric'));
    }finally{
      setAuthBusy(false);
    }
  };

  /* Self-service αλλαγή κωδικού — ΤΟΥ ΠΡΑΓΜΑΤΙΚΟΥ Firebase account (fbUser), ΟΧΙ του τρέχοντος
     PIN operator — μπορεί να διαφέρουν (π.χ. η Μαργαρίτα έκανε το πρωινό login στη συσκευή,
     αλλά τώρα δουλεύει με PIN η Τάνια — η αλλαγή κωδικού αφορά ΠΑΝΤΑ τον λογαριασμό της συσκευής,
     δηλαδή της Μαργαρίτας). reauthenticate με τρέχοντα κωδικό (Firebase requirement), μετά
     updatePassword. Πετάει error (με .code) που πιάνει το ChangePasswordCard. */
  const changePassword = async (currentPw,newPw) => {
    const user = fbAuth.currentUser;
    if(!user || !user.email) throw {code:'no-user'};
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, currentPw);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(newPw);
  };

  /* Self-service αλλαγή PIN — ΤΟΥ τρέχοντος operator (τοπική ταυτότητα, ΟΧΙ security boundary
     — αυτή είναι το Firebase Auth account από πάνω). Καμία re-authentication χρειάζεται, απλή
     επαλήθευση τρέχοντος PIN μέσα στο ήδη-φορτωμένο `pins` object. */
  const changePin = (currentPin,newPin) => {
    if(!operator) throw {code:'no-operator'};
    if((pins[operator.id]||'') !== currentPin) throw {code:'wrong-pin'};
    setPins(p=>({...p,[operator.id]:newPin}));
  };

  /* Auto-lock: login ως ΤΑΥΤΟΤΗΤΑ ΧΕΙΡΙΣΤΗ + μηχανισμός handoff (spec §8) — διάρκεια από Ρυθμίσεις */
  useEffect(()=>{
    if(!operator) return;
    const ms = (parseInt(settings.autoLockMinutes)||5)*60*1000;
    const reset = () => { clearTimeout(lockTimer.current); lockTimer.current = setTimeout(lockNow, ms); };
    reset();
    const evts = ['touchstart','mousedown','keydown'];
    evts.forEach(e=>window.addEventListener(e,reset));
    return ()=>{ clearTimeout(lockTimer.current); evts.forEach(e=>window.removeEventListener(e,reset)); };
  },[operator, lockNow, settings.autoLockMinutes]);

  /* ── Handlers (μελλοντικά: Firebase writes + Security Rules server-side) ── */
  const addVisit = v => {
    setVisits(vs=>[v,...vs]);
    /* light απόθεμα: κάθε πώληση μειώνει αυτόματα — κανένα έξτρα tap */
    setProducts(ps=>ps.map(p=>{
      const sold = v.lines.filter(l=>l.productId===p.id).length;
      return sold>0 && p.stock!=null ? {...p, stock:Math.max(0,p.stock-sold)} : p;
    }));
  };
  const addExpense = e => setExpenses(es=>[e,...es]);
  const addClient = c => { const id=uid(); setClients(cs=>[...cs,{...c,id,created:today()}]); return id; };
  /* Κατάλογος: upsert — νέο id αν δεν υπάρχει. Deactivate αντί delete. */
  const saveService = svc => setServices(ss => svc.id ? ss.map(s=>s.id===svc.id?svc:s) : [...ss,{...svc,id:uid(),active:true}]);
  const saveProduct = p => setProducts(ps => p.id ? ps.map(x=>x.id===p.id?p:x) : [...ps,{...p,id:uid(),active:true}]);
  /* Onboarding template — ΑΝΤΙΚΑΘΙΣΤΑ τον κατάλογο, φρέσκα id ανά είδος (spec §1δ) */
  const applyCatalogTemplate = tpl => Promise.all([
    setServices(tpl.services.map(s=>({...s, id:uid(), active:true}))),
    setProducts(tpl.products.map(p=>({...p, id:uid(), active:true}))),
  ]);
  /* Επεξεργασία/διαγραφή εγγραφών — MASTER ΜΟΝΟ, ισχύει ΚΑΙ σε κλειδωμένες (Ζ) ημέρες,
     πάντα με πλήρες audit trail «ποιος/πότε/τι άλλαξε πριν→μετά» (spec §1β) */
  const softDelete = id => setVisits(vs=>vs.map(v=>{
    if(v.id!==id) return v;
    const at = today()+' '+nowTime();
    return {...v, deleted:{by:operator.id,at}, audit:[...(v.audit||[]),{id:uid(),by:operator.id,at,action:'delete',changes:[]}]};
  }));
  const editVisit = (id,next) => setVisits(vs=>vs.map(v=>{
    if(v.id!==id) return v;
    const at = today()+' '+nowTime();
    const changes = diffVisit(v,next);
    if(changes.length===0) return v;
    return {...v, ...next, audit:[...(v.audit||[]),{id:uid(),by:operator.id,at,action:'edit',changes}]};
  }));
  const softDeleteExpense = id => setExpenses(es=>es.map(e=>{
    if(e.id!==id) return e;
    const at = today()+' '+nowTime();
    return {...e, deleted:{by:operator.id,at}, audit:[...(e.audit||[]),{id:uid(),by:operator.id,at,action:'delete',changes:[]}]};
  }));
  const editExpense = (id,next) => setExpenses(es=>es.map(e=>{
    if(e.id!==id) return e;
    const at = today()+' '+nowTime();
    const changes = diffExpense(e,next);
    if(changes.length===0) return e;
    return {...e, ...next, audit:[...(e.audit||[]),{id:uid(),by:operator.id,at,action:'edit',changes}]};
  }));
  const updateVisitNote = (id,note) => setVisits(vs=>vs.map(v=>v.id===id?{...v,note}:v));

  /* Hard delete Ταμείου/εξόδων (31/07) — ΑΥΣΤΗΡΑ περιορισμένο, ΔΕΝ είναι σαν το «διόρθωση
     δοκιμαστικών» των αδειών/kudos/πελατών. Λόγος: ένα οικονομικό στοιχείο (έσοδο/έξοδο) που
     μπορεί να σβηστεί ΟΡΙΣΤΙΚΑ οποτεδήποτε είναι το ίδιο μηχανισμό που θα επέτρεπε απόκρυψη
     πραγματικού τζίρου από λογιστή/έλεγχο — γι' αυτό το soft-delete+audit ήταν εξαρχής κλειδωμένο
     ως μόνιμο. Απόφαση Ανδρέα (31/07): επιτρέπεται hard-delete ΜΟΝΟ όσο (α) είναι ΉΔΗ soft-deleted,
     (β) η εγγραφή είναι ΤΗΣ ΣΗΜΕΡΙΝΗΣ ημέρας, και (γ) η μέρα ΔΕΝ έχει κλειδώσει ακόμα με Ζ. Μόλις
     γίνει Ζ για μια μέρα, ΚΑΜΙΑ εγγραφή της δεν μπορεί ποτέ πια να σβηστεί οριστικά — μόνο
     soft-delete+audit, όπως πριν. Ο έλεγχος γίνεται ΚΑΙ εδώ (όχι μόνο στο UI) ως δεύτερη γραμμή. */
  const hardDeleteVisit = id => {
    const v = visits.find(x=>x.id===id);
    if(!v || !isDel(v) || v.date!==today() || zmap[v.date]) return { ok:false };
    setVisits(vs=>vs.filter(x=>x.id!==id));
    return { ok:true };
  };
  const hardDeleteExpense = id => {
    const e = expenses.find(x=>x.id===id);
    if(!e || !isDel(e) || e.date!==today() || zmap[e.date]) return { ok:false };
    setExpenses(es=>es.filter(x=>x.id!==id));
    return { ok:true };
  };

  const writeSched = (empId,dateStr,entry) => setSchedData(sd=>{
    const [y,m] = dateStr.split('-'); const d = dateStr.slice(-2);
    const next = JSON.parse(JSON.stringify(sd));
    if(entry===null){ if(next[y]?.[m]?.[empId]?.[d]) delete next[y][m][empId][d]; }
    else {
      next[y] = next[y]||{}; next[y][m] = next[y][m]||{}; next[y][m][empId] = next[y][m][empId]||{};
      next[y][m][empId][d] = entry;
    }
    return next;
  });

  const requestLeave = (from,to) => setLeaveReqs(rs=>[...rs,{id:uid(),empId:operator.id,from,to,reqAt:today(),status:'pending',masterMsg:''}]);
  const cancelReq = id => setLeaveReqs(rs=>rs.filter(r=>r.id!==id));
  const setSick = (dateStr,note) => writeSched(operator.id,dateStr,{status:'sick',start:'',end:'',note});
  /* Έγκριση: γράφει 'leave' σε όλες τις μέρες + ενημερώνεται live ο υπάλληλος (μελλοντικά RTDB) */
  const approveReq = id => {
    const r = leaveReqs.find(x=>x.id===id); if(!r) return;
    reqDates(r).forEach(d=>writeSched(r.empId,d,{status:'leave',start:'',end:'',note:''}));
    setLeaveReqs(rs=>rs.map(x=>x.id===id?{...x,status:'approved'}:x));
  };
  const declineReq = (id,msg) => setLeaveReqs(rs=>rs.map(x=>x.id===id?{...x,status:'declined',masterMsg:msg}:x));
  const saveZ = (date,data) => setZmap(z=>({...z,[date]:data}));
  const sendKudos = (empId,msg) => setKudos(ks=>[...ks,{id:uid(),empId,date:today(),msg,byName:operator?.name}]);

  const go = (t,sub) => { setTab(t); if(sub) setRepSub(sub); };

  if(!authReady){
    return (
      <div className="min-h-screen hero flex items-center justify-center">
        <p className="text-white/80 text-sm font-semibold">{t('loadingApp')}</p>
      </div>
    );
  }
  if(!fbUser){
    return <LoginScreen shopName={settings.shopName} busy={authBusy} err={authErr} onLogin={doLogin}/>;
  }
  if(!operator){
    return <OperatorPicker shopName={settings.shopName} staff={staff} pins={pins} onPick={setOperator}
      myId={authAccounts[(fbUser.email||'').toLowerCase()]?.id}/>;
  }

  const isMaster = operator.role===ROLE.MASTER;
  const pendingCount = leaveReqs.filter(r=>r.status==='pending').length;
  const titles = { home:'Glamager', add:t('titleAdd'), reg:t('navRegister'), rep:t('navReports'), clients:t('navClients'), z:t('titleZ') };
  /* live lookup — ώστε το VisitDetail να δείχνει φρέσκα δεδομένα αμέσως μετά από edit */
  const selVisitLive = selVisit ? visits.find(x=>x.id===selVisit.id) : null;

  return (
    <div style={{minHeight:'100dvh',background:'var(--bg)'}}>
      <Header title={titles[tab]} sub={settings.shopName} operator={operator}
        onSettings={()=>setShowSettings(true)}
        onLock={lockNow}
        onClients={isMaster && tab!=='clients' ? ()=>setTab('clients') : null}
        onBack={isMaster && tab==='clients' ? ()=>setTab('home') : null}/>

      {/* 01/08 v3: hdr-spacer αντισταθμίζει το fixed Header (βλ. Header/CSS πιο πάνω) — το ίδιο
          div-wrapper για ΟΛΑ τα tabs, ώστε το περιεχόμενο να ξεκινάει πάντα κάτω από το header,
          ποτέ από κάτω του. */}
      <div className="hdr-spacer">
      {tab==='home' && (isMaster
        ? <HomeMaster visits={visits} expenses={expenses} staff={staffOnly} allStaff={staff} clients={clients} leaveReqs={leaveReqs} go={go} onZ={()=>setTab('z')} onOpenVisit={setSelVisit} onSendKudos={sendKudos}/>
        : <HomeStaff operator={operator} staff={staffOnly} allStaff={staff} schedData={schedData} leaveReqs={leaveReqs}
            visits={visits} clients={clients} kudos={kudos}
            onRequestLeave={requestLeave} onSetSick={setSick} onCancelReq={cancelReq}/>)}

      {/* 31/07 (v2 — διόρθωση μετά από συζήτηση): η επιλογή «ποιος εξυπηρέτησε» δεν βασίζεται στο
          role, βασίζεται στο serviceStaff (flag servesClients ανά άτομο, StaffManager). Ο Master
          ΔΕΝ μπαίνει αυτόματα εδώ πια — μόνο όποιος έχει πραγματικά servesClients=true (π.χ. Σοφία,
          Master+colorist). Η Ρεσεψιόν/λοιπός Master ΔΕΝ εμφανίζονται. Το πλήρες `staff` κρατιέται
          ΜΟΝΟ όπου χρειάζεται σωστή ΑΝΑΓΝΩΡΙΣΗ ονόματος ιστορικών εγγραφών (ClientsScreen/ClientCard,
          VisitDetail) — όχι για επιλογή. Πρόγραμμα/άδειες (staffmod/reqs) παραμένει staffOnly. */}
      {tab==='add' && <AddScreen operator={operator} staff={serviceStaff} services={services} products={products}
        clients={clients} visits={visits} expenses={expenses} onAddVisit={addVisit} onAddExpense={addExpense} onAddClient={addClient}
        onManageCatalog={()=>setCatalogOpen(true)} go={setTab}/>}

      {tab==='reg' && (operator.role===ROLE.STAFF
        ? <RegisterOwn operator={operator} visits={visits} clients={clients} zmap={zmap}/>
        : <RegisterFull operator={operator} visits={visits} expenses={expenses} staff={staff} serviceStaff={serviceStaff}
            clients={clients} zmap={zmap} expCats={expCats} onSoftDelete={softDelete} onEditVisit={editVisit}
            onSoftDeleteExpense={softDeleteExpense} onEditExpense={editExpense}
            onHardDeleteVisit={hardDeleteVisit} onHardDeleteExpense={hardDeleteExpense}/>)}

      {tab==='clients' && <ClientsScreen operator={operator} clients={clients} visits={visits} staff={staff} settings={settings} onUpdateNote={updateVisitNote} onDeleteClient={isMaster?deleteClient:null}/>}

      {tab==='rep' && isMaster && <ReportsScreen sub={repSub} setSub={setRepSub} visits={visits} expenses={expenses}
        staff={serviceStaff} staffOnly={staffOnly} clients={clients} schedData={schedData} leaveReqs={leaveReqs} kudos={kudos}
        onSaveDay={(empId,dk,entry)=>writeSched(empId,dk,entry)} onApprove={approveReq} onDecline={declineReq}
        onDeleteLeaveReq={deleteLeaveReq} onDeleteKudos={deleteKudos}/>}

      {tab==='z' && isMaster && <ZScreen visits={visits} expenses={expenses} staff={serviceStaff} zmap={zmap} onSaveZ={saveZ} onBack={()=>setTab('home')}/>}
      </div>

      {tab!=='z' && <Nav active={tab} go={setTab} operator={operator} pendingCount={pendingCount}/>}

      {selVisitLive && <VisitDetail v={selVisitLive} staff={staff} clients={clients} operator={operator}
        locked={!!zmap[selVisitLive.date]} onDel={softDelete} onEdit={editVisit} onClose={()=>setSelVisit(null)} onHardDelete={hardDeleteVisit}/>}

      {catalogOpen && isMaster && (
        <CatalogManager services={services} products={products}
          vatServiceDefault={settings.aegeanIslands?17:(parseInt(settings.vatServiceDefault)||24)}
          vatProductDefault={settings.aegeanIslands?17:(parseInt(settings.vatProductDefault)||24)}
          onSaveService={saveService} onSaveProduct={saveProduct} onClose={()=>setCatalogOpen(false)}/>
      )}

      {expCatsOpen && isMaster && (
        <ExpenseCatManager cats={expCats} onSave={saveExpCat} onDelete={deleteExpCat} onClose={()=>setExpCatsOpen(false)}/>
      )}

      {fixedExpOpen && isMaster && (
        <FixedExpensesManager items={fixedExpenses} cats={expCats} onSave={saveFixedExpense} onDelete={deleteFixedExpense} onClose={()=>setFixedExpOpen(false)}/>
      )}

      {templatePickerOpen && isMaster && (
        <CatalogTemplatePicker onApply={applyCatalogTemplate} onClose={()=>setTemplatePickerOpen(false)}/>
      )}

      {staffManagerOpen && isMaster && (
        <StaffManager staff={staff} onSave={saveStaffMember} onClose={()=>setStaffManagerOpen(false)}/>
      )}

      {showSettings && (
        <SettingsSheet onClose={()=>setShowSettings(false)} theme={theme} setTheme={setTheme}
          accent={accent} setAccent={setAccent} settings={settings} updateSettings={updateSettings} staff={staff} isMaster={isMaster}
          onOpenCatalog={isMaster?()=>{setShowSettings(false);setCatalogOpen(true);}:null}
          onOpenExpCats={isMaster?()=>{setShowSettings(false);setExpCatsOpen(true);}:null}
          onOpenFixedExp={isMaster?()=>{setShowSettings(false);setFixedExpOpen(true);}:null}
          onOpenTemplates={isMaster?()=>{setShowSettings(false);setTemplatePickerOpen(true);}:null}
          onOpenStaffManager={isMaster?()=>{setShowSettings(false);setStaffManagerOpen(true);}:null}
          onChangePassword={changePassword} onChangePin={changePin}
          deviceEmail={fbUser?.email} onFullSignOut={fullSignOut} onWipeDemoData={wipeDemoData}/>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
