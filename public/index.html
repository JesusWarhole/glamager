const CatalogManager = ({services,products,onSaveService,onSaveProduct,onClose,vatServiceDefault=24,vatProductDefault=24}) => {
  const [tab,setTab] = useState('sv');
  const [edit,setEdit] = useState(null); // αντικείμενο σε επεξεργασία (draft)
  const [pendingImport,setPendingImport] = useState(null);
  const fileRef = useRef(null);
  const isSv = tab==='sv';
  const list = isSv ? services : products;

  const blank = () => isSv
    ? { id:null, name:'', cat:SERVICE_CATS[0], price:'', dur:'', vat:vatServiceDefault, active:true }
    : { id:null, name:'', use:'resale', price:'', vat:vatProductDefault, stock:'', low:2, active:true };

  const startEdit = item => setEdit(JSON.parse(JSON.stringify(item)));
  const set = (k,v) => setEdit(e=>({...e,[k]:v}));

  const canSave = edit && edit.name?.trim() && parseFloat(edit.price)>0 && (!isSv || parseFloat(edit.dur)>=0);
  const save = async () => {
    const clean = {...edit, name:edit.name.trim(), price:parseFloat(edit.price)||0, vat:parseInt(edit.vat)||24};
    try{
      if(isSv){ clean.dur = parseInt(edit.dur)||0; await onSaveService(clean); }
      else { clean.stock = edit.stock===''?null:parseInt(edit.stock)||0; clean.low = parseInt(edit.low)||0; await onSaveProduct(clean); }
      setEdit(null);
    }catch(err){ window.alert(t('saveFailedPrefix')+' '+((err&&(err.message||err.code))||String(err))); }
  };

  /* Λίστα Παραγγελίας — active προϊόντα ομαδοποιημένα ανά κατηγορία χρήσης, με σήμανση όσων χρειάζονται restock */
  const exportOrderList = () => {
    const rows = [[t('usageCategoryColLabel'), t('nameLabel'), t('stockColLabel'), t('thresholdColLabel'), t('needsOrderColLabel'), t('priceColLabel')]];
    [...products].filter(p=>p.active!==false)
      .sort((a,b)=>{
        const ua=PRODUCT_USES.findIndex(u=>u[0]===a.use), ub=PRODUCT_USES.findIndex(u=>u[0]===b.use);
        return ua-ub || a.name.localeCompare(b.name,'el');
      })
      .forEach(p=>{
        const rowUseLabel = puLabel(p.use);
        const needs = p.stock!=null && p.stock<=p.low;
        rows.push([rowUseLabel, p.name, p.stock??'—', p.low, needs?t('yesLabel'):'', fmt(p.price)]);
      });
    downloadCSV(`Glamager_Λίστα_Παραγγελίας_${today()}.csv`, rows);
  };

  /* Export/Import καταλόγου (backup ή μαζική επεξεργασία σε Excel) — τα literals 'Υπηρεσία'/'Προϊόν'/'ΝΑΙ'/'ΟΧΙ' στις ΤΙΜΕΣ (όχι στις επικεφαλίδες) ΔΕΝ μεταφράζονται σκόπιμα: είναι εσωτερικοί δείκτες μορφής που διαβάζονται ξανά στο import ανεξαρτήτως γλώσσας UI */
  const exportCatalog = () => {
    const rows = [[t('typeLabel'), t('nameLabel'), t('catUseColLabel'), t('priceColLabel'), t('durationMinColLabel'), t('vatPercentColLabel'), t('stockColLabel'), t('thresholdColLabel'), t('activeLabel')]];
    services.forEach(s=>rows.push(['Υπηρεσία', s.name, s.cat||'', s.price, s.dur, s.vat, '', '', s.active!==false?'ΝΑΙ':'ΟΧΙ']));
    products.forEach(p=>rows.push(['Προϊόν', p.name, p.use||'', p.price, '', p.vat, p.stock??'', p.low, p.active!==false?'ΝΑΙ':'ΟΧΙ']));
    downloadCSV(`Glamager_Κατάλογος_${today()}.csv`, rows);
  };
  const triggerImport = () => fileRef.current?.click();
  const handleImportFile = ev => {
    const file = ev.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const allRows = parseCSV(String(reader.result));
      const data = allRows.slice(1); // πετάμε το header
      const svcUpdates=[], svcNew=[], prUpdates=[], prNew=[];
      data.forEach(r=>{
        const [type,name,catUse,price,dur,vat,stock,low,active] = r;
        if(!name || !name.trim()) return;
        const isActive = active!=='ΟΧΙ';
        if(type==='Υπηρεσία'){
          const existing = services.find(s=>s.name===name.trim());
          const obj = { id:existing?existing.id:null, name:name.trim(), cat:catUse||SERVICE_CATS[0], price:parseFloat(price)||0, dur:parseInt(dur)||0, vat:parseInt(vat)||24, active:isActive };
          (existing?svcUpdates:svcNew).push(obj);
        } else if(type==='Προϊόν'){
          const existing = products.find(p=>p.name===name.trim());
          const obj = { id:existing?existing.id:null, name:name.trim(), use:catUse||'resale', price:parseFloat(price)||0, vat:parseInt(vat)||24, stock:stock===''?null:parseInt(stock)||0, low:parseInt(low)||2, active:isActive };
          (existing?prUpdates:prNew).push(obj);
        }
      });
      setPendingImport({svcUpdates,svcNew,prUpdates,prNew});
    };
    reader.readAsText(file, 'UTF-8');
    ev.target.value = '';
  };
  const commitImport = async () => {
    if(!pendingImport) return;
    try{
      await Promise.all([
        ...[...pendingImport.svcUpdates, ...pendingImport.svcNew].map(onSaveService),
        ...[...pendingImport.prUpdates, ...pendingImport.prNew].map(onSaveProduct),
      ]);
      setPendingImport(null);
    }catch(err){ window.alert(t('saveFailedPrefix')+' '+((err&&(err.message||err.code))||String(err))); }
  };

  return (
    <div className="modal-bg fade" onClick={onClose}>
      <div className="modal pop" onClick={e=>e.stopPropagation()} style={{maxHeight:'92vh'}}>
        <div className="flex items-center justify-between mb-3">
          <h2 className="text-lg font-black" style={{color:'var(--text)'}}>{t('catalogLabel')}</h2>
          <div className="flex items-center gap-1.5">
            <button onClick={exportCatalog} title={t('exportCatalogTitleAttr')} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--accent-50)'}}><Ic n="download" s={15} c="var(--accent-600)"/></button>
            <button onClick={triggerImport} title={t('importCatalogTitleAttr')} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="download" s={15} c="var(--text-dim)" cls="rotate-180"/></button>
            <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={handleImportFile} className="hidden"/>
            <button onClick={onClose} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="x" s={16} c="var(--text-dim)"/></button>
          </div>
        </div>

        {pendingImport && (
          <div className="rounded-2xl p-4 mb-3 border" style={{background:'var(--accent-50)',borderColor:'var(--accent-100)'}}>
            <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--accent-600)'}}>{t('importPreviewLabel')}</p>
            <p className="text-sm mb-3" style={{color:'var(--text)'}}>
              {t('servicesLabel')}: {pendingImport.svcNew.length} {t('newFemLabel')}, {pendingImport.svcUpdates.length} {t('updatesLabel')}<br/>
              {t('productsLabel')}: {pendingImport.prNew.length} {t('newNeuterLabel')}, {pendingImport.prUpdates.length} {t('updatesLabel')}
            </p>
            <div className="flex gap-2">
              <button onClick={()=>setPendingImport(null)} className="px-4 py-2.5 rounded-xl font-bold text-sm" style={{background:'var(--surface)',color:'var(--text-dim)'}}>{t('cancelBtn')}</button>
              <button onClick={commitImport} className="flex-1 py-2.5 rounded-xl font-black text-white text-sm" style={{background:'var(--accent-600)'}}>{t('confirmImportBtn')}</button>
            </div>
          </div>
        )}

        {/* Tabs */}
        <div className="rounded-xl p-1 flex gap-1 mb-3" style={{background:'var(--soft)'}}>
          {[['sv',t('servicesTabLabel')],['pr',t('productsTabLabel')]].map(([v,l])=>(
            <button key={v} onClick={()=>{setTab(v);setEdit(null);}} className={`flex-1 py-2 rounded-lg text-xs font-bold ${tab===v?'shadow':''}`} style={tab===v?{background:'var(--surface)',color:'var(--accent-600)'}:{color:'var(--text-dim)'}}>{l}</button>
          ))}
        </div>

        {!isSv && (
          <button onClick={exportOrderList} className="w-full py-2.5 rounded-xl font-bold text-xs mb-3 flex items-center justify-center gap-1.5" style={{background:'var(--soft)',color:'var(--text-dim)'}}>
            <Ic n="download" s={13} c="var(--text-dim)"/> {t('orderListBtn')}
          </button>
        )}

        {/* Φόρμα επεξεργασίας/νέου */}
        {edit ? (
          <div className="rounded-2xl p-4 mb-3 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
            <p className="text-xs font-black uppercase tracking-wide mb-3" style={{color:'var(--accent-600)'}}>{edit.id?t('editActionLabel'):t('newItemLabel')}</p>
            <div className="mb-3"><CInput label={t('nameLabel')} value={edit.name} onChange={v=>set('name',v)}/></div>
            {isSv ? (<React.Fragment>
              <p className="text-[10px] font-bold mb-1.5" style={{color:'var(--text-dim)'}}>{t('serviceCategoryHint')}</p>
              <div className="flex gap-2 flex-wrap mb-3">
                {SERVICE_CATS.map(c=><button key={c} onClick={()=>set('cat',c)} className={`chip ${edit.cat===c?'on':''}`}>{catLabel(c)}</button>)}
              </div>
              <div className="flex gap-2 mb-3">
                <CInput label={t('priceEuroLabel')} value={edit.price} onChange={v=>set('price',v)} type="number"/>
                <CInput label={t('durationMinLabel')} value={edit.dur} onChange={v=>set('dur',v)} type="number"/>
                <CInput label={t('vatPercentLabel')} value={edit.vat} onChange={v=>set('vat',v)} type="number" w={80}/>
              </div>
            </React.Fragment>) : (<React.Fragment>
              <p className="text-[10px] font-bold mb-1.5" style={{color:'var(--text-dim)'}}>{t('useHintLabel')}</p>
              <div className="flex gap-2 flex-wrap mb-3">
                {PRODUCT_USES.map(([v])=><button key={v} onClick={()=>set('use',v)} className={`chip ${edit.use===v?'on':''}`}>{puLabel(v)}</button>)}
              </div>
              <div className="flex gap-2 mb-3">
                <CInput label={t('priceEuroLabel')} value={edit.price} onChange={v=>set('price',v)} type="number"/>
                <CInput label={t('vatPercentLabel')} value={edit.vat} onChange={v=>set('vat',v)} type="number" w={80}/>
              </div>
              <div className="flex gap-2 mb-3">
                <CInput label={t('stockEmptyHintLabel')} value={edit.stock} onChange={v=>set('stock',v)} type="number"/>
                <CInput label={t('lowThresholdLabel')} value={edit.low} onChange={v=>set('low',v)} type="number" w={90}/>
              </div>
            </React.Fragment>)}
            {edit.id && (
              <div className="flex items-center justify-between mb-3 rounded-xl px-3 py-2.5 border" style={{background:'var(--surface)',borderColor:'var(--border)'}}>
                <div><p className="text-sm font-bold" style={{color:'var(--text)'}}>{t('activeLabel')}</p><p className="text-[10px]" style={{color:'var(--text-dim)'}}>{t('deactivateInsteadHint')}</p></div>
                <button onClick={()=>set('active',!edit.active)} className={`w-12 h-6 rounded-full flex items-center transition-all`} style={{background:edit.active?'var(--accent-600)':'#d1d5db'}}>
                  <div className="w-5 h-5 bg-white rounded-full shadow mx-0.5 transition-all" style={{transform:edit.active?'translateX(24px)':'none'}}/>
                </button>
              </div>
            )}
            <div className="flex gap-2">
              <button onClick={()=>setEdit(null)} className="px-4 py-3 rounded-2xl font-bold text-sm" style={{background:'var(--surface)',color:'var(--text-dim)'}}>{t('cancelBtn')}</button>
              <button onClick={save} disabled={!canSave} className="flex-1 py-3 rounded-2xl font-black text-white text-sm disabled:opacity-30" style={{background:'var(--accent-600)'}}>{t('saveChangesBtn')}</button>
            </div>
          </div>
        ) : (
          <button onClick={()=>setEdit(blank())} className="w-full py-3 rounded-2xl font-bold text-sm border-2 border-dashed mb-3" style={{borderColor:'var(--accent-100)',color:'var(--accent-600)'}}>+ {t('newLabel')} {isSv?t('serviceUnitLabel'):t('productUnitLabel')}</button>
        )}

        {/* Λίστα */}
        <div className="space-y-1.5">
          {list.map(item=>(
            <button key={item.id} onClick={()=>startEdit(item)} className={`w-full card px-4 py-3 flex items-center justify-between text-left ${item.active===false?'opacity-40':''}`}>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold truncate" style={{color:'var(--text)'}}>{itemLabel(item)}{item.active===false?` · ${t('inactiveItemLabel')}`:''}</p>
                <p className="text-xs" style={{color:'var(--text-dim)'}}>
                  {isSv ? `${catLabel(item.cat||'Άλλο')} · ${item.dur}′ · ${t('vatAbbrev')} ${item.vat}%`
                        : `${puLabel(item.use)} · ${t('vatAbbrev')} ${item.vat}%${item.stock!=null?` · ${t('stockLabel')} ${item.stock}${item.stock<=item.low?' ⚠️':''}`:''}`}
                </p>
              </div>
              <p className="font-black amt" style={{color:'var(--accent-600)'}}>{fmt(item.price)}</p>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
};

/* Κύρια οθόνη καταχώρησης */
const AddScreen = ({operator,staff,services,products,clients,visits,expenses,onAddVisit,onAddExpense,onAddClient,onManageCatalog,go}) => {
  /* 31/07: default attribution — ΜΟΝΟ αν ο χειριστής είναι ο ίδιος κατ.2 (STAFF, άρα σχεδόν
     σίγουρα μέσα στο serviceStaff `staff` param εδώ) δίνει default τον εαυτό του. Master ή
     Ρεσεψιόν δεν είναι εγγυημένα service-providers πια (βλ. servesClients) — default στον
     πρώτο πραγματικό service-provider της λίστας αντί να δείξει ένα μη επιλέξιμο id. */
  const defStaff = operator.role===ROLE.STAFF ? operator.id : staff[0]?.id;
  const [type,setType] = useState('income');
  const [lines,setLines] = useState([]);
  const [picker,setPicker] = useState(false);
  const [editIdx,setEditIdx] = useState(null);
  const [pm,setPm] = useState('cash');
  const [tip,setTip] = useState('');
  const [tipStaffId,setTipStaffId] = useState(defStaff);
  const [tipTouched,setTipTouched] = useState(false); // true μόλις ο χρήστης διαλέξει χειροκίνητα άτομο για tip
  const [tipSplitOn,setTipSplitOn] = useState(false);   // «για τα κορίτσια» — tip μοιρασμένο σε 2+ άτομα
  const [tipSplitIds,setTipSplitIds] = useState([]);    // ενεργό μόνο όταν tipSplitOn
  const [tipPm,setTipPm] = useState('cash');
  const [note,setNote] = useState('');
  const [cq,setCq] = useState('');          // client query
  const [clientId,setClientId] = useState(null);
  const [newPhone,setNewPhone] = useState('');
  const [showNew,setShowNew] = useState(false);
  const [done,setDone] = useState(false);
  /* expense */
  const [eCat,setECat] = useState('');
  const [eAmt,setEAmt] = useState('');
  const [eNote,setENote] = useState('');

  const total = lines.reduce((s,l)=>s+lineTotal(l),0);
  const tp = parseFloat(tip)||0;

  const clientSel = clientId ? clients.find(c=>c.id===clientId) : null;
  const sugg = useMemo(()=>{
    if(clientSel || cq.trim().length<2) return [];
    const nq = norm(cq.trim());
    return clients.filter(c=>norm(c.name).includes(nq)).slice(0,5);
  },[cq,clientId,clients]);

  /* Συχνότητα κατηγορίας εξόδου (ιστορικό) — τα πιο συχνά (καφές, λογαριασμοί κ.λπ.) πρώτα, ίδιο ★ πατρόν με τον κατάλογο */
  const eCatFreq = useMemo(()=>{
    const f = {};
    (expenses||[]).filter(e=>!isDel(e)).forEach(e=>{ f[e.cat]=(f[e.cat]||0)+1; });
    return f;
  },[expenses]);

  const addLine = item => {
    // το staffId έρχεται ήδη έτοιμο από το CatalogPicker (βήμα «ποιος το έκανε»)
    setLines(ls=>[...ls,{...item, disc:0, discType:'amt'}]);
    setPicker(false);
  };

  // Tip: αυτόματο default στο άτομο της ΤΕΛΕΥΤΑΙΑΣ γραμμής του καλαθιού (συνήθως αυτός/ή που το πήρε το tip),
  // όχι σε "πρώτος αλφαβητικά" — παύει να ενημερώνεται μόλις ο χρήστης διαλέξει χειροκίνητα (tipTouched).
  useEffect(() => {
    if(tipTouched) return;
    const guess = lines.length>0 ? lines[lines.length-1].staffId : defStaff;
    if(guess!==tipStaffId) setTipStaffId(guess);
  }, [lines]);

  const saveIncome = () => {
    if(lines.length===0) return;
    let cid = clientId;
    if(!cid && showNew && cq.trim()){
      cid = onAddClient({name:cq.trim(), phone:newPhone.trim(), patronym:''});
    }
    const useSplit = tipSplitOn && tipSplitIds.length>=2;
    onAddVisit({
      id:uid(), date:today(), time:nowTime(), clientId:cid||null, pm,
      tip:tp, tipStaffId:(tp>0 && !useSplit)?tipStaffId:null, tipSplit:(tp>0 && useSplit)?[...tipSplitIds]:null, tipPm:tp>0?tipPm:null,
      note:note.trim(), lines:[...lines], enteredBy:operator.id, deleted:null, audit:[],
    });
    setDone(true);
    setTimeout(()=>{ setDone(false); setLines([]); setNote(''); setTip(''); setTipStaffId(defStaff); setTipTouched(false); setTipSplitOn(false); setTipSplitIds([]); setCq(''); setClientId(null); setShowNew(false); setNewPhone(''); go('reg'); },900);
  };

  const saveExpense = () => {
    const a = parseFloat(eAmt)||0;
    if(!(a>0)||!eCat) return;
    onAddExpense({ id:uid(), date:today(), time:nowTime(), cat:eCat, amt:a, note:eNote.trim(), enteredBy:operator.id, deleted:null, audit:[] });
    setDone(true);
    setTimeout(()=>{ setDone(false); setEAmt(''); setECat(''); setENote(''); go('reg'); },900);
  };

  if(done) return (
    <div className="flex flex-col items-center justify-center py-36 fade">
      <div className="w-20 h-20 rounded-full flex items-center justify-center mb-4" style={{background:'var(--accent-100)'}}><Ic n="check" s={40} c="var(--accent-600)"/></div>
      <p className="text-xl font-black" style={{color:'var(--text)'}}>{t('savedBang')}</p>
    </div>
  );

  return (
    <div className="px-4 safe-pb">
      {/* Τύπος: το προσωπικό καταχωρεί ΚΑΙ έξοδα/τιμολόγια (spec §6) —
          τα έξοδα μπαίνουν πάντα ΤΕΛΙΚΑ, χωρίς κανένα κουμπί ΦΠΑ */}
      <div className="rounded-2xl p-1 flex mt-4 mb-4" style={{background:'var(--soft)'}}>
        <button onClick={()=>setType('income')} className={`flex-1 py-3 rounded-xl text-sm font-black transition-all ${type==='income'?'text-white shadow':''}`} style={type==='income'?{background:'var(--accent-600)'}:{color:'var(--text-dim)'}}>↑ {t('incomeTab')}</button>
        <button onClick={()=>setType('expense')} className={`flex-1 py-3 rounded-xl text-sm font-black transition-all ${type==='expense'?'bg-red-500 text-white shadow':''}`} style={type!=='expense'?{color:'var(--text-dim)'}:{}}>↓ {t('expenseTab')}</button>
      </div>

      {type==='income' ? (<React.Fragment>
        {/* Καλάθι */}
        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('cartLabel')}</p>
        <div className="space-y-2 mb-2">
          {lines.map((l,i)=>(
            <button key={i} onClick={()=>setEditIdx(i)} className="w-full card px-4 py-3 flex items-center gap-3 text-left">
              <div className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'var(--accent-100)'}}>
                <Ic n={l.kind==='product'?'tag':'zap'} s={15} c="var(--accent-600)"/>
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold truncate" style={{color:'var(--text)'}}>{l.name}</p>
                <p className="text-xs" style={{color:'var(--text-dim)'}}>{staff.find(s=>s.id===l.staffId)?.name||'—'}{lineDiscount(l)>0.005?` · ${t('discAbbrevInline')} −${fmt(lineDiscount(l))}`:''}</p>
              </div>
              <p className="font-black amt" style={{color:'var(--accent-600)'}}>{fmt(lineTotal(l))}</p>
            </button>
          ))}
        </div>
        <button onClick={()=>setPicker(true)} className="w-full py-3 rounded-2xl font-bold text-sm border-2 border-dashed mb-3" style={{borderColor:'var(--accent-100)',color:'var(--accent-600)'}}>{t('addItemBtn')}</button>

        {lines.length>0 && (
          <div className="card px-4 py-3 mb-3 flex justify-between items-center">
            <span className="text-sm font-black" style={{color:'var(--text)'}}>{t('totalLabel')}</span>
            <span className="text-2xl font-black amt" style={{color:'var(--accent-600)'}}>{fmt(total)}</span>
          </div>
        )}

        {/* Πληρωμή — default Μετρητά (έξυπνα defaults) */}
        <div className="card p-4 mb-3">
          <p className="text-xs font-bold uppercase tracking-wide mb-3" style={{color:'var(--text-dim)'}}>{t('paymentMethodLabel')}</p>
          <div className="flex gap-2">
            {[['cash',t('cashLabel'),'cash'],['pos',t('posCardLabel'),'card']].map(([v,l,ic])=>(
              <button key={v} onClick={()=>setPm(v)} className="flex-1 flex flex-col items-center gap-1.5 py-3 rounded-xl border-2" style={pm===v?{borderColor:'var(--accent-600)',background:'var(--accent-50)'}:{borderColor:'var(--border)',background:'var(--soft)'}}>
                <Ic n={ic} s={17} c={pm===v?'var(--accent-600)':'var(--text-dim)'}/>
                <span className="text-xs font-bold" style={{color:pm===v?'var(--accent-600)':'var(--text-dim)'}}>{l}</span>
              </button>
            ))}
          </div>
        </div>

        {/* Tip — αποδίδεται σε υπάλληλο */}
        <div className="card p-4 mb-3">
          <p className="text-xs font-bold uppercase tracking-wide mb-3" style={{color:'var(--text-dim)'}}>{t('tipSectionLabel')}</p>
          <div className="flex gap-3 items-center">
            <div className="flex-1 flex items-baseline gap-1">
              <span className="text-lg font-black" style={{color:'var(--text-dim)'}}>€</span>
              <input type="number" value={tip} onChange={e=>setTip(e.target.value)} placeholder="0,00" step="0.01" min="0" inputMode="decimal" className="text-xl font-black text-yellow-500 bg-transparent border-none outline-none w-full amt"/>
            </div>
            {tp>0 && <div className="flex gap-1">
              {[['cash',t('cashAbbrev')],['pos','POS']].map(([v,l])=>(
                <button key={v} onClick={()=>setTipPm(v)} className={`chip ${tipPm===v?'on':''}`}>{l}</button>
              ))}
            </div>}
          </div>
          {tp>0 && (<React.Fragment>
            <div className="flex items-center justify-between mt-3 mb-1">
              <p className="text-[10px] font-bold uppercase tracking-wide" style={{color:'var(--text-dim)'}}>{tipSplitOn?t('splitAmongLabel'):t('whoTookItLabel')}</p>
              {/* «για τα κορίτσια» — split το tip σε 2+ άτομα αντί για ένα */}
              <button onClick={()=>{
                if(tipSplitOn){ setTipStaffId(tipSplitIds[0]||tipStaffId); setTipTouched(true); setTipSplitOn(false); setTipSplitIds([]); }
                else { setTipSplitIds(tipStaffId?[tipStaffId]:[]); setTipSplitOn(true); }
              }} className="flex items-center gap-1 text-[11px] font-black px-2 py-1 rounded-lg" style={tipSplitOn?{background:'var(--accent-600)',color:'white'}:{background:'var(--soft)',color:'var(--text-dim)'}}>
                <Ic n="split" s={12} c={tipSplitOn?'white':'var(--text-dim)'}/> Split
              </button>
            </div>
            <div className="flex gap-2 flex-wrap">
              {staff.map(s=>{
                const on = tipSplitOn ? tipSplitIds.includes(s.id) : tipStaffId===s.id;
                return (
                  <button key={s.id} onClick={()=>{
                    if(tipSplitOn) setTipSplitIds(ids=>ids.includes(s.id)?ids.filter(x=>x!==s.id):[...ids,s.id]);
                    else { setTipStaffId(s.id); setTipTouched(true); }
                  }} className={`chip ${on?'on':''}`}>{s.name}</button>
                );
              })}
            </div>
            {tipSplitOn && <p className="text-[11px] mt-2" style={{color:'var(--text-dim)'}}>
              {tipSplitIds.length>=2 ? `${fmt(tp)} ÷ ${tipSplitIds.length} = ${fmt(tp/tipSplitIds.length)} ${t('perPersonLabel')}` : t('pickAtLeast2')}
            </p>}
          </React.Fragment>)}
        </div>

        {/* Σύνδεση πελάτη — προαιρετικό layer, autocomplete */}
        <div className="card p-4 mb-3">
          <p className="text-xs font-bold uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('clientOptionalLabel')}</p>
          {clientSel ? (
            <div className="flex items-center justify-between rounded-xl px-3 py-2.5" style={{background:'var(--accent-50)'}}>
              <div><p className="text-sm font-bold" style={{color:'var(--text)'}}>{clientSel.name}</p><p className="text-xs" style={{color:'var(--text-dim)'}}>{clientSel.phone||'—'}</p></div>
              <button onClick={()=>{setClientId(null);setCq('');}} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:'var(--surface)'}}><Ic n="x" s={13} c="var(--text-dim)"/></button>
            </div>
          ) : (<React.Fragment>
            <input type="text" value={cq} onChange={e=>{setCq(e.target.value);setShowNew(false);}} placeholder={t('fullNamePlaceholder')} className="w-full text-sm outline-none bg-transparent mb-1" style={{color:'var(--text)'}}/>
            {sugg.length>0 && <div className="space-y-1 mt-1">
              {sugg.map(c=>(
                <button key={c.id} onClick={()=>{setClientId(c.id);}} className="w-full text-left rounded-xl px-3 py-2 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
                  <p className="text-sm font-bold" style={{color:'var(--text)'}}>{c.name}</p>
                  <p className="text-xs" style={{color:'var(--text-dim)'}}>{[c.phone,c.patronym].filter(Boolean).join(' · ')||'—'}</p>
                </button>
              ))}
            </div>}

        </div>

        <button onClick={saveIncome} disabled={lines.length===0} className="w-full py-4 rounded-2xl font-black text-white text-base disabled:opacity-30" style={{background:'var(--accent-600)'}}>

        </button>
      </React.Fragment>) : (<React.Fragment>
        {/* ΕΞΟΔΟ — πάντα τελική τιμή, καμία ερώτηση ΦΠΑ.

          <p className="text-xs font-bold uppercase tracking-wide mb-3" style={{color:'var(--text-dim)'}}>{t('categoryLabel')}</p>

              <button key={c.id} onClick={()=>setECat(c.name)} className={`chip ${eCat===c.name?'on':''}`}>{c.name}{(eCatFreq[c.name]||0)>1?' ★':''}</button>
            ))}

        </div>
        <div className="card px-4 py-3 mb-4">
          <input type="text" value={eNote} onChange={e=>setENote(e.target.value)} placeholder={t('noteOptionalPlaceholder')} className="w-full text-sm outline-none bg-transparent" style={{color:'var(--text)'}}/>
        </div>
        <button onClick={saveExpense} disabled={!(parseFloat(eAmt)>0)||!eCat} className="w-full py-4 rounded-2xl font-black text-white text-base bg-red-500 disabled:opacity-30">
          ↓ {t('recordExpenseLabel')}
        </button>
      </React.Fragment>)}

      {picker && <CatalogPicker services={services} products={products} visits={visits} staff={staff}
        defaultStaffId={lines.length>0 ? lines[lines.length-1].staffId : (operator.role===ROLE.STAFF?operator.id:null)}
        onPick={addLine} onClose={()=>setPicker(false)}
        onManage={operator.role===ROLE.MASTER && onManageCatalog ? ()=>{setPicker(false);onManageCatalog();} : null}/>}
      {editIdx!=null && <LineEditor line={lines[editIdx]} staff={staff}
        onChange={nl=>setLines(ls=>ls.map((l,i)=>i===editIdx?nl:l))}
        onRemove={()=>setLines(ls=>ls.filter((_,i)=>i!==editIdx))}
        onClose={()=>setEditIdx(null)}/>}
    </div>
  );
};

/* ═══════════════ ΤΑΜΕΙΟ — τρία views ανά ρόλο ═══════════════ */

const DateNav = ({date,setDate}) => (
  <div className="flex items-center gap-2 px-4 py-3 sticky z-30" style={{top:73,background:'var(--surface)',borderBottom:'1px solid var(--border)'}}>
    <button onClick={()=>setDate(addDays(date,-1))} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="back" s={16} c="var(--text-dim)"/></button>
    <div className="flex-1 text-center"><p className="text-sm font-black" style={{color:'var(--text)'}}>{date===today()?`📅 ${t('todayLabel')}`:fmtDLong(date)}</p></div>
    <button onClick={()=>{const n=addDays(date,1); if(n<=today()) setDate(n);}} disabled={date>=today()} className="w-9 h-9 rounded-xl flex items-center justify-center disabled:opacity-30" style={{background:'var(--soft)'}}><Ic n="next" s={16} c="var(--text-dim)"/></button>
  </div>
);

/* Ταμείο κατ.2 — ΜΟΝΟ οι γραμμές με ΔΙΚΟ ΤΟΥ attribution (όποιος κι αν τις
   πληκτρολόγησε — ρεσεψιόν/ίδιος/συνάδελφος/Master), live, + δικά του tips.
   ΚΑΝΕΝΑ σύνολο/άθροισμα πουθενά — ρητή απόφαση. */
const RegisterOwn = ({operator,visits,clients,zmap}) => {
  const [date,setDate] = useState(today());
  const dV = visits.filter(v=>v.date===date && !isDel(v)).sort((a,b)=>b.time.localeCompare(a.time));
  const rows = [];
  dV.forEach(v=>v.lines.forEach((l,i)=>{ if(l.staffId===operator.id) rows.push({v,l,key:v.id+'-'+i}); }));
  const myTips = dV.filter(v=>tipShareFor(v,operator.id)>0);
  return (
    <div className="safe-pb">
      <DateNav date={date} setDate={setDate}/>
      <div className="px-4 pt-3">
        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('myWorkLabel')} {zmap[date]?'· 🔒':''}</p>
        {rows.length>0
          ? <div className="space-y-2">{rows.map(r=><LineRow key={r.key} v={r.v} l={r.l} clients={clients}/>)}</div>
          : <div className="card py-12 text-center"><p className="font-bold" style={{color:'var(--text-dim)'}}>{t('noOwnLinesToday')}</p></div>}
        {myTips.length>0 && (
          <div className="mt-4">
            <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('myTipsLabel')}</p>
            <div className="space-y-2">
              {myTips.map(v=>(
                <div key={v.id} className="card px-4 py-3 flex items-center justify-between">
                  <p className="text-sm font-bold" style={{color:'var(--text)'}}>💛 {v.time}{v.clientId?` · ${clients.find(c=>c.id===v.clientId)?.name||''}`:''}{v.tipSplit?.length>1?` · split ÷${v.tipSplit.length}`:''}</p>
                  <p className="font-black amt text-yellow-500">{fmt(tipShareFor(v,operator.id))}</p>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* Επεξεργασία εξόδου — κατηγορία (chips από τις Ρυθμίσεις) + ποσό + σημείωση */

        <div className="mb-3"><CInput label={t('amountEuroLabel')} value={amt} onChange={setAmt} type="number"/></div>

/* ExpenseDetail — καρτέλα εξόδου (δεν υπήρχε καθόλου πριν, μόνο static γραμμή) */

            <p className="text-xs font-bold uppercase tracking-wide mb-1.5 flex items-center gap-1" style={{color:'var(--text-dim)'}}><Ic n="note" s={13} c="#f59e0b"/> {t('noteLabel')}</p>
            <p className="text-sm rounded-xl p-3 whitespace-pre-wrap break-words border" style={{background:'#fffbeb',borderColor:'#fef3c7',color:'#78350f'}}>{e.note}</p>

/* Ταμείο κατ.1 (Ρεσεψιόν) & Master — ΟΛΙΚΟ ταμείο ημέρας.
   Ρεσεψιόν: όλα (το «κατάστιχο» του μαγαζιού), tips ανά υπάλληλο,
   ΧΩΡΙΣ ΦΠΑ (master-only), χωρίς delete.
   Master: + ΦΠΑ, + φίλτρο ανά υπάλληλο, + soft delete + audit. */
const RegisterFull = ({operator,visits,expenses,staff,serviceStaff,clients,zmap,expCats,onSoftDelete,onEditVisit,onSoftDeleteExpense,onEditExpense,onHardDeleteVisit,onHardDeleteExpense}) => {
  const isMaster = operator.role===ROLE.MASTER;
  const [date,setDate] = useState(today());
  const [filterStaff,setFilterStaff] = useState('all');
  const [sel,setSel] = useState(null);
  const [selExp,setSelExp] = useState(null);
  const dV = visits.filter(v=>v.date===date).sort((a,b)=>b.time.localeCompare(a.time));
  const dE = expenses.filter(e=>e.date===date);
  const sum = summarize(dV,dE);
  /* 31/07: tips/φίλτρο ανά υπάλληλο → serviceStaff (μόνο όσοι πραγματικά εξυπηρετούν πελάτες).
     Η ονοματολογία σε VisitRow/VisitDetail παρακάτω παραμένει το πλήρες `staff` (ιστορικό). */
  const stf = staffSummary(dV,serviceStaff).filter(s=>s.tips>0);
  const locked = !!zmap[date];

  /* Master φίλτρο: line-level view σαν κατ.2 */
  const filteredRows = [];
  if(filterStaff!=='all'){
    dV.filter(v=>!isDel(v)).forEach(v=>v.lines.forEach((l,i)=>{ if(l.staffId===filterStaff) filteredRows.push({v,l,key:v.id+'-'+i}); }));
  }
  /* live lookup ώστε το modal να δείχνει φρέσκα δεδομένα αμέσως μετά από edit (όχι stale snapshot) */
  const selLive = sel ? visits.find(x=>x.id===sel.id) : null;
  const selExpLive = selExp ? expenses.find(x=>x.id===selExp.id) : null;

  return (
    <div className="safe-pb">
      <DateNav date={date} setDate={setDate}/>

      {isMaster && (
        <div className="px-4 pt-3 flex gap-2 overflow-x-auto pb-1">
          <button onClick={()=>setFilterStaff('all')} className={`chip ${filterStaff==='all'?'on':''}`}>{t('allStaffLabel')}</button>
          {serviceStaff.map(s=><button key={s.id} onClick={()=>setFilterStaff(s.id)} className={`chip ${filterStaff===s.id?'on':''}`}>{s.name}</button>)}
        </div>
      )}

      {/* Σύνοψη ημέρας — Ρεσεψιόν ΝΑΙ (ολικό ταμείο), ΦΠΑ ΟΧΙ (master only) */}
      {filterStaff==='all' && (
        <div className="mx-4 mt-3 mb-3 card overflow-hidden">
          <div className="px-4 py-2" style={{background:'var(--soft)',borderBottom:'1px solid var(--border)'}}>
            <p className="text-xs font-bold uppercase tracking-wide" style={{color:'var(--text-dim)'}}>{t('summaryLabel')} {fmtD(date)} {locked&&`· 🔒 ${t('lockedZLabel')}`}</p>
          </div>
          <div className="grid grid-cols-3" style={{borderBottom:'1px solid var(--border)'}}>
            {[[t('cashLabel'),sum.cash],['POS',sum.pos],[t('totalLabel'),sum.gross]].map(([l,v],i)=>(
              <div key={l} className="p-3 text-center" style={i>0?{borderLeft:'1px solid var(--border)'}:{}}>
                <p className="text-xs mb-1" style={{color:'var(--text-dim)'}}>{l}</p>
                <p className="font-black amt" style={{color:l==='POS'?'#3b82f6':'var(--accent-600)'}}>{fmt(v)}</p>
              </div>
            ))}
          </div>
          <div className="grid grid-cols-3">
            <div className="p-3 text-center"><p className="text-xs mb-1" style={{color:'var(--text-dim)'}}>{t('expLabel')}</p><p className="font-bold text-red-500 amt">-{fmt(sum.expTotal)}</p></div>
            <div className="p-3 text-center" style={{borderLeft:'1px solid var(--border)'}}><p className="text-xs mb-1 text-yellow-500">Tips</p><p className="font-bold text-yellow-500 amt">{fmt(sum.tips)}</p></div>
            {isMaster
              ? <div className="p-3 text-center" style={{borderLeft:'1px solid var(--border)'}}><p className="text-xs mb-1 text-amber-500">{t('vatEstAbbrev')}</p><p className="font-bold text-amber-600 amt">{fmt(sum.netVat)}</p></div>
              : <div className="p-3 text-center" style={{borderLeft:'1px solid var(--border)'}}><p className="text-xs mb-1" style={{color:'var(--text-dim)'}}>{t('netLabel')}</p><p className="font-bold amt" style={{color:'var(--accent-600)'}}>{fmt(sum.netBalance)}</p></div>}
          </div>
          {isMaster && <div className="px-4 py-3 flex justify-between items-center" style={{background:'var(--accent-50)',borderTop:'1px solid var(--border)'}}>
            <span className="text-sm font-black" style={{color:'var(--text)'}}>{t('netBalanceShortLabel')}</span>
            <span className="text-lg font-black amt" style={{color:sum.netBalance>=0?'var(--accent-600)':'#dc2626'}}>{fmt(sum.netBalance)}</span>
          </div>}
        </div>
      )}

      {/* Tips ανά υπάλληλο — το βλέπει και η Ρεσεψιόν */}
      {filterStaff==='all' && stf.length>0 && (
        <div className="mx-4 mb-3 card overflow-hidden">
          <div className="px-4 py-2" style={{background:'#fefce8',borderBottom:'1px solid #fef9c3'}}><p className="text-xs font-black uppercase tracking-wide" style={{color:'#ca8a04'}}>💛 {t('tipsPerStaffLabel')}</p></div>
          {stf.map((s,i)=>(
            <div key={s.id} className="flex justify-between items-center px-4 py-2.5" style={i>0?{borderTop:'1px solid var(--border)'}:{}}>
              <span className="text-sm font-bold" style={{color:'var(--text)'}}>{s.name}</span>
              <span className="font-black amt text-yellow-500">{fmt(s.tips)}</span>
            </div>
          ))}
        </div>
      )}

      <div className="px-4">
        {filterStaff==='all' ? (<React.Fragment>
          <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('movementsLabel')} ({dV.length})</p>

            ? <div className="space-y-2">{dV.map(v=>(

                  locked={locked} onOpen={setSel} onDel={isMaster?onSoftDelete:null}/>

            <div className="mt-4">
              <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('expLabel')} ({dE.length})</p>
              <div className="space-y-2">
                {dE.map(e=>(
                  <div key={e.id} onClick={()=>setSelExp(e)} className={`card px-4 py-3 flex items-center gap-3 ${isDel(e)?'soft-del':''}`} style={{cursor:'pointer'}}>
                    <div className="w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center bg-red-50"><Ic n="tag" s={16} c="#ef4444"/></div>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm font-bold truncate" style={{color:'var(--text)'}}>{e.cat}</p>
                      <p className="text-xs" style={{color:'var(--text-dim)'}}>{e.note?e.note+' · ':''}{e.time}</p>
                    </div>

                  </div>
                ))}
              </div>
            </div>
          )}

          <p className="text-xs font-black uppercase tracking-wide mb-2 mt-1" style={{color:'var(--text-dim)'}}>{t('linesHeaderLabel')}: {staff.find(s=>s.id===filterStaff)?.name}</p>
          {filteredRows.length>0
            ? <div className="space-y-2">{filteredRows.map(r=><LineRow key={r.key} v={r.v} l={r.l} clients={clients}/>)}</div>
            : <div className="card py-12 text-center"><p className="font-bold" style={{color:'var(--text-dim)'}}>{t('noLinesLabel')}</p></div>}
        </React.Fragment>)}
      </div>

      {selLive && <VisitDetail v={selLive} staff={staff} clients={clients} operator={operator} locked={locked}
        onDel={onSoftDelete} onEdit={onEditVisit} onClose={()=>setSel(null)} onHardDelete={onHardDeleteVisit}/>}

      {selExpLive && <ExpenseDetail e={selExpLive} staff={staff} operator={operator} expCats={expCats} locked={locked}
        onDel={onSoftDeleteExpense} onEdit={onEditExpense} onClose={()=>setSelExp(null)} onHardDelete={onHardDeleteExpense}/>}
    </div>
  );
};

/* ═══════════════ ΠΕΛΑΤΟΛΟΓΙΟ ═══════════════
   Tab για προσωπικό (search πάνω-πάνω — καθημερινή ανάγκη),
   icon στο header για Master. ΠΛΗΡΗΣ πρόσβαση ιστορικού/χρωματολογίας
   για ΟΛΟΥΣ. Στατιστικά αξίας πελάτη: Master + Ρεσεψιόν ΜΟΝΟ. */

const ClientCard = ({client,visits,staff,operator,settings,onBack,onUpdateNote,onDeleteClient}) => {
  const canStats = operator.role===ROLE.MASTER || operator.role===ROLE.RECEPTION;
  const hist = visits.filter(v=>v.clientId===client.id && !isDel(v)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  /* Hard delete πελάτη (31/07) — ΜΟΝΟ αν δεν έχει ΚΑΜΙΑ επίσκεψη πουθενά, ούτε soft-deleted
     (γι' αυτό ελέγχουμε το ακατέργαστο `visits`, όχι το φιλτραρισμένο `hist`) — αλλιώς μια παλιά
     επίσκεψη θα έμενε με ορφανό clientId. */
  const hasAnyVisit = visits.some(v=>v.clientId===client.id);
  const canDelete = operator.role===ROLE.MASTER && !!onDeleteClient;
  const last = hist[0];
  /* Αδράνεια πελάτη (spec §1ε) — όριο από τις Ρυθμίσεις, καθαρά πληροφοριακό */
  const inactiveThreshold = parseInt(settings?.clientInactivityDays)||60;
  const daysSinceLast = last ? Math.floor((new Date(today())-new Date(last.date))/86400000) : null;
  const isInactive = daysSinceLast!=null && daysSinceLast>=inactiveThreshold;
  const products = [];
  hist.forEach(v=>v.lines.forEach(l=>{ if(l.kind==='product') products.push({date:v.date,name:l.name,price:lineTotal(l),staff:staff.find(s=>s.id===l.staffId)?.name}); }));
  const total = hist.reduce((s,v)=>s+visitTotal(v),0);
  const yearVisits = hist.filter(v=>v.date>=`${CUR_Y}-01-01`).length;
  const [editing,setEditing] = useState(null); // visitId
  const [draft,setDraft] = useState('');

  /* Καλείται ως συνάρτηση — ΟΧΙ <NoteBlock/> — για να μη χάνει focus το textarea */
  const NoteBlock = ({v,big}) => (
    editing===v.id ? (
      <div className="mt-2">
        <textarea value={draft} onChange={e=>setDraft(e.target.value)} rows={2} className="w-full rounded-xl px-3 py-2 text-sm outline-none border" style={{background:'var(--surface)',color:'var(--text)',borderColor:'var(--border)'}}/>
        <div className="flex gap-2 mt-1">
          <button onClick={()=>{onUpdateNote(v.id,draft.trim());setEditing(null);}} className="px-3 py-1.5 rounded-lg text-xs font-black text-white" style={{background:'var(--accent-600)'}}>OK</button>
          <button onClick={()=>setEditing(null)} className="px-3 py-1.5 rounded-lg text-xs font-bold" style={{background:'var(--soft)',color:'var(--text-dim)'}}>{t('cancelBtn')}</button>
        </div>
      </div>
    ) : (
      <button onClick={()=>{setEditing(v.id);setDraft(v.note||'');}} className={`block w-full text-left mt-1 ${big?'text-sm':'text-xs'}`} style={{color:v.note?'#78350f':'var(--text-dim)'}}>
        {v.note ? `📝 ${v.note}` : `📝 ${t('addNoteInline')}`} <span className="opacity-50">✏️</span>
      </button>
    )
  );

  return (
    <div className="px-4 pt-4 safe-pb">
      <button onClick={onBack} className="flex items-center gap-2 text-sm font-bold mb-3" style={{color:'var(--accent-600)'}}><Ic n="back" s={16}/> {t('navClients')}</button>
      <div className="card p-4 mb-3 flex items-start justify-between gap-2">
        <div className="min-w-0">
          <p className="text-xl font-black" style={{color:'var(--text)'}}>{client.name}</p>
          <p className="text-xs mt-0.5" style={{color:'var(--text-dim)'}}>{[client.phone,client.patronym&&`${t('patronymPrefix')} ${client.patronym}`].filter(Boolean).join(' · ')||'—'}</p>
        </div>
        {canDelete && (
          hasAnyVisit
            ? <span title={t('clientDeleteBlockedTitleAttr')} className="text-[10px] font-bold px-2 py-1 rounded-lg flex-shrink-0" style={{background:'var(--soft)',color:'var(--text-dim)'}}>🔒 {t('clientDeleteBlockedLabel')}</span>
            : <button onClick={()=>{ if(window.confirm(t('hardDeleteConfirm'))) onDeleteClient(client.id); }}
                title={t('hardDeleteTitleAttr')} className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:'var(--soft)'}}>
                <Ic n="trash" s={14} c="#dc2626"/>
              </button>
        )}
      </div>

      {/* Τελευταία επίσκεψη + σημείωση — πάνω-πάνω, μεγάλο: ο «μπούσουλας».
          Οι σημειώσεις ΔΕΝ κλειδώνουν με το Ζ — επεξεργάσιμες πάντα. */}
      {last ? (
        <div className="rounded-2xl p-4 mb-3 border" style={{background:'#fffbeb',borderColor:'#fde68a'}}>
          <div className="flex items-center justify-between gap-2 mb-1">
            <p className="text-xs font-black uppercase tracking-wide" style={{color:'#b45309'}}>{t('lastVisitLabel')} — {fmtD(last.date)}</p>
            {isInactive && <span className="text-[10px] font-black px-2 py-0.5 rounded-lg flex-shrink-0" style={{background:'#fee2e2',color:'#dc2626'}}>😴 {t('inactiveLabel')} · {daysSinceLast}{t('daysAbbrev')}</span>}
          </div>
          <p className="text-sm font-bold" style={{color:'#78350f'}}>{last.lines.map(l=>l.name).join(' + ')} · {staff.find(s=>s.id===last.lines[0]?.staffId)?.name||''}</p>
          {NoteBlock({v:last,big:true})}
        </div>
      ) : <div className="card py-8 text-center mb-3"><p className="text-sm font-bold" style={{color:'var(--text-dim)'}}>{t('noVisitsYet')}</p></div>}

      {/* Στατιστικά — Master + Ρεσεψιόν (η Ρεσεψιόν απαντά σε «πόσες φορές ήρθα φέτος;») */}
      {canStats && hist.length>0 && (
        <div className="card overflow-hidden mb-3">
          <div className="grid grid-cols-3 text-center">
            {[[t('perVisitLabel'),fmt(total/hist.length)],[t('thisYearLabel'),yearVisits+' '+t('visitsAbbrev')],[t('totalValueLabel'),fmt(total)]].map(([l,v],i)=>(
              <div key={l} className="py-3" style={i>0?{borderLeft:'1px solid var(--border)'}:{}}>
                <p className="text-[10px]" style={{color:'var(--text-dim)'}}>{l}</p>
                <p className="text-sm font-black amt" style={{color:'var(--text)'}}>{v}</p>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Αγορές προϊόντων — ξεχωριστά: «τι σου έδωσα την προηγούμενη φορά» */}
      {products.length>0 && (
        <div className="mb-3">
          <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('productPurchasesLabel')}</p>
          <div className="card overflow-hidden">
            {products.map((p,i)=>(
              <div key={i} className="flex justify-between items-center px-4 py-2.5" style={i>0?{borderTop:'1px solid var(--border)'}:{}}>
                <div><p className="text-sm font-bold" style={{color:'var(--text)'}}>{p.name}</p><p className="text-xs" style={{color:'var(--text-dim)'}}>{fmtD(p.date)}{p.staff?` · ${p.staff}`:''}</p></div>
                <p className="font-bold amt text-sm" style={{color:'var(--accent-600)'}}>{fmt(p.price)}</p>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Πλήρες ιστορικό — όλοι (τιμές ανά γραμμή, όχι σούμα) */}
      <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('visitHistoryLabel')} ({hist.length})</p>
      <div className="space-y-2">
        {hist.map(v=>(
          <div key={v.id} className="card px-4 py-3">
            <div className="flex justify-between items-start">
              <div className="flex-1 min-w-0">
                <p className="text-xs font-bold" style={{color:'var(--text-dim)'}}>{fmtD(v.date)} · {v.time} · {pmName(v.pm)}</p>
                {v.lines.map((l,i)=>(
                  <p key={i} className="text-sm mt-1" style={{color:'var(--text)'}}>
                    <span className="font-bold">{l.name}</span>
                    <span style={{color:'var(--text-dim)'}}> · {staff.find(s=>s.id===l.staffId)?.name||'—'} · </span>
                    <span className="amt font-bold" style={{color:'var(--accent-600)'}}>{fmt(lineTotal(l))}</span>
                  </p>
                ))}
              </div>
            </div>
            {NoteBlock({v})}
          </div>
        ))}
      </div>
    </div>
  );
};

const ClientsScreen = ({operator,clients,visits,staff,settings,onUpdateNote,onDeleteClient}) => {
  const [q,setQ] = useState('');
  const [selId,setSelId] = useState(null);
  const [onlyInactive,setOnlyInactive] = useState(false);
  const sel = clients.find(c=>c.id===selId);
  /* Επιτυχής διαγραφή → γύρνα στη λίστα (ο επιλεγμένος πελάτης δεν υπάρχει πια) */
  const handleDeleteClient = onDeleteClient ? (id=>{ const res=onDeleteClient(id); if(res?.ok) setSelId(null); return res; }) : null;
  if(sel) return <ClientCard client={sel} visits={visits} staff={staff} operator={operator} settings={settings} onBack={()=>setSelId(null)} onUpdateNote={onUpdateNote} onDeleteClient={handleDeleteClient}/>;

  /* Αδράνεια πελάτη (spec §1ε) — όριο από τις Ρυθμίσεις. Χωρίς επίσκεψη ακόμα ≠ αδρανής (είναι νέος). */
  const inactiveThreshold = parseInt(settings?.clientInactivityDays)||60;
  const todayIso = today();
  const nq = norm(q.trim());
  const list = clients
    .map(c=>{
      const h=visits.filter(v=>v.clientId===c.id&&!isDel(v)).sort((a,b)=>b.date.localeCompare(a.date));
      const lastVisit = h[0]?.date||null;
      const daysSince = lastVisit ? Math.floor((new Date(todayIso)-new Date(lastVisit))/86400000) : null;
      return {...c, lastVisit, daysSince, inactive: daysSince!=null && daysSince>=inactiveThreshold};
    })
    .filter(c=>!nq||norm(c.name).includes(nq))
    .filter(c=>!onlyInactive || c.inactive)
    .sort((a,b)=>(b.lastVisit||'').localeCompare(a.lastVisit||''));
  const inactiveCount = clients.filter(c=>{
    const h=visits.filter(v=>v.clientId===c.id&&!isDel(v));
    if(h.length===0) return false;
    const lastVisit = h.sort((a,b)=>b.date.localeCompare(a.date))[0].date;
    return Math.floor((new Date(todayIso)-new Date(lastVisit))/86400000)>=inactiveThreshold;
  }).length;

  return (
    <div className="px-4 pt-4 safe-pb">
      {/* Search πάνω-πάνω — το χρειάζονται καθημερινά */}
      <div className="flex items-center gap-2 rounded-2xl px-4 py-3 mb-2 border" style={{background:'var(--surface)',borderColor:'var(--border)'}}>
        <Ic n="search" s={17} c="var(--text-dim)"/>
        <input type="text" value={q} onChange={e=>setQ(e.target.value)} placeholder={t('searchClientPlaceholder')} className="flex-1 text-sm outline-none bg-transparent" style={{color:'var(--text)'}}/>
        {q&&<button onClick={()=>setQ('')}><Ic n="x" s={14} c="var(--text-dim)"/></button>}
      </div>
      {inactiveCount>0 && (
        <button onClick={()=>setOnlyInactive(v=>!v)} className={`chip mb-3 ${onlyInactive?'on':''}`}>
          😴 {t('inactiveChipLabel')} ({inactiveCount}) · {t('moreThanLabel')} {inactiveThreshold} {t('dayCountPlural')}
        </button>
      )}
      <div className="space-y-2">
        {list.map(c=>(
          <button key={c.id} onClick={()=>setSelId(c.id)} className="w-full card px-4 py-3 flex items-center gap-3 text-left">
            <div className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style={{background:'var(--accent-100)'}}><Ic n="user" s={17} c="var(--accent-600)"/></div>
            <div className="flex-1 min-w-0">
              <p className="text-sm font-bold truncate" style={{color:'var(--text)'}}>{c.name}</p>
              <p className="text-xs truncate" style={{color:'var(--text-dim)'}}>
                {[c.phone, c.patronym&&`${t('patronymPrefix')} ${c.patronym}`, c.lastVisit&&`${t('lastAbbrev')} ${fmtD(c.lastVisit)}`].filter(Boolean).join(' · ')||'—'}
              </p>
            </div>
            {c.inactive && <span className="text-[10px] font-black px-2 py-0.5 rounded-lg flex-shrink-0" style={{background:'#fef3c7',color:'#b45309'}}>😴 {c.daysSince}{t('daysAbbrev')}</span>}
            <Ic n="next" s={15} c="var(--text-dim)"/>
          </button>
        ))}
        {list.length===0&&<div className="card py-12 text-center"><p className="font-bold" style={{color:'var(--text-dim)'}}>{t('noResultsLabel')}</p><p className="text-xs mt-1" style={{color:'var(--text-dim)'}}>{t('clientBookHint')}</p></div>}
      </div>
    </div>
  );
};

/* ═══════════════ ΑΝΑΦΟΡΕΣ (Master) ═══════════════
   Οικονομικά · Salon Staff (πλήρης διαχείριση — το υπάρχον module αυτούσιο,
   όχι δεύτερο παράλληλο σύστημα) · Αιτήματα άδειας (badge) */

/* DayModal Master — ΟΛΑ τα statuses (από SalonStaff, αυτούσια λογική) */
const MasterDayModal = ({dateStr,emp,entry,onSave,onClose}) => {
  const def = getDefaultStatus(dateStr,emp);
  const init = entry||def;
  const [status,setStatus] = useState(init.status);
  const [start,setStart] = useState(init.start||'');
  const [end,setEnd] = useState(init.end||'');
  const [note,setNote] = useState(init.note||'');
  const needsTime = ['overtime','early','festive'].includes(status);
  const pickStatus = s => {
    setStatus(s);
    if(['overtime','early','festive'].includes(s)){
      const sc=(emp.schedule||DEF_SCHEDULE)[dow(dateStr)];
      if(sc&&!start){setStart(sc.s);setEnd(sc.e);}
    }
    if(s==='holiday'&&!note) setNote(holidayLabel(dateStr)||'');
  };
  const d = new Date(dateStr+'T12:00:00');
  return (
    <div className="modal-bg fade" onClick={onClose}>
      <div className="modal pop" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div>
            <p className="font-black text-lg" style={{color:'var(--text)'}}>{dowFullName(dateStr)} {d.getDate()} {monName(d.getMonth()+1)}</p>
            <p className="font-bold text-sm" style={{color:'var(--accent-600)'}}>{emp.name}</p>
            {HOLIDAYS[dateStr]&&<p className="text-xs text-amber-600 font-semibold mt-0.5">🎉 {holidayLabel(dateStr)}</p>}
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="x" s={16} c="var(--text-dim)"/></button>
        </div>
        <div className="grid grid-cols-3 gap-2 mb-4">
          {STATUSES.map(s=>(
            <button key={s.id} onClick={()=>pickStatus(s.id)} className={`status-btn text-center ${status===s.id?'sel':''}`} style={{background:status===s.id?s.bg:'var(--soft)',color:s.color}}>
              <span className="text-xl">{s.emoji}</span>
              <span className="text-xs font-bold leading-tight">{stLabel(s)}</span>
            </button>
          ))}
        </div>
        {needsTime && (
          <div className="rounded-2xl p-4 mb-3" style={{background:'var(--accent-50)'}}>
            <div className="flex items-center gap-3">
              <div className="flex-1"><p className="text-xs mb-1" style={{color:'var(--text-dim)'}}>{t('fromLabel')}</p><input type="time" value={start} onChange={e=>setStart(e.target.value)} className="w-full rounded-xl px-3 py-2.5 text-sm font-bold border outline-none" style={{background:'var(--surface)',color:'var(--text)',borderColor:'var(--border)'}}/></div>
              <div className="mt-4 font-bold" style={{color:'var(--text-dim)'}}>→</div>
              <div className="flex-1"><p className="text-xs mb-1" style={{color:'var(--text-dim)'}}>{t('untilLabel')}</p><input type="time" value={end} onChange={e=>setEnd(e.target.value)} className="w-full rounded-xl px-3 py-2.5 text-sm font-bold border outline-none" style={{background:'var(--surface)',color:'var(--text)',borderColor:'var(--border)'}}/></div>
            </div>
            {timeDiff(start,end)>0&&<p className="text-xs font-bold mt-2 text-center" style={{color:'var(--accent-600)'}}>{timeDiff(start,end).toFixed(1)} {t('hoursUnitFull')}</p>}
          </div>
        )}
        <input type="text" value={note} onChange={e=>setNote(e.target.value)} placeholder={t('notePlaceholder')} className="w-full rounded-xl px-4 py-3 text-sm border outline-none mb-4" style={{background:'var(--soft)',color:'var(--text)',borderColor:'var(--border)'}}/>
        <div className="flex gap-2">
          {entry&&<button onClick={()=>{onSave(null);onClose();}} className="flex-1 py-3.5 rounded-2xl font-bold text-sm" style={{background:'var(--soft)',color:'var(--text-dim)'}}>↺ {t('resetBtn')}</button>}
          <button onClick={()=>{onSave({status,start:needsTime?start:'',end:needsTime?end:'',note});onClose();}} className="flex-1 py-3.5 rounded-2xl font-black text-white text-sm" style={{background:'var(--accent-600)'}}>{t('saveChangesBtn')}</button>
        </div>
      </div>
    </div>
  );
};

/* Salon Staff module (Master) — πρόγραμμα ΟΛΩΝ + στατιστικά + CSV */
const MasterStaffModule = ({staff,schedData,onSaveDay}) => {
  const [year,setYear] = useState(CUR_Y);
  const [month,setMonth] = useState(CUR_M);
  const [empId,setEmpId] = useState(staff[0]?.id);
  const [modal,setModal] = useState(null);
  const emp = staff.find(s=>s.id===empId)||staff[0];
  const days = daysInMonth(year,month);
  const empData = schedData[year]?.[pad2(month)]?.[emp.id]||{};

  let work=0,hours=0,sick=0,leave=0;
  for(let d=1;d<=days;d++){
    const dk=dateKey(year,month,d);
    const entry=empData[pad2(d)]||getDefaultStatus(dk,emp);
    if(['work','overtime','early','festive'].includes(entry.status)){work++;hours+=hoursForEntry(entry,emp,dk);}
    if(entry.status==='sick')sick++;
    if(entry.status==='leave')leave++;
  }
  const leaveUsed = leaveUsedInYear(schedData,year,emp.id);
  const leaveLeft = Math.max(0,(emp.leaveTotal||20)-leaveUsed);

  const exportCSV = () => {
    const rows=[[t('csvDayCol'),t('csvDateCol'),t('csvEmployeeCol'),t('csvStatusCol'),t('fromLabel'),t('untilLabel'),t('csvHoursCol'),t('csvNoteCol')]];
    for(let d=1;d<=days;d++){
      const dk=dateKey(year,month,d);
      staff.forEach(e=>{
        const entry=schedData[year]?.[pad2(month)]?.[e.id]?.[pad2(d)]||getDefaultStatus(dk,e);
        const hrs=hoursForEntry(entry,e,dk);
        rows.push([dowFullName(dk),dk,e.name,(stMap[entry.status]&&stLabel(stMap[entry.status]))||entry.status,entry.start||'',entry.end||'',hrs>0?hrs.toFixed(1):'',entry.note||'']);
      });
    }
    const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Glamager_Staff_${monName(month)}_${year}.csv`;a.click();
  };

  return (
    <div>
      <div className="flex items-center gap-2 mb-2">
        <button onClick={()=>{ if(month===1){setMonth(12);setYear(y=>y-1);} else setMonth(m=>m-1); }} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="back" s={16} c="var(--text-dim)"/></button>
        <div className="flex-1 text-center"><p className="font-black" style={{color:'var(--text)'}}>{monName(month)} {year}</p></div>
        <button onClick={()=>{ if(month===12){setMonth(1);setYear(y=>y+1);} else setMonth(m=>m+1); }} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="next" s={16} c="var(--text-dim)"/></button>
        <button onClick={exportCSV} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--accent-50)'}}><Ic n="download" s={16} c="var(--accent-600)"/></button>
      </div>
      <div className="flex gap-2 overflow-x-auto pb-2 mb-2">
        {staff.map(s=><button key={s.id} onClick={()=>setEmpId(s.id)} className={`chip ${empId===s.id?'on':''}`}>{s.name}</button>)}
      </div>

      <div className="card overflow-hidden mb-3">
        <div className="grid grid-cols-4 text-center">
          {[['✅',work,t('statWorkAbbr')],['⏱️',hours.toFixed(1),t('statHoursAbbr')],['🤒',sick,t('statSickAbbr')],['🏖️',leave,t('stLeave')]].map(([e,v,l],i)=>(
            <div key={l} className="py-3" style={i>0?{borderLeft:'1px solid var(--border)'}:{}}>
              <div className="text-base mb-0.5">{e}</div><div className="font-black text-sm" style={{color:'var(--text)'}}>{v}</div><div className="text-[10px]" style={{color:'var(--text-dim)'}}>{l}</div>
            </div>
          ))}
        </div>
        <div className="px-4 py-3" style={{borderTop:'1px solid var(--border)'}}>
          <div className="flex justify-between mb-1"><span className="text-xs" style={{color:'var(--text-dim)'}}>{t('leaveBalanceLabel')} {year}</span><span className="text-xs font-black" style={{color:'#0891b2'}}>{leaveLeft}/{emp.leaveTotal||20}</span></div>
          <div className="progress-bar"><div className="progress-fill" style={{width:`${Math.min(100,(leaveUsed/(emp.leaveTotal||20))*100)}%`,background:'#0891b2'}}/></div>
        </div>
      </div>

      <div className="space-y-1.5">
        {Array.from({length:days},(_,i)=>{
          const d=i+1, dk=dateKey(year,month,d);
          const raw=empData[pad2(d)];
          const entry=raw||getDefaultStatus(dk,emp);
          const st=stMap[entry.status]||stMap.work;
          const needsTime=['overtime','early','festive'].includes(entry.status);
          return (
            <div key={d} onClick={()=>setModal({dk,raw})} className="day-cell flex items-center gap-3 px-4 py-2.5" style={{background:st.bg,border:`1.5px solid ${st.border}`,...(dk===today()?{boxShadow:'0 0 0 2px var(--accent-600)'}:{})}}>
              <div className="w-10 text-center flex-shrink-0"><p className="text-[10px] font-bold text-gray-400">{dowShort(dk)}</p><p className="text-lg font-black text-gray-700">{d}</p></div>
              <div className="text-lg flex-shrink-0">{st.emoji}</div>
              <div className="flex-1 min-w-0">
                <p className="font-bold text-sm" style={{color:st.color}}>{stLabel(st)}</p>
                {entry.status==='work'&&(()=>{ const sc=(emp.schedule||DEF_SCHEDULE)[dow(dk)]; return sc?<p className="text-xs text-gray-500">{sc.s} – {sc.e}</p>:null; })()}
                {needsTime&&entry.start&&<p className="text-xs text-gray-500">🕐 {entry.start} – {entry.end} ({timeDiff(entry.start,entry.end).toFixed(1)}{t('hourAbbrev')})</p>}
                {entry.note&&<p className="text-xs text-gray-500 truncate">📝 {entry.note}</p>}
                {birthdaysOn(dk,staff).length>0&&<p className="text-xs font-bold" style={{color:'#db2777'}}>🎂 {t('birthdaysLabel')}: {birthdaysOn(dk,staff).map(b=>b.age!=null?`${b.name} (${b.age})`:b.name).join(', ')}!</p>}
                {annivOn(dk,staff).map(a=><p key={a.name} className="text-xs font-bold" style={{color:'#d97706'}}>🎉 {LANG==='en'?`${a.years} years — ${a.name} at the shop`:`${a.years} χρόνια ${a.name} στο μαγαζί`}</p>)}
                {namedaysOn(dk).length>0&&<p className="text-xs truncate" style={{color:'#7c3aed'}}>🎈 {namedaysOn(dk).join(', ')}</p>}
                {worldDayOn(dk)&&<p className="text-xs truncate" style={{color:'#0ea5e9'}}>🌍 {worldDayOn(dk).join(' · ')}</p>}
              </div>
              <div className="w-6 h-6 rounded-lg bg-white/60 flex items-center justify-center flex-shrink-0"><Ic n="next" s={13} c={st.color}/></div>
            </div>
          );
        })}
      </div>

      {modal && <MasterDayModal dateStr={modal.dk} emp={emp} entry={modal.raw}
        onSave={entry=>onSaveDay(emp.id,modal.dk,entry)} onClose={()=>setModal(null)}/>}
    </div>
  );
};

/* Αιτήματα άδειας (Master) — έγκριση/απόρριψη με προαιρετικό μήνυμα */
const LeaveRequests = ({leaveReqs,staff,onApprove,onDecline,onDelete}) => {
  const [declining,setDeclining] = useState(null);
  const [msg,setMsg] = useState('');
  const pending = leaveReqs.filter(r=>r.status==='pending');
  const rest = leaveReqs.filter(r=>r.status!=='pending').sort((a,b)=>b.reqAt.localeCompare(a.reqAt));
  /* Hard delete (31/07) — ΞΕΧΩΡΙΣΤΟ από approve/decline. Οι άδειες δεν είναι οικονομικό στοιχείο,
     άρα δεν χρειάζονται soft-delete/audit σαν το Ταμείο — ο Master μπορεί να σβήσει οριστικά ένα
     λάθος/δοκιμαστικό αίτημα, pending ή ήδη κλεισμένο, με ένα confirm. */
  const Req = ({r,actions}) => {
    const emp = staff.find(s=>s.id===r.empId);
    const n = reqDates(r).length;
    return (
      <div className="card p-4">
        <div className="flex items-center justify-between gap-2">
          <div className="flex-1 min-w-0">
            <p className="text-sm font-black" style={{color:'var(--text)'}}>🏖️ {emp?.name}</p>
            <p className="text-xs mt-0.5" style={{color:'var(--text-dim)'}}>{fmtD(r.from)} – {fmtD(r.to)} · {n} {n===1?t('dayCountSingular'):t('dayCountPlural')} · {t('requestedOnLabel')} {fmtD(r.reqAt)}</p>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            {!actions && <span className="text-xs font-black px-2 py-0.5 rounded-full" style={r.status==='approved'?{background:'#d1fae5',color:'#059669'}:{background:'#fee2e2',color:'#dc2626'}}>{r.status==='approved'?t('reqApproved'):t('reqDeclined')}</span>}
            {onDelete && (
              <button onClick={()=>{ if(window.confirm(t('hardDeleteConfirm'))) onDelete(r.id); }}
                title={t('hardDeleteTitleAttr')} className="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0" style={{background:'var(--soft)'}}>
                <Ic n="trash" s={13} c="#dc2626"/>
              </button>
            )}
          </div>
        </div>
        {r.status==='declined'&&r.masterMsg&&<p className="text-xs mt-2 rounded-xl px-3 py-2" style={{background:'var(--soft)',color:'var(--text-dim)'}}>💬 {r.masterMsg}</p>}
        {actions && (declining===r.id ? (
          <div className="mt-3">
            <input autoFocus type="text" value={msg} onChange={e=>setMsg(e.target.value)} placeholder={t('declineMsgPlaceholder')} className="w-full rounded-xl px-3 py-2.5 text-sm border outline-none mb-2" style={{background:'var(--soft)',color:'var(--text)',borderColor:'var(--border)'}}/>
            <div className="flex gap-2">
              <button onClick={()=>{onDecline(r.id,msg.trim());setDeclining(null);setMsg('');}} className="flex-1 py-2.5 rounded-xl font-black text-white text-sm bg-red-500">{t('declineBtn')}</button>
              <button onClick={()=>{setDeclining(null);setMsg('');}} className="px-4 py-2.5 rounded-xl font-bold text-sm" style={{background:'var(--soft)',color:'var(--text-dim)'}}>{t('cancelBtn')}</button>
            </div>
          </div>
        ) : (
          <div className="flex gap-2 mt-3">
            <button onClick={()=>onApprove(r.id)} className="flex-1 py-2.5 rounded-xl font-black text-white text-sm" style={{background:'var(--accent-600)'}}>✓ {t('approveBtn')}</button>
            <button onClick={()=>setDeclining(r.id)} className="flex-1 py-2.5 rounded-xl font-bold text-sm border-2 border-red-200 text-red-500">✕ {t('declineBtn')}</button>
          </div>
        ))}
      </div>
    );
  };
  return (
    <div className="space-y-2">
      {pending.length>0
        ? pending.map(r=><React.Fragment key={r.id}>{Req({r,actions:true})}</React.Fragment>)
        : <div className="card py-10 text-center"><p className="font-bold" style={{color:'var(--text-dim)'}}>{t('noPendingRequests')}</p></div>}
      {rest.length>0 && (<React.Fragment>
        <p className="text-xs font-black uppercase tracking-wide pt-3" style={{color:'var(--text-dim)'}}>{t('historyLabel')}</p>
        {rest.map(r=><React.Fragment key={r.id}>{Req({r,actions:false})}</React.Fragment>)}
      </React.Fragment>)}
    </div>
  );
};

/* Kudos manager (31/07) — μέρος του ίδιου «διόρθωση δοκιμαστικών» εργαλείου με τις Άδειες
   (ίδια οθόνη, sub==='reqs'). Πριν δεν υπήρχε ΚΑΝΕΝΑ σημείο για τον Master να δει τη λίστα
   όλων των kudos (μόνο ο κάθε υπάλληλος έβλεπε τα δικά του, πρόσφατα, στην Αρχική του) —

  const sorted = [...kudos].sort((a,b)=>b.date.localeCompare(a.date));
  return (
    <div className="mt-5">
      <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>👏 {t('kudosManagerTitle')}</p>
      {sorted.length===0
        ? <div className="card py-8 text-center"><p className="text-sm font-bold" style={{color:'var(--text-dim)'}}>{t('kudosManagerEmpty')}</p></div>
