    html{height:100%;overflow:hidden;}
    /* 01/08 v2: overflow:hidden + height:100% στο html/body ΔΕΝ αρκεί σε standalone iOS PWA —
       το document παραμένει μέρος του native scroll view και «ανασαίνει» με vh recalculation
       (env(safe-area)/Dynamic Island) κάθε φορά που τραβάς, με header και nav bar να μετακινούνται
       αντίθετα (το ένα κατεβαίνει, το άλλο ανεβαίνει). position:fixed στο body το αποσυνδέει
       ΕΝΤΕΛΩΣ από το native scrolling — μηδέν εξάρτηση από vh/dvh, μόνο σταθερά pixel του
       πραγματικού device screen. */

    #root{position:absolute;inset:0;max-width:640px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}

<script>
/* 01/08: overscroll-behavior δεν σκοτώνει το native iOS rubber-band effect μέσα σε standalone
   PWA (Add to Home Screen) — μόνο το scroll-chaining στο parent/document. Σε tabs με λίγο
   περιεχόμενο (Αρχική, +) το #root δεν έχει καν πραγματικό υπερχείλισμα, οπότε ΚΑΘΕ κάθετο
   τράβηγμα το iOS το αντιμετωπίζει σαν "overscroll" και κάνει το ελαστικό bounce (μοιάζει με
   reload). Σε Ταμείο/Αναφορές δεν φαίνεται γιατί έχουν όντως αρκετό περιεχόμενο να scrollάρει.
   Fix: μπλοκάρουμε χειροκίνητα το touchmove όταν είτε (α) δεν υπάρχει καθόλου πραγματικό
   scroll στο πλησιέστερο scrollable ancestor, είτε (β) έχουμε φτάσει στο πάνω/κάτω άκρο του και
   συνεχίζουμε προς την ίδια κατεύθυνση. Οριζόντια gestures (π.χ. chip filters) αγνοούνται. */
(function(){
  var startX=0, startY=0;
  function scrollParent(el){
    while(el && el!==document.body && el!==document.documentElement){
      var cs=window.getComputedStyle(el);
      if((cs.overflowY==='auto'||cs.overflowY==='scroll') && el.scrollHeight>el.clientHeight){
        return el;
      }
      el=el.parentElement;
    }
    return document.getElementById('root');
  }
  document.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(e.touches.length!==1) return;
    var dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
    if(Math.abs(dx)>Math.abs(dy)) return; // οριζόντιο gesture, μην το πειράξεις
    var el=scrollParent(e.target);
    var atTop = el.scrollTop<=0;
    var atBottom = el.scrollTop+el.clientHeight >= el.scrollHeight-1;
    var noScroll = el.scrollHeight <= el.clientHeight+1;
    if (noScroll || (atTop && dy>0) || (atBottom && dy<0)) {
      e.preventDefault();
    }
  }, {passive:false});
})();
</script>

/* ── useFirebaseState: useState-like hook αλλά backed από RTDB path, live μεταξύ συσκευών.
   - enabled=false (π.χ. πριν το login): ΔΕΝ ανοίγει listener καθόλου — μηδέν reads χωρίς auth.
   - Πρώτη φορά ποτέ (path άδειο): γράφει το seed (demo/αρχικά δεδομένα) στο Firebase.
   - Κάθε write κάνει πλήρες .set() στο path (όχι per-item push) — απλό, αρκετό για ένα μαγαζί/
     χούφτα συσκευών. Πιθανό (σπάνιο) ρίσκο: ταυτόχρονη αλλαγή από 2 συσκευές την ίδια στιγμή
     "κερδίζει" η τελευταία εγγραφή — αποδεκτό tradeoff για την κλίμακα αυτού του app. ── */
function useFirebaseState(path, seed, enabled){
  const [state,setState] = useState(seed);
  const stateRef = useRef(seed);
  useEffect(()=>{
    if(!enabled) return;
    const r = fbDb.ref(path);
    /* _seeded/<path>: flag ξεχωριστό από τα ίδια τα δεδομένα — λύνει bug όπου το άδειασμα μιας
       λίστας (π.χ. wipeDemoData όταν η μόνη εγγραφή ήταν demo) ξανάφερνε αυτόματα το seed.
       Αιτία: το Firebase RTDB ΔΕΝ αποθηκεύει κενά arrays/objects — ένα .set([]) ισοδυναμεί με
       .remove(), οπότε ο listener έβλεπε val===null και το διάβαζε σαν "ποτέ δεν αρχικοποιήθηκε".
       Με το flag ξέρουμε αν το path έχει ήδη seed-αριστεί έστω μία φορά — αν ναι, ένα επόμενο
       null σημαίνει "ο χρήστης το άδειασε σκόπιμα", ΟΧΙ "πρώτη φορά", άρα ΔΕΝ ξαναγράφουμε seed. */
    const seededRef = fbDb.ref('_seeded/'+path);
    const handler = snap => {
      const val = snap.val();
      if(val===null || val===undefined){
        seededRef.once('value').then(seededSnap=>{
          if(seededSnap.val()){
            const empty = Array.isArray(seed) ? [] : {};
            stateRef.current = empty;
            setState(empty);
          } else {
            r.set(seed);
            seededRef.set(true);
          }
        });
      } else {
        stateRef.current = val;
        setState(val);
      }
    };
    r.on('value', handler);
    return ()=>r.off('value', handler);
  },[path, enabled]);
  const write = useCallback(updater => {
    const next = typeof updater==='function' ? updater(stateRef.current) : updater;
    stateRef.current = next;
    setState(next);
    /* Επιστρέφει το Promise του .set() — έτσι ώστε καλούντες που το χρειάζονται (π.χ. wipeDemoData)
       να μπορούν να πιάσουν πραγματικά σφάλματα εγγραφής (π.χ. permission-denied από τα Security
       Rules) αντί να αποτυγχάνει σιωπηλά. Οι περισσότεροι callers αγνοούν το return value — ok. */
    if(!enabled) return Promise.resolve();
    fbDb.ref('_seeded/'+path).set(true);
    return fbDb.ref(path).set(next===undefined ? null : next);
  },[path, enabled]);
  return [state, write];
}

/* Γενέθλια — αποθήκευση: 18/07 μόνο 'MM-DD' (χωρίς έτος, οπότε ΔΕΝ γινόταν να υπολογιστεί ηλικία).
   19/07: αλλαγή σε πλήρες 'YYYY-MM-DD' (native <input type="date">, το πραγματικό έτος γέννησης
   πλέον αποθηκεύεται) ώστε το «Χρόνια πολλά {Όνομα}, γίνεσαι {Ν}!» να δουλέψει. ΔΙΑΤΗΡΕΙΤΑΙ
   backward-compatible με ΗΔΗ αποθηκευμένες παλιές εγγραφές 'MM-DD' (5 χαρακτήρες, χωρίς έτος —
   ήδη ζωντανές στο production Firebase πριν από αυτή την αλλαγή) μέσω μήκους string: αν έχει
   πάνω από 5 χαρακτήρες σημαίνει πλήρες 'YYYY-MM-DD', αλλιώς είναι το παλιό μορφότυπο και η
   ηλικία μένει άγνωστη (`age:null`) μέχρι κάποιος να το ξαναγράψει μέσω του StaffManager. */
const birthdayMonthDay = b => !b ? null : (b.length>5 ? b.slice(5) : b);
const birthdayYear = b => (b && b.length>5) ? parseInt(b.slice(0,4)) : null;
const birthdaysOn = (ds,staffList) => staffList
  .filter(s=>birthdayMonthDay(s.birthday)===ds.slice(5))
  .map(s=>{ const y=birthdayYear(s.birthday); return { name:s.name, age: y!=null ? parseInt(ds.slice(0,4))-y : null }; });

/* ── ΟΡΘΟΔΟΞΟ ΠΑΣΧΑ — αλγόριθμος Meeus (υπολογίζει το Ιουλιανό Πάσχα, μετατρέπει σε Γρηγοριανό
   ημερολόγιο· η διόρθωση +13 ημερών ισχύει 1900-2099, καλύπτει άνετα το εύρος της εφαρμογής).
   Επαληθεύτηκε: 2024→05-05, 2025→04-20, 2026→04-12, 2027→05-02 ✓ (πηγές: eortologio.net κ.ά.) ── */
const orthodoxEaster = year => {
  const a=year%4, b=year%7, c=year%19;
  const d=(19*c+15)%30;
  const e=(2*a+4*b-d+34)%7;
  const month=Math.floor((d+e+114)/31);   // 3=Μάρτιος, 4=Απρίλιος (Ιουλιανό ημερολόγιο)
  const day=((d+e+114)%31)+1;
  const jul=new Date(Date.UTC(year,month-1,day));
  jul.setUTCDate(jul.getUTCDate()+13);    // Ιουλιανό → Γρηγοριανό
  return jul.toISOString().slice(0,10);
};
const _isoAddDays = (iso,n) => { const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };

     23/4 ή νωρίτερα, ο Άγιος Γεώργιος «μετατίθεται» στη Δευτέρα του Πάσχα («Λαμπριάτης») ── */

   μέσω του StaffManager, θα υπολογιστούν κανονικά — καμία ειδική αντιμετώπιση ρόλου χρειάζεται). */
const annivOn = (ds,staffList) => staffList
  .filter(s=>s.hired && s.hired.slice(5)===ds.slice(5) && ds.slice(0,4)>s.hired.slice(0,4))
  .map(s=>({name:s.name, years: parseInt(ds.slice(0,4))-parseInt(s.hired.slice(0,4))}));

/* Milestones πελατών — αφορμή για κέρασμα/γιορτή, το βλέπουν όλοι */
const CLIENT_MILESTONES = [5,10,25,50,100,200];
const milestonesToday = (visits,clients,t) => {
  const out=[]; const seen=new Set();
  visits.filter(v=>!isDel(v)&&v.date===t&&v.clientId).forEach(v=>{
    if(seen.has(v.clientId)) return; seen.add(v.clientId);
    const n = visits.filter(x=>!isDel(x)&&x.clientId===v.clientId&&x.date<=t).length;
    if(CLIENT_MILESTONES.includes(n)) out.push({name:clients.find(c=>c.id===v.clientId)?.name||'', n});
  });
  return out;
};

/* ── CSV export/import (spec §1γ) — ίδιο πατρόν με το ήδη υπάρχον SalonStaff export ── */
const toCSV = rows => rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
const downloadCSV = (filename, rows) => {
  const blob = new Blob(['﻿'+toCSV(rows)], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
};
/* Απλός CSV parser — ταιριάζει με το toCSV() format (πάντα quoted fields, "" escape).
   Αρκεί για round-trip export→import του δικού μας καταλόγου, όχι γενικός RFC4180 parser. */
const parseCSV = text => {
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  const s = text.replace(/^﻿/,'');
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inQuotes){
      if(c==='"'){ if(s[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && s[i+1]==='\n') i++;
        row.push(field); field=''; rows.push(row); row=[];
      } else field += c;
    }
  }
  if(field!==''||row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length>1||r[0]!=='');
};

/* ΦΠΑ ανά γραμμή/συντελεστή (spec §6) — vat = ακέραιο % (24/17/13/6/0) */
const vatOf  = (gross,pct) => gross * (pct/100) / (1 + pct/100);
const netOf  = (gross,pct) => gross / (1 + pct/100);

/* Καλάθι */
const lineTotal  = l => { const p=Number(l.price)||0, d=Number(l.disc)||0; return Math.max(0, l.discType==='pct' ? p*(1-d/100) : p-d); };
const lineDiscount = l => (Number(l.price)||0) - lineTotal(l);
const visitTotal = v => v.lines.reduce((s,l)=>s+lineTotal(l),0);
const visitVat   = v => v.lines.reduce((s,l)=>s+vatOf(lineTotal(l),l.vat||24),0);
/* Μερίδιο tip ανά υπάλληλο — υποστηρίζει «split» (π.χ. πελάτης λέει «για τα κορίτσια»):
   v.tipSplit = [staffId,...] ισομερής διαμοιρασμός· αλλιώς παλιά λογική v.tipStaffId (όλο σε ένα άτομο). */
const tipShareFor = (v,staffId) => {
  if(!(v.tip>0)) return 0;
  if(v.tipSplit && v.tipSplit.length>0) return v.tipSplit.includes(staffId) ? v.tip/v.tipSplit.length : 0;
  return v.tipStaffId===staffId ? v.tip : 0;
};
const isDel      = v => !!v.deleted;

/* Σύνοψη περιόδου: visits (καλάθια) + expenses. Soft-deleted δεν προσμετρώνται πουθενά. */
const summarize = (visits, expenses) => {
  const act = visits.filter(v=>!isDel(v));
  const actE = expenses.filter(e=>!isDel(e));
  const cash = act.filter(v=>v.pm==='cash').reduce((s,v)=>s+visitTotal(v),0);
  const pos  = act.filter(v=>v.pm==='pos').reduce((s,v)=>s+visitTotal(v),0);
  const gross = cash+pos;
  const tips = act.reduce((s,v)=>s+(Number(v.tip)||0),0);
  const posTips = act.filter(v=>v.tipPm==='pos').reduce((s,v)=>s+(Number(v.tip)||0),0);
  const vatOut = act.reduce((s,v)=>s+visitVat(v),0);
  const expTotal = actE.reduce((s,e)=>s+(Number(e.amt)||0),0);
  /* σιωπηλή αποφορολόγηση εξόδων βάσει κατηγορίας (master-only πληροφορία) */
  const vatIn = actE.reduce((s,e)=>{ const c=LIVE_EXP_CATS.find(x=>x.name===e.cat); return s + (c&&c.vat>0 ? vatOf(e.amt,c.vat) : 0); },0);
  const discounts = act.reduce((s,v)=>s+v.lines.reduce((a,l)=>a+lineDiscount(l),0),0);
  return { cash, pos, gross, tips, posTips, vatOut, vatIn, netVat:vatOut-vatIn, expTotal, netBalance:gross-expTotal, discounts };
};

/* ── AUDIT — diff «πριν→μετά» σε ανθρώπινη μορφή, spec §1β ── */
const diffVisit = (b,a) => {
  const out = [];
  if(b.pm!==a.pm) out.push(`Πληρωμή: ${pmLbl[b.pm]} → ${pmLbl[a.pm]}`);
  if((Number(b.tip)||0)!==(Number(a.tip)||0)) out.push(`Tip: ${fmt(b.tip||0)} → ${fmt(a.tip||0)}`);
  if(b.tipStaffId!==a.tipStaffId) out.push('Tip → άλλος υπάλληλος');
  if(JSON.stringify(b.tipSplit||null)!==JSON.stringify(a.tipSplit||null)) out.push('Tip → split άλλαξε');
  if((b.tipPm||'')!==(a.tipPm||'')) out.push('Tip → τρόπος πληρωμής άλλαξε');
  if((b.note||'')!==(a.note||'')) out.push('Σημείωση άλλαξε');
  const maxLen = Math.max(b.lines.length, a.lines.length);
  for(let i=0;i<maxLen;i++){
    const bl=b.lines[i], al=a.lines[i];
    if(bl && !al) out.push(`Αφαιρέθηκε γραμμή: ${bl.name} (${fmt(lineTotal(bl))})`);
    else if(!bl && al) out.push(`Προστέθηκε γραμμή: ${al.name} (${fmt(lineTotal(al))})`);
    else if(bl && al){
      if(bl.price!==al.price || bl.disc!==al.disc || bl.discType!==al.discType) out.push(`${al.name}: τιμή ${fmt(lineTotal(bl))} → ${fmt(lineTotal(al))}`);
      if(bl.staffId!==al.staffId) out.push(`${al.name}: υπάλληλος άλλαξε`);
    }
  }
  return out;
};
const diffExpense = (b,a) => {
  const out = [];
  if(b.cat!==a.cat) out.push(`Κατηγορία: ${b.cat} → ${a.cat}`);
  if((Number(b.amt)||0)!==(Number(a.amt)||0)) out.push(`Ποσό: ${fmt(b.amt)} → ${fmt(a.amt)}`);
  if((b.note||'')!==(a.note||'')) out.push('Σημείωση άλλαξε');
  return out;
};

/* Στατιστικά ανά υπάλληλο — attribution σε επίπεδο ΓΡΑΜΜΗΣ + tips ανά υπάλληλο */
const staffSummary = (visits, staffList) => staffList.map(st => {
  const act = visits.filter(v=>!isDel(v));
  let rev=0, cnt=0, hours=0, resale=0;
  act.forEach(v=>v.lines.forEach(l=>{ if(l.staffId===st.id){ const t=lineTotal(l); rev+=t; cnt++; hours+=(l.dur||0)/60; if(l.kind==='product') resale+=t; } }));
  const tips = act.reduce((s,v)=>s+tipShareFor(v,st.id),0);
  return { id:st.id, name:st.name, rev, cnt, tips, hours, resale, perHour: hours>0 ? rev/hours : 0 };
});

/* Πρόγραμμα: default status ημέρας από εβδομαδιαίο ωράριο + αργίες (SalonStaff) */
const getDefaultStatus = (dateStr,emp) => {
  if(HOLIDAYS[dateStr]) return { status:'holiday', note:holidayLabel(dateStr), start:'', end:'' };
  const d = dow(dateStr); const sched = emp.schedule||DEF_SCHEDULE;
  if(!sched[d]) return { status:'off', note:'', start:'', end:'' };
  return { status:'work', note:'', start:sched[d].s, end:sched[d].e };
};
const timeDiff = (s,e) => { if(!s||!e) return 0; const [sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number); return ((eh*60+em)-(sh*60+sm))/60; };
const hoursForEntry = (entry,emp,dateStr) => {
  if(!entry||['off','sick','leave','absent','holiday'].includes(entry.status)) return 0;
  if(entry.status==='work'){ const d=dow(dateStr); const sc=(emp.schedule||DEF_SCHEDULE)[d]; return sc?timeDiff(sc.s,sc.e):0; }
  return timeDiff(entry.start,entry.end)||0;
};
const leaveUsedInYear = (schedData,year,empId) =>
  Object.values(schedData[year]||{}).reduce((tot,emps)=>tot+Object.values(emps?.[empId]||{}).filter(e=>e&&e.status==='leave').length,0);

/* Ημέρες αιτήματος άδειας (εύρος from→to) */
const reqDates = r => { const out=[]; let d=r.from; while(d<=r.to){ out.push(d); d=addDays(d,1); } return out; };

const ACCENTS = {
  emerald: { label:'Emerald', accent:'#059669', accent2:'#10b981', a50:'#ecfdf5', a100:'#d1fae5' },
  indigo:  { label:'Indigo',  accent:'#4f46e5', accent2:'#6366f1', a50:'#eef2ff', a100:'#e0e7ff' },
  rose:    { label:'Rose',    accent:'#e11d48', accent2:'#f43f5e', a50:'#fff1f2', a100:'#ffe4e6' },
  amber:   { label:'Amber',   accent:'#d97706', accent2:'#f59e0b', a50:'#fffbeb', a100:'#fef3c7' },
  teal:    { label:'Teal',    accent:'#0d9488', accent2:'#14b8a6', a50:'#f0fdfa', a100:'#ccfbf1' },
  violet:  { label:'Violet',  accent:'#7c3aed', accent2:'#8b5cf6', a50:'#f5f3ff', a100:'#ede9fe' },
};
const applyAccent = key => {
  const a = ACCENTS[key] || ACCENTS.emerald;
  const r = document.documentElement.style;
  r.setProperty('--accent', a.accent); r.setProperty('--accent-2', a.accent2); r.setProperty('--accent-600', a.accent);
  if(!document.documentElement.classList.contains('dark')){ r.setProperty('--accent-50', a.a50); r.setProperty('--accent-100', a.a100); }
  document.querySelector('meta[name=theme-color]')?.setAttribute('content', a.accent);
};
const applyTheme = mode => {
  const dark = mode==='dark' || (mode==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
};

/* ── BRAND MARK — "G" μονόγραμμα προσωρινά (icon = ανοιχτό θέμα, spec §15) ── */
const BrandMark = ({s=36}) => (

/* ── LoginScreen — Firebase Auth (email/password), αντικατέστησε το παλιό PIN.
   Ο ρόλος (Master/Staff/Reception) βγαίνει από το AUTH_ACCOUNTS lookup στο App,
   ΟΧΙ εδώ — αυτό το component απλά στέλνει credentials στο fbAuth. ── */
const LoginScreen = ({shopName, busy, err, onLogin}) => {
  const [email,setEmail] = useState('');
  const [pw,setPw] = useState('');

  const submit = e => {
    e.preventDefault();
    if(!email.trim() || !pw || busy) return;
    onLogin(email.trim(), pw);
  };

  return (
    <div className="min-h-screen hero flex flex-col items-center justify-center px-6">
      <div className="text-center mb-8">
        <BrandMark s={72}/>
        <h1 className="text-3xl font-black text-white mt-5">Glamager</h1>
        <p className="text-white/70 text-sm mt-1">{shopName}</p>
      </div>
      <form onSubmit={submit} className="flex flex-col gap-3 w-full max-w-xs">
        <input type="email" inputMode="email" autoComplete="username" value={email}
          onChange={e=>setEmail(e.target.value)} placeholder={t('loginEmailPh')}
          className="card px-4 py-3 text-sm font-semibold outline-none" style={{color:'var(--text)'}}/>
        <input type="password" autoComplete="current-password" value={pw}
          onChange={e=>setPw(e.target.value)} placeholder={t('loginPassPh')}
          className="card px-4 py-3 text-sm font-semibold outline-none" style={{color:'var(--text)'}}/>
        {err && <p className="text-red-200 text-sm text-center fade">{err}</p>}
        <button type="submit" disabled={busy || !email.trim() || !pw}
          className="rounded-2xl py-3 font-black text-sm mt-2"
          style={{background:'white',color:'var(--accent-600)', opacity:(busy||!email.trim()||!pw)?.6:1}}>
          {busy ? t('loginBusy') : t('loginBtn')}
        </button>
      </form>
    </div>
  );
};

/* ── OperatorPicker — καθημερινή ταυτότητα: tap όνομα + 4ψήφιο PIN. ΔΕΝ αγγίζει το Firebase
   session (αυτό έγινε ήδη μία φορά στο LoginScreen, μένει ζωντανό στο παρασκήνιο). Το PIN
   είναι καθαρά attribution/UX, όχι security boundary — αυτό εξασφαλίζεται από το login πριν. */
const OperatorPicker = ({shopName, staff, pins, onPick, myId}) => {
  const [who,setWho] = useState(null);
  const [pin,setPin] = useState('');
  const [err,setErr] = useState(false);
  const [shk,setShk] = useState(false);

  /* Σειρά εμφάνισης — ψυχολογικά, ΟΧΙ ιεραρχικά: πρώτα ο ίδιος/η ίδια που μόλις έκανε login,
     μετά το υπόλοιπο προσωπικό (κατ.2), μετά ρεσεψιόν (κατ.1), Master πάντα τελευταίος/α.
     18/07: `staff` είναι πλέον η ζωντανή Firebase-backed λίστα (πριν ήταν module-level
     DEMO_MASTERS/DEMO_STAFF merge) — ίδιο αποτέλεσμα σχήματος, απλά ζωντανή πηγή. */
  const RANK = { [ROLE.STAFF]:0, [ROLE.RECEPTION]:1, [ROLE.MASTER]:2 };
  const people = staff.map(s=>({id:s.id, name:s.name, role:s.role})).sort((a,b)=>{
    if(a.id===myId) return -1;
    if(b.id===myId) return 1;
    return RANK[a.role]-RANK[b.role];
  });

  const press = d => {
    if(pin.length>=4) return;
    const n = pin+d;
    setPin(n);
    if(n.length===4){
      setTimeout(()=>{
        if(n===(pins[who.id]||'')) onPick(who);
        else { setErr(true); setShk(true); setTimeout(()=>{setPin('');setErr(false);setShk(false);},750); }
      },150);
    }
  };

  const backToPicker = () => { setWho(null); setPin(''); setErr(false); };

  if(!who){
    return (
      <div className="min-h-screen hero flex flex-col items-center justify-center px-6">
        <div className="text-center mb-8">
          <BrandMark s={72}/>
          <h1 className="text-3xl font-black text-white mt-5">Glamager</h1>
          <p className="text-white/70 text-sm mt-1">{shopName}</p>
        </div>
        <p className="text-white/80 text-sm font-semibold mb-4">{t('whoAreYou')}</p>
        <div className="flex flex-col gap-3 w-full max-w-xs">
          {people.map(p=>(
            <button key={p.id} onClick={()=>setWho(p)} className="card px-5 py-4 flex items-center gap-3 text-left">
              <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'var(--accent-100)'}}>
                <Ic n="user" s={18} c="var(--accent-600)"/>
              </div>
              <div className="flex-1 min-w-0">
                <span className="font-bold block" style={{color:'var(--text)'}}>{p.name}</span>
                <span className="text-xs" style={{color:'var(--text-dim)'}}>{roleLabel(p.role)}</span>
              </div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen hero flex flex-col items-center justify-center px-6">
      <div className="text-center mb-10">
        <BrandMark s={64}/>
        <h1 className="text-2xl font-black text-white mt-4">{who.name}</h1>
        <p className="text-white/70 text-xs mt-1">{roleLabel(who.role)}</p>
      </div>
      <div className={`flex gap-5 mb-10 ${shk?'shake':''}`}>{[0,1,2,3].map(i=><div key={i} className={`pin-dot ${pin.length>i?(err?'err':'on'):''}`}/>)}</div>
      <div className="grid grid-cols-3 gap-4">
        {['1','2','3','4','5','6','7','8','9','','0','⌫'].map((b,i)=>(
          b===''?<div key={i}/>:b==='⌫'
            ?<button key={i} className="pin-btn" onClick={()=>setPin(p=>p.slice(0,-1))}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
              </button>
            :<button key={i} className="pin-btn" onClick={()=>press(b)}>{b}</button>
        ))}
      </div>
      {err && <p className="text-red-200 text-sm mt-6 fade">{t('wrongCode')}</p>}
      <button onClick={backToPicker} className="text-white/60 text-xs font-semibold mt-8 underline">{t('backBtn')}</button>
    </div>
  );
};

/* ── HEADER — role-aware ──
   Master: icon Πελατολογίου στο header της Αρχικής (όχι tab) + ⚙️
   Προσωπικό: μόνο ⚙️ (θέμα/γλώσσα) + κλείδωμα (PIN handoff) */
/* 01/08 v3: header ήταν sticky (δεμένο στο scroll του #root) — κατά το iOS elastic
   rubber-band bounce, στοιχεία sticky «ταξιδεύουν» οπτικά μαζί με το bounce ακόμα κι όταν το
   footer (ήδη fixed) μένει ακίνητο, γι' αυτό φαινόταν να «πάει βόλτα». Λύση: fixed (ίδιο
   μοτίβο με το Nav footer) — πλήρως αποσυνδεδεμένο από το scroll/bounce του #root, ό,τι κι αν
   συμβαίνει στο περιεχόμενο. Χρειάζεται αντίστοιχο padding-top στο περιεχόμενο (βλ. App). */
const Header = ({title,sub,operator,onSettings,onClients,onBack,onLock}) => (
  <div className="hdr px-4 pt-11 pb-4 flex items-center gap-3 fixed top-0 z-40" style={{left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:640}}>
    {onBack
      ? <button onClick={onBack} className="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><Ic n="back" s={18} c="white"/></button>
      : <BrandMark s={36}/>}
    <div className="flex-1 min-w-0">
      <h1 className="text-base font-black text-white truncate">{title}</h1>
      {sub && <p className="text-white/70 text-xs mt-0.5 truncate">{sub}</p>}
    </div>
    {operator && (
      <div className="flex items-center gap-1.5 bg-white/20 rounded-full px-2.5 py-1 flex-shrink-0">
        <span className="text-white text-xs font-bold">{operator.name}</span>
      </div>
    )}
    {onClients && <button onClick={onClients} className="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><Ic n="users" s={18} c="white"/></button>}
    {onLock && <button onClick={onLock} className="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><Ic n="lock" s={17} c="white"/></button>}
    {onSettings && <button onClick={onSettings} className="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><Ic n="gear" s={18} c="white"/></button>}
  </div>
);

/* ── NAV — ΔΥΟ ξεχωριστά σύνολα tabs ανάλογα με ρόλο ──
   Προσωπικό (κατ.1 & κατ.2): Αρχική · + · Ταμείο · Πελατολόγιο
   Master:                    Αρχική · + · Ταμείο · Αναφορές (+badge) */
const Nav = ({active,go,operator,pendingCount}) => {
  const isMaster = operator.role===ROLE.MASTER;
  const tabs = isMaster
    ? [ {id:'home',icon:'home',label:t('navHome')}, {id:'add',icon:'plus',label:''},
        {id:'reg',icon:'list',label:t('navRegister')},  {id:'rep',icon:'bar',label:t('navReports'),badge:pendingCount} ]
    : [ {id:'home',icon:'home',label:t('navHome')}, {id:'add',icon:'plus',label:''},
        {id:'reg',icon:'list',label:t('navRegister')},  {id:'clients',icon:'users',label:t('navClients')} ];
  return (
    <div className="nav-bar fixed bottom-0 flex z-50" style={{left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:640,background:'var(--surface)',borderTop:'1px solid var(--border)'}}>
      {tabs.map(t=>(
        <button key={t.id} onClick={()=>go(t.id)} className="flex-1 flex flex-col items-center pt-3 pb-1 gap-0.5"
          style={{color: active===t.id ? 'var(--accent-600)' : 'var(--text-dim)'}}>
          {t.id==='add'
            ? <div className="w-12 h-12 rounded-full flex items-center justify-center -mt-5 shadow-lg mb-0.5" style={{background:'var(--accent-600)'}}><Ic n="plus" s={22} c="white"/></div>
            : <div className="relative">
                <Ic n={t.icon} s={20} c={active===t.id?'var(--accent-600)':'var(--text-dim)'}/>
                {t.badge>0 && <span className="red-dot">{t.badge}</span>}
              </div>}
          <span className="text-xs">{t.label}</span>
        </button>
      ))}
    </div>
  );
};

/* ═══════════════ ΗΜΕΡΟΛΟΓΙΟ ΠΡΟΣΩΠΙΚΟΥ (Αρχική κατ.1/κατ.2) ═══════════════
   ΜΟΝΟ η δική του καρτέλα (όχι συναδέλφων). Read + request-flow:
   Άδεια → αίτημα (pending, Master εγκρίνει) · Αναρρωτική → κατευθείαν.
   Υπερωρία/Πρόωρη/Εορταστικό/Απουσία: δεν υπάρχει καν κουμπί εδώ. */

/* Modal ημέρας υπαλλήλου */
const StaffDayModal = ({dateStr,emp,entry,pendingReq,onRequestLeave,onSetSick,onCancelReq,onClose}) => {
  const def = getDefaultStatus(dateStr,emp);
  const eff = entry||def;
  const st = stMap[eff.status]||stMap.work;
  const [view,setView] = useState('info'); // info | leave | sick
  const [to,setTo] = useState(dateStr);
  const [note,setNote] = useState('');
  const d = new Date(dateStr+'T12:00:00');
  const title = `${dowFullName(dateStr)} ${d.getDate()} ${monName(d.getMonth()+1)}`;
  const isPast = dateStr < today();
  const days = reqDates({from:dateStr,to}).length;

  return (
    <div className="modal-bg fade" onClick={onClose}>
      <div className="modal pop" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div>
            <p className="font-black text-lg" style={{color:'var(--text)'}}>{title}</p>
            <p className="text-sm font-bold" style={{color:st.color}}>{st.emoji} {stLabel(st)}{eff.status==='work'&&eff.start?` · ${eff.start}–${eff.end}`:''}</p>
            {eff.note ? <p className="text-xs mt-0.5" style={{color:'var(--text-dim)'}}>📝 {eff.note}</p> : null}
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="x" s={16} c="var(--text-dim)"/></button>
        </div>

        {pendingReq && (
          <div className="rounded-2xl p-4 mb-3 border" style={{background:'#cffafe33',borderColor:'#67e8f9'}}>
            <p className="text-sm font-bold" style={{color:'#0891b2'}}>🏖️ {t('pendingLeaveBanner')} {fmtD(pendingReq.from)} – {fmtD(pendingReq.to)}</p>
            <p className="text-xs mt-1" style={{color:'var(--text-dim)'}}>{t('waitingApproval')}</p>
            <button onClick={()=>{onCancelReq(pendingReq.id);onClose();}} className="mt-2 text-xs font-bold text-red-500 underline">{t('cancelRequestBtn')}</button>
          </div>
        )}

        {view==='info' && !pendingReq && !isPast && (
          <div className="space-y-2">
            <button onClick={()=>setView('leave')} className="w-full py-3.5 rounded-2xl font-black text-white text-sm" style={{background:'#0891b2'}}>🏖️ {t('leaveRequestBtn')}</button>
            <button onClick={()=>setView('sick')} className="w-full py-3.5 rounded-2xl font-black text-white text-sm" style={{background:'#dc2626'}}>🤒 {t('sickDeclareBtn')}</button>
            <p className="text-xs text-center pt-1" style={{color:'var(--text-dim)'}}>{t('overtimeMasterOnlyHint')}</p>
          </div>
        )}
        {view==='info' && !pendingReq && isPast && eff.status!=='sick' && (
          <p className="text-xs text-center py-2" style={{color:'var(--text-dim)'}}>{t('pastDayHint')}</p>
        )}

        {view==='leave' && (
          <div className="rounded-2xl p-4 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
            <p className="text-xs font-black uppercase tracking-wide mb-3" style={{color:'#0891b2'}}>{t('leaveRequestFromLabel')} {fmtD(dateStr)}</p>
            <p className="text-xs mb-1" style={{color:'var(--text-dim)'}}>{t('untilLabel')}</p>
            <input type="date" value={to} min={dateStr} onChange={e=>setTo(e.target.value)} className="w-full rounded-xl px-3 py-2.5 text-sm font-bold outline-none border mb-3" style={{background:'var(--surface)',color:'var(--text)',borderColor:'var(--border)'}}/>
            <p className="text-xs font-bold mb-3" style={{color:'var(--text)'}}>{days} {days===1?t('dayCountSingular'):t('dayCountPlural')}</p>
            <button onClick={()=>{onRequestLeave(dateStr,to);onClose();}} className="w-full py-3 rounded-2xl font-black text-white text-sm" style={{background:'#0891b2'}}>{t('submitRequestBtn')}</button>
          </div>
        )}

        {view==='sick' && (
          <div className="rounded-2xl p-4 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
            <p className="text-xs font-black uppercase tracking-wide mb-3" style={{color:'#dc2626'}}>{t('stSick')} — {fmtD(dateStr)}</p>
            <input type="text" value={note} onChange={e=>setNote(e.target.value)} placeholder={t('sickPlaceholder')} className="w-full rounded-xl px-3 py-2.5 text-sm outline-none border mb-3" style={{background:'var(--surface)',color:'var(--text)',borderColor:'var(--border)'}}/>
            <button onClick={()=>{onSetSick(dateStr,note);onClose();}} className="w-full py-3 rounded-2xl font-black text-white text-sm" style={{background:'#dc2626'}}>{t('saveBtn')}</button>
            <p className="text-xs mt-2" style={{color:'var(--text-dim)'}}>{t('sickExtendHint')}</p>
          </div>
        )}
      </div>
    </div>
  );
};

/* Μηνιαίο ημερολόγιο υπαλλήλου — δικό του πρόγραμμα + υπόλοιπο αδειών.
   Καθαρά χρονοπρογραμματισμός, τίποτα οικονομικό. */
const StaffCalendar = ({emp,staff,schedData,leaveReqs,onRequestLeave,onSetSick,onCancelReq}) => {
  const [year,setYear] = useState(CUR_Y);
  const [month,setMonth] = useState(CUR_M);
  const [modal,setModal] = useState(null); // dateStr
  const days = daysInMonth(year,month);
  const empData = schedData[year]?.[pad2(month)]?.[emp.id]||{};
  const myReqs = leaveReqs.filter(r=>r.empId===emp.id);
  const pendingFor = ds => myReqs.find(r=>r.status==='pending' && ds>=r.from && ds<=r.to);

  const prevMonth = () => { if(month===1){setMonth(12);setYear(y=>y-1);} else setMonth(m=>m-1); };
  const nextMonth = () => { if(month===12){setMonth(1);setYear(y=>y+1);} else setMonth(m=>m+1); };

  const leaveUsed = leaveUsedInYear(schedData,year,emp.id);
  const leaveLeft = Math.max(0,(emp.leaveTotal||20)-leaveUsed);

  return (
    <div>
      {/* Month nav */}
      <div className="flex items-center gap-2 mb-3">
        <button onClick={prevMonth} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="back" s={16} c="var(--text-dim)"/></button>
        <div className="flex-1 text-center"><p className="font-black" style={{color:'var(--text)'}}>{monName(month)} {year}</p></div>
        <button onClick={nextMonth} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="next" s={16} c="var(--text-dim)"/></button>
      </div>

      {/* Υπόλοιπο αδειών */}
      <div className="card px-4 py-3 mb-3">
        <div className="flex items-center justify-between mb-1.5">
          <p className="text-xs font-bold" style={{color:'#0891b2'}}>🏖️ {t('leaveBalanceLabel')} {year}</p>
          <p className="text-xs font-black" style={{color:'#0891b2'}}>{leaveLeft} / {emp.leaveTotal||20} {t('dayCountPlural')}</p>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${Math.min(100,(leaveUsed/(emp.leaveTotal||20))*100)}%`,background:'#0891b2'}}/></div>
      </div>

      {/* Day list */}
      <div className="space-y-1.5">
        {Array.from({length:days},(_,i)=>{
          const d=i+1, dk=dateKey(year,month,d);
          const raw=empData[pad2(d)];
          const entry=raw||getDefaultStatus(dk,emp);
          const st=stMap[entry.status]||stMap.work;
          const isToday=dk===today();
          const pend=pendingFor(dk);
          return (
            <div key={d} onClick={()=>setModal(dk)} className="day-cell flex items-center gap-3 px-4 py-2.5"
              style={{background:pend?'#cffafe55':st.bg, border:`1.5px solid ${pend?'#67e8f9':st.border}`, ...(isToday?{boxShadow:'0 0 0 2px var(--accent-600)'}:{})}}>
              <div className="w-10 text-center flex-shrink-0">
                <p className="text-[10px] font-bold text-gray-400">{dowShort(dk)}</p>
                <p className="text-lg font-black text-gray-700">{d}</p>
              </div>
              <div className="text-lg flex-shrink-0">{pend?'⏳':st.emoji}</div>
              <div className="flex-1 min-w-0">
                <p className="font-bold text-sm" style={{color:pend?'#0891b2':st.color}}>{pend?t('pendingLeaveInline'):stLabel(st)}</p>
                {entry.status==='work'&&(()=>{ const sc=(emp.schedule||DEF_SCHEDULE)[dow(dk)]; return sc?<p className="text-xs text-gray-500">{sc.s} – {sc.e} ({timeDiff(sc.s,sc.e)}{t('hourAbbrev')})</p>:null; })()}
                {['overtime','early','festive'].includes(entry.status)&&entry.start&&<p className="text-xs text-gray-500">🕐 {entry.start} – {entry.end} ({timeDiff(entry.start,entry.end).toFixed(1)}{t('hourAbbrev')})</p>}
                {entry.note&&<p className="text-xs text-gray-500 truncate">📝 {entry.note}</p>}
                {birthdaysOn(dk,staff).length>0&&<p className="text-xs font-bold" style={{color:'#db2777'}}>🎂 {t('birthdaysLabel')}: {birthdaysOn(dk,staff).map(b=>b.age!=null?`${b.name} (${b.age})`:b.name).join(', ')}!</p>}
                {annivOn(dk,staff).map(a=><p key={a.name} className="text-xs font-bold" style={{color:'#d97706'}}>🎉 {LANG==='en'?`${a.years} years — ${a.name} at the shop`:`${a.years} χρόνια ${a.name} στο μαγαζί`}</p>)}
                {namedaysOn(dk).length>0&&<p className="text-xs truncate" style={{color:'#7c3aed'}}>🎈 {namedaysOn(dk).join(', ')}</p>}
                {worldDayOn(dk)&&<p className="text-xs truncate" style={{color:'#0ea5e9'}}>🌍 {worldDayOn(dk).join(' · ')}</p>}
              </div>
            </div>
          );
        })}
      </div>

      {/* Τα αιτήματά μου */}
      {myReqs.length>0 && (
        <div className="mt-4">
          <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('myRequestsLabel')}</p>
          <div className="space-y-2">
            {[...myReqs].sort((a,b)=>b.reqAt.localeCompare(a.reqAt)).map(r=>(
              <div key={r.id} className="card px-4 py-3">
                <div className="flex items-center justify-between">
                  <p className="text-sm font-bold" style={{color:'var(--text)'}}>🏖️ {fmtD(r.from)} – {fmtD(r.to)}</p>
                  <span className="text-xs font-black px-2 py-0.5 rounded-full" style={r.status==='pending'?{background:'#fef3c7',color:'#d97706'}:r.status==='approved'?{background:'#d1fae5',color:'#059669'}:{background:'#fee2e2',color:'#dc2626'}}>
                    {r.status==='pending'?t('reqPending'):r.status==='approved'?t('reqApproved'):t('reqDeclined')}
                  </span>
                </div>
                {r.status==='declined'&&r.masterMsg&&<p className="text-xs mt-1.5 rounded-xl px-3 py-2" style={{background:'#fee2e233',color:'#dc2626'}}>💬 {r.masterMsg}</p>}
              </div>
            ))}
          </div>
        </div>
      )}

      {modal && <StaffDayModal dateStr={modal} emp={emp} entry={empData[modal.slice(-2)]}
        pendingReq={pendingFor(modal)} onRequestLeave={onRequestLeave} onSetSick={onSetSick}
        onCancelReq={onCancelReq} onClose={()=>setModal(null)}/>}
    </div>
  );
};

/* ═══════════════ ΓΙΟΡΤΕΣ & ΧΑΡΟΥΜΕΝΑ (κοινά και για τους δύο ρόλους) ═══════════════
   Η εφαρμογή να μην είναι μόνο μαστίγιο-καρότο του Boss — να έχει και στιγμές
   που τις περιμένουν όλοι: γενέθλια, ονομαστικές, επέτειοι, milestones πελατών. */
const Confetti = () => (
  <React.Fragment>
    {['🎉','✨','🎂','🎈','✨','🎊','🎉','✨'].map((e,i)=>(
      <span key={i} className="confetti" style={{left:`${6+i*12}%`, animationDelay:`${(i*0.4).toFixed(1)}s`}}>{e}</span>
    ))}
  </React.Fragment>
);

const Celebrations = ({t:dateIso,staff,visits,clients}) => {
  const b  = birthdaysOn(dateIso,staff);
  const nd = namedaysOn(dateIso);
  const wd = worldDayOn(dateIso);
  const sc = staffCelebratingOn(dateIso,staff);
  const an = annivOn(dateIso,staff);
  const ms = milestonesToday(visits,clients,dateIso);
  if(b.length+nd.length+an.length+ms.length===0 && !wd) return null;
  const festive = b.length>0 || sc.length>0 || an.length>0; /* δικός μας άνθρωπος γιορτάζει → confetti */
  return (
    <div className={`rounded-2xl p-4 mb-3 border fade ${festive?'confetti-wrap':''}`} style={{background:'#fdf2f8',borderColor:'#fbcfe8'}}>
      {festive && <Confetti/>}
      {b.map(x=><p key={x.name} className="font-black text-sm" style={{color:'#db2777'}}>🎂 {
        x.age!=null
          ? (LANG==='en' ? `${x.name} turns ${x.age} today!` : `${x.name} σήμερα γίνεται ${x.age}!`)
          : `${t('birthdaysTodayPrefixLabel')} ${x.name}!`
      } 🎉</p>)}
      {sc.length>0 && <p className="font-black text-sm" style={{color:'#db2777'}}>🎈 {t('teamCelebratingPrefixLabel')} {sc.join(' & ')}{t('manyHappyReturnsSuffixLabel')}</p>}
      {an.map(a=><p key={a.name} className="font-black text-sm" style={{color:'#d97706'}}>🎉 {LANG==='en'?`${a.years} years — ${a.name} at the shop!`:`${a.years} χρόνια ${a.name} στο μαγαζί!`}</p>)}
      {ms.map(m=><p key={m.name} className="font-bold text-sm" style={{color:'#7c3aed'}}>🏆 {LANG==='en'?`${m.name} — visit #${m.n} today! Maybe treat them to something?`:`${m.name} — ${m.n}η επίσκεψη σήμερα! Αξίζει ένα κέρασμα;`}</p>)}
      {nd.length>0 && <p className="text-xs mt-1" style={{color:'var(--text-dim)'}}>🎈 {t('namedayTodayPrefixLabel')} {nd.join(', ')}</p>}
      {wd && <p className="text-xs mt-1" style={{color:'var(--text-dim)'}}>🌍 {t('worldDayTodayPrefixLabel')} {wd.join(' · ')}</p>}
    </div>
  );
};

/* Ερώτηση ημέρας + ζωδιακό fun fact — δύο μικρές, ξεχωριστές καρτούλες, χαμηλού «όγκου»
   (μικρό text, όχι banner με confetti όπως το Celebrations) — καθημερινό μικρό extra, όχι
   κάτι που φωνάζει. Πάντα ορατό (σε αντίθεση με το Celebrations, δεν εξαρτάται από το αν
   γιορτάζει κάποιος σήμερα) — υπάρχει ερώτηση/ζώδιο ΚΑΘΕ μέρα του χρόνου, no fallback needed. */
const DailySpark = ({t:dateIso}) => {
  const q = questionOfDay(dateIso);
  const z = zodiacFactOn(dateIso);
  return (
    <div className="rounded-2xl p-4 mb-3 border fade" style={{background:'var(--card)',borderColor:'var(--border)'}}>
      <p className="text-[11px] font-bold uppercase tracking-wide mb-1" style={{color:'var(--text-dim)'}}>{t('questionOfDayLabel')}</p>
      <p className="text-sm font-semibold mb-3" style={{color:'var(--text)'}}>{q}</p>
      {z && <>
        <p className="text-[11px] font-bold uppercase tracking-wide mb-1" style={{color:'var(--text-dim)'}}>{t('zodiacFunFactLabel')}</p>
        <p className="text-xs" style={{color:'var(--text)'}}>
          <b>{z.name}</b> ({t('zodiacSeasonLabel')} {z.range[0].split('-').reverse().join('/')}–{z.range[1].split('-').reverse().join('/')}) —
          {' '}{z.element} · {z.planet} · {z.symbol} · {z.stone} · {z.color}
        </p>
        <p className="text-xs mt-1" style={{color:'var(--text-dim)'}}>{z.trait}</p>
      </>}
    </div>
  );
};

/* Kudos — ο Master στέλνει 👏 «ευχαριστώ», εμφανίζεται στην Αρχική του υπαλλήλου.
   Καθόλου νούμερα, καθαρό καρότο-χωρίς-μαστίγιο. */
const KudosModal = ({staff,onSend,onClose}) => {
  const [who,setWho] = useState(null);
  const [msg,setMsg] = useState('');
  return (
    <div className="modal-bg fade" onClick={onClose}>
      <div className="modal pop" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <p className="font-black text-lg" style={{color:'var(--text)'}}>{t('kudosToLabel')}</p>
          <button onClick={onClose} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="x" s={16} c="var(--text-dim)"/></button>
        </div>
        <div className="flex gap-2 flex-wrap mb-4">
          {staff.map(s=><button key={s.id} onClick={()=>setWho(s.id)} className={`chip ${who===s.id?'on':''}`}>{s.name}</button>)}
        </div>
        <input type="text" value={msg} onChange={e=>setMsg(e.target.value)} placeholder={t('kudosMsgPlaceholder')}
          className="w-full rounded-xl px-4 py-3 text-sm border outline-none mb-4" style={{background:'var(--soft)',color:'var(--text)',borderColor:'var(--border)'}}/>
        <button onClick={async()=>{
            try{ await onSend(who,msg.trim()); onClose(); }
            catch(err){ window.alert(t('saveFailedPrefix')+' '+((err&&(err.message||err.code))||String(err))); }
          }} disabled={!who} className="w-full py-3.5 rounded-2xl font-black text-white text-sm disabled:opacity-30" style={{background:'var(--accent-600)'}}>
          {t('kudosSendBtn')}
        </button>
      </div>
    </div>
  );
};

/* ── ΑΡΧΙΚΗ ΠΡΟΣΩΠΙΚΟΥ (κατ.1 & κατ.2 — ίδια λογική) ──
   ΜΟΝΟ ημερολόγιο/πρόγραμμα. ΧΩΡΙΣ hero τζίρου, ΧΩΡΙΣ σύνοψη, ΧΩΡΙΣ ΦΠΑ,
   ΧΩΡΙΣ Ζ. Τα οικονομικά της ημέρας ζουν στο Ταμείο (με τους κανόνες ρόλου). */
const HomeStaff = ({operator,staff,allStaff,schedData,leaveReqs,visits,clients,kudos,onRequestLeave,onSetSick,onCancelReq}) => {
  const emp = staff.find(s=>s.id===operator.id);
  const todayIso = today();
  const boss = allStaff.find(p=>p.role===ROLE.MASTER); /* fallback ονόματος για παλιά kudos χωρίς byName */
  const entry = schedData[CUR_Y]?.[pad2(CUR_M)]?.[emp.id]?.[todayIso.slice(-2)] || getDefaultStatus(todayIso,emp);
  const st = stMap[entry.status]||stMap.work;

  /* «Σήμερα δουλεύουμε» — τι μας περιμένει αν κάποιος είναι off */
  const team = staff.map(s=>({ s, e: schedData[todayIso.slice(0,4)]?.[todayIso.slice(5,7)]?.[s.id]?.[todayIso.slice(-2)] || getDefaultStatus(todayIso,s) }));
  const working = team.filter(x=>['work','overtime','early','festive'].includes(x.e.status));
  const away = team.filter(x=>!['work','overtime','early','festive'].includes(x.e.status));

  /* Kudos για μένα — τελευταίες 3 μέρες */
  const myKudos = kudos.filter(k=>k.empId===operator.id && k.date>=addDays(todayIso,-2)).sort((a,b)=>b.date.localeCompare(a.date));

  return (
    <div className="px-4 pt-4 safe-pb">
      {/* Σήμερα — καθαρά πρόγραμμα */}
      <div className="hero hero-shadow rounded-3xl p-5 mb-4 fade">
        <p className="text-white/70 text-xs font-bold uppercase tracking-wide mb-1">{t('todayLabel')} — {fmtDLong(todayIso)}</p>
        <p className="text-white text-2xl font-black">{st.emoji} {stLabel(st)}</p>
        {entry.status==='work'&&entry.start&&<p className="text-white/80 text-sm font-semibold mt-1">🕐 {entry.start} – {entry.end}</p>}
      </div>

      <Celebrations t={todayIso} staff={allStaff} visits={visits} clients={clients}/>
      <DailySpark t={todayIso}/>

      {myKudos.map(k=>(
        <div key={k.id} className="rounded-2xl p-4 mb-3 border fade" style={{background:'var(--accent-50)',borderColor:'var(--accent-100)'}}>
          <p className="text-sm font-black" style={{color:'var(--accent-600)'}}>👏 {t('kudosFrom')} {k.byName||boss?.name||'Master'}{k.date!==todayIso?` (${fmtD(k.date)})`:''}</p>
          {k.msg && <p className="text-sm mt-0.5" style={{color:'var(--text)'}}>{k.msg}</p>}
        </div>
      ))}

      {/* Σήμερα δουλεύουμε */}
      <div className="card px-4 py-3 mb-4">
        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('whoWorksToday')}</p>
        <div className="flex gap-1.5 flex-wrap">
          {working.map(x=>(
            <span key={x.s.id} className="text-xs font-bold px-2.5 py-1.5 rounded-xl" style={{background:'var(--accent-50)',color:'var(--accent-600)'}}>
              ✅ {x.s.name}{x.e.start?` ${x.e.start}–${x.e.end}`:''}
            </span>
          ))}
          {away.map(x=>{ const ast=stMap[x.e.status]||stMap.off; return (
            <span key={x.s.id} className="text-xs font-bold px-2.5 py-1.5 rounded-xl" style={{background:ast.bg,color:ast.color}}>
              {ast.emoji} {x.s.name} — {stLabel(ast)}
            </span>
          );})}
        </div>
      </div>

      <StaffCalendar emp={emp} staff={allStaff} schedData={schedData} leaveReqs={leaveReqs}
        onRequestLeave={onRequestLeave} onSetSick={onSetSick} onCancelReq={onCancelReq}/>
    </div>
  );
};

/* ── ΑΡΧΙΚΗ MASTER — dashboard SalonPro λογική + badge αιτημάτων ── */
const HomeMaster = ({visits,expenses,staff,allStaff,clients,leaveReqs,go,onZ,onOpenVisit,onSendKudos}) => {
  const [showKudos,setShowKudos] = useState(false);
  const todayIso = today(), now = new Date();
  const dV = visits.filter(v=>v.date===todayIso), dE = expenses.filter(e=>e.date===todayIso);
  const sum = summarize(dV,dE);
  const wD = weekOf(todayIso);
  const wSum = summarize(visits.filter(v=>wD.includes(v.date)), expenses.filter(e=>wD.includes(e.date)));
  const {s:mS,e:mE} = monthRange(now.getFullYear(),now.getMonth()+1);
  const mSum = summarize(visits.filter(v=>v.date>=mS&&v.date<=mE), expenses.filter(e=>e.date>=mS&&e.date<=mE));
  const q = Math.ceil((now.getMonth()+1)/3);
  const {s:qS,e:qE} = quarterRange(now.getFullYear(),q);
  const qSum = summarize(visits.filter(v=>v.date>=qS&&v.date<=qE), expenses.filter(e=>e.date>=qS&&e.date<=qE));
  /* 31/07: «Υπάλληλοι σήμερα» + όνομα στις πρόσφατες εγγραφές πρέπει να δείχνουν σωστά τον Master
     αν σέρβιρε ο ίδιος — γι' αυτό εδώ ρητά allStaff (πλήρες), όχι το staffOnly `staff` param.
     Το KudosModal παρακάτω παραμένει σκόπιμα staffOnly (`staff`) — δεν στέλνεις kudos στον εαυτό σου. */
  const stf = staffSummary(dV,allStaff).filter(s=>s.cnt>0);
  const recent = [...dV].sort((a,b)=>b.time.localeCompare(a.time)).slice(0,5);
  const pending = leaveReqs.filter(r=>r.status==='pending');

  return (
    <div className="px-4 pt-4 safe-pb">
      {/* Hero σήμερα */}
      <div className="hero hero-shadow rounded-3xl p-5 mb-3 fade text-white">
        <div className="flex items-start justify-between mb-3">
          <div>
            <p className="text-white/70 text-xs font-bold uppercase tracking-wide">{t('todayLabel')} — {fmtDLong(todayIso)}</p>
            <p className="text-4xl font-black mt-1 amt">{fmt(sum.gross)}</p>
          </div>
          <div className="bg-amber-400/90 rounded-xl px-3 py-2 text-center">
            <p className="text-amber-900 text-xs font-semibold">{t('vatEstimate')}</p>
            <p className="text-amber-900 text-lg font-black amt">{fmt(sum.netVat)}</p>
          </div>
        </div>
        <div className="grid grid-cols-4 gap-1 pt-3 border-t border-white/20 text-center text-xs">
          {[['cash',sum.cash],['pos',sum.pos],['tips',sum.tips],['exp',-sum.expTotal]].map(([k,v])=>(
            <div key={k}><p className="text-white/70">{t(k+'Label')}</p><p className={`font-bold amt ${v<0?'text-red-200':k==='tips'?'text-yellow-300':'text-white'}`}>{v<0?'-':''}{fmt(Math.abs(v))}</p></div>
          ))}
        </div>
      </div>

      <Celebrations t={todayIso} staff={allStaff} visits={visits} clients={clients}/>

      {/* Badge εκκρεμών αιτημάτων — ο Master ανοίγει την εφαρμογή καθημερινά για το Ζ */}
      {pending.length>0 && (
        <button onClick={()=>go('rep','reqs')} className="w-full card px-4 py-3 mb-3 flex items-center gap-3 text-left">
          <div className="relative w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'#cffafe'}}>
            <span className="text-lg">🏖️</span><span className="red-dot">{pending.length}</span>
          </div>
          <div className="flex-1">
            <p className="text-sm font-bold" style={{color:'var(--text)'}}>{pending.length===1?t('pendingLeaveSingular'):`${pending.length} ${t('pendingLeavePlural')}`}</p>
            <p className="text-xs" style={{color:'var(--text-dim)'}}>{pending.map(r=>staff.find(s=>s.id===r.empId)?.name).join(', ')} — {t('tapToApprove')}</p>
          </div>
          <Ic n="next" s={16} c="var(--text-dim)"/>
        </button>
      )}

      {/* ΦΠΑ chips — MASTER ONLY, πάντα, ανεξαιρέτως */}
      <div className="flex gap-2 mb-3 overflow-x-auto pb-1">
        {[[t('todayLabel'),sum.netVat],[t('vatChipWeek'),wSum.netVat],[t('vatChipMonth'),mSum.netVat],[(LANG==='en'?'Q':'Τ')+q,qSum.netVat]].map(([p,v])=>(
          <div key={p} className="card px-3 py-2 flex-shrink-0 text-center" style={{minWidth:80}}>
            <p className="text-[10px] font-bold" style={{color:'var(--text-dim)'}}>{t('vatAbbrev')} {p}</p>
            <p className="text-sm font-black amt" style={{color:'#d97706'}}>{fmt(v)}</p>
          </div>
        ))}
      </div>

      {/* Καθαρό υπόλοιπο */}
      <div className="card px-4 py-3.5 mb-3 flex items-center justify-between">
        <p className="text-xs font-bold" style={{color:'var(--text-dim)'}}>{t('netBalanceLabel')}</p>
        <p className="text-xl font-black amt" style={{color:sum.netBalance>=0?'var(--accent-600)':'#dc2626'}}>{fmt(sum.netBalance)}</p>
      </div>

      {/* Υπάλληλοι σήμερα */}
      {stf.length>0 && (
        <div className="mb-3">
          <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('staffTodayLabel')}</p>
          <div className="card overflow-hidden">
            {stf.map((s,i)=>(
              <div key={s.id} className="flex items-center justify-between px-4 py-3" style={i>0?{borderTop:'1px solid var(--border)'}:{}}>
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{background:'var(--accent-100)'}}><Ic n="user" s={15} c="var(--accent-600)"/></div>
                  <div><p className="text-sm font-bold" style={{color:'var(--text)'}}>{s.name}</p><p className="text-xs" style={{color:'var(--text-dim)'}}>{s.cnt} {t('linesLabel')} · {s.hours.toFixed(1)}{t('hourAbbrev')}</p></div>
                </div>
                <div className="text-right">
                  <p className="font-black amt" style={{color:'var(--accent-600)'}}>{fmt(s.rev)}</p>
                  {s.tips>0&&<p className="text-xs text-yellow-500 amt">tip {fmt(s.tips)}</p>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Kudos — ευχαριστώ χωρίς νούμερα */}
      <button onClick={()=>setShowKudos(true)} className="w-full card px-4 py-3 mb-3 flex items-center gap-3 text-left">
        <div className="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'var(--accent-50)'}}><span className="text-lg">👏</span></div>
        <div className="flex-1">
          <p className="text-sm font-bold" style={{color:'var(--text)'}}>{t('sayThanksLabel')}</p>
          <p className="text-xs" style={{color:'var(--text-dim)'}}>{t('kudosHint')}</p>
        </div>
        <Ic n="next" s={16} c="var(--text-dim)"/>
      </button>

      {/* Πρόσφατες εγγραφές */}
      <div className="flex items-center justify-between mb-2">
        <p className="text-xs font-black uppercase tracking-wide" style={{color:'var(--text-dim)'}}>{t('dailyEntriesLabel')}</p>
        {dV.length>0&&<button onClick={()=>go('reg')} className="text-xs font-bold" style={{color:'var(--accent-600)'}}>{t('seeAllLabel')}</button>}
      </div>
      {recent.length>0
        ? <div className="space-y-2 mb-3">{recent.map(v=><VisitRow key={v.id} v={v} staff={allStaff} clients={clients} showVat={true} onOpen={onOpenVisit}/>)}</div>
        : <div className="card py-10 text-center mb-3"><p className="font-bold" style={{color:'var(--text-dim)'}}>{t('noActivityYet')}</p><p className="text-xs mt-1" style={{color:'var(--text-dim)'}}>{t('pressPlusToStart')}</p></div>}

      <button onClick={onZ} className="w-full py-3.5 rounded-2xl font-black text-white" style={{background:'var(--accent-600)'}}>
        ⚡ {t('titleZ')} (Z)
      </button>

      {showKudos && <KudosModal staff={staff} onSend={onSendKudos} onClose={()=>setShowKudos(false)}/>}
    </div>
  );
};

/* ═══════════════ ΓΡΑΜΜΕΣ & ΕΓΓΡΑΦΕΣ ΤΑΜΕΙΟΥ ═══════════════ */

const pmC   = {cash:'#059669', pos:'#3b82f6'};
const pmIc  = {cash:'cash', pos:'card'};
const pmLbl = {cash:'Μετρητά', pos:'POS'}; // κρατιέται για συμβατότητα, αλλά χρησιμοποίησε pmName() παρακάτω σε νέο κώδικα (i18n-aware)
const pmName = pm => pm==='cash' ? t('cashLabel') : 'POS';

/* VisitRow — μία επίσκεψη (καλάθι). Δείχνει και ΟΝΟΜΑ ΠΕΛΑΤΗ όταν είναι
   συνδεδεμένη με πελατολόγιο (νέο πεδίο vs SalonPro TxRow). */
const VisitRow = ({v,staff,clients,showVat,onOpen,onDel,locked}) => {
  const client = v.clientId ? clients.find(c=>c.id===v.clientId) : null;
  const names = [...new Set(v.lines.map(l=>staff.find(s=>s.id===l.staffId)?.name).filter(Boolean))];
  const tot = visitTotal(v);
  return (
    <div className={`card px-4 py-3 flex items-center gap-3 ${isDel(v)?'soft-del':''}`} onClick={()=>onOpen&&onOpen(v)} style={onOpen?{cursor:'pointer'}:null}>
      <div className="w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center" style={{background:(pmC[v.pm]||'#9ca3af')+'22'}}>
        <Ic n={pmIc[v.pm]||'tag'} s={17} c={pmC[v.pm]||'#9ca3af'}/>
      </div>
      <div className="flex-1 min-w-0">
        <p className="text-sm font-bold truncate flex items-center gap-1" style={{color:'var(--text)'}}>
          {client ? client.name : v.lines.map(l=>l.name).join(' + ')}
          {v.note && <Ic n="note" s={13} c="#f59e0b" cls="flex-shrink-0"/>}
          {locked && <Ic n="lock" s={12} c="var(--text-dim)" cls="flex-shrink-0"/>}
        </p>
        <p className="text-xs mt-0.5 truncate" style={{color:'var(--text-dim)'}}>
          {client ? v.lines.map(l=>l.name).join(' + ')+' · ' : ''}
          <span style={{color:'var(--accent-600)',fontWeight:600}}>{names.join(', ')}</span> · {pmName(v.pm)} · {v.time}
        </p>
      </div>
      <div className="text-right flex-shrink-0">
        <p className="font-black text-base amt" style={{color:'var(--accent-600)'}}>+{fmt(tot)}</p>
        {v.tip>0 && <p className="text-xs text-yellow-500 amt">+tip {fmt(v.tip)}</p>}
        {showVat && <p className="text-xs text-amber-500 amt">ΦΠΑ {fmt(visitVat(v))}</p>}
      </div>
      {onDel && !isDel(v) && <button onClick={e=>{e.stopPropagation();onDel(v.id);}} className="w-7 h-7 rounded-lg flex items-center justify-center ml-1 flex-shrink-0" style={{background:'var(--soft)'}}><Ic n="x" s={13} c="#ef4444"/></button>}
    </div>
  );
};

/* LineRow — μία ΓΡΑΜΜΗ επίσκεψης (view κατ.2 & φίλτρο Master).
   Το φιλτράρισμα γίνεται πάνω στο attribution («ποιος εξυπηρέτησε»),
   όχι στο ποιος πληκτρολόγησε. Χωρίς ΦΠΑ, χωρίς σύνολα. */
const LineRow = ({v,l,clients,deleted}) => {
  const client = v.clientId ? clients.find(c=>c.id===v.clientId) : null;
  return (
    <div className={`card px-4 py-3 flex items-center gap-3 ${deleted?'soft-del':''}`}>
      <div className="w-10 h-10 rounded-xl flex-shrink-0 flex items-center justify-center" style={{background:'var(--accent-100)'}}>
        <Ic n={l.kind==='product'?'tag':'zap'} s={16} c="var(--accent-600)"/>
      </div>
      <div className="flex-1 min-w-0">
        <p className="text-sm font-bold truncate" style={{color:'var(--text)'}}>{l.name}</p>
        <p className="text-xs mt-0.5 truncate" style={{color:'var(--text-dim)'}}>
          {client?client.name+' · ':''}{pmName(v.pm)} · {v.time}{v.note?' · 📝':''}
        </p>
      </div>
      <div className="text-right flex-shrink-0">
        <p className="font-black amt" style={{color:'var(--accent-600)'}}>{fmt(lineTotal(l))}</p>
        {lineDiscount(l)>0.005 && <p className="text-[10px] amt" style={{color:'#e11d48'}}>{t('discAbbrevInline')} −{fmt(lineDiscount(l))}</p>}
      </div>
    </div>
  );
};

/* VisitDetail — πλήρης καρτέλα εγγραφής */
const AuditLog = ({audit,staff}) => {
  if(!audit || audit.length===0) return null;
  const who = id => staff.find(s=>s.id===id)?.name || (id==='master'?'Master':'—');
  return (
    <div className="mt-3">
      <p className="text-xs font-bold uppercase tracking-wide mb-1.5" style={{color:'var(--text-dim)'}}>{t('changeHistoryLabel')}</p>
      <div className="space-y-1.5">
        {[...audit].reverse().map(a=>(
          <div key={a.id} className="rounded-xl px-3 py-2 border text-xs" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
            <p className="font-bold" style={{color:'var(--text)'}}>{a.action==='delete'?'🗑️ '+t('deleteActionLabel'):'✏️ '+t('editActionLabel')} — {who(a.by)} · {a.at}</p>
            {a.changes && a.changes.length>0 && (
              <ul className="mt-1 space-y-0.5" style={{color:'var(--text-dim)'}}>
                {a.changes.map((c,i)=><li key={i}>· {c}</li>)}
              </ul>
            )}
          </div>
        ))}
      </div>
    </div>
  );
};

/* Επεξεργασία υπάρχουσας επίσκεψης — Master μόνο. Επιτρέπει διόρθωση/αφαίρεση γραμμών +
   πληρωμή/tip/σημείωση. Προσθήκη ΝΕΑΣ γραμμής σε ήδη-αποθηκευμένη επίσκεψη δεν υποστηρίζεται
   εδώ ακόμα (θα χρειαστεί τον CatalogPicker) — μελλοντική επέκταση αν χρειαστεί. */
const VisitEditor = ({v,staff,onSave,onClose}) => {
  const [lines,setLines] = useState(()=>v.lines.map(l=>({...l})));
  const [pm,setPm] = useState(v.pm);
  const [tip,setTip] = useState(v.tip?String(v.tip):'');
  const [tipStaffId,setTipStaffId] = useState(v.tipStaffId||staff[0]?.id);
  const [tipSplitOn,setTipSplitOn] = useState(!!(v.tipSplit?.length>1));
  const [tipSplitIds,setTipSplitIds] = useState(v.tipSplit||[]);
  const [tipPm,setTipPm] = useState(v.tipPm||'cash');
  const [note,setNote] = useState(v.note||'');

  const setLine = (i,patch) => setLines(ls=>ls.map((l,idx)=>idx===i?{...l,...patch}:l));
  const removeLine = i => setLines(ls=>ls.filter((_,idx)=>idx!==i));
  const tp = parseFloat(tip)||0;
  const canSave = lines.length>0;

  const save = () => {
    const cleanLines = lines.map(l=>({...l, price:parseFloat(l.price)||0}));
    const useSplit = tipSplitOn && tipSplitIds.length>=2;
    onSave({
      ...v, pm, lines:cleanLines,
      tip:tp, tipStaffId:(tp>0 && !useSplit)?tipStaffId:null, tipSplit:(tp>0 && useSplit)?[...tipSplitIds]:null, tipPm:tp>0?tipPm:null,
      note:note.trim(),
    });
  };

  return (
    <div className="modal-bg fade" onClick={onClose} style={{zIndex:110}}>
      <div className="modal pop" onClick={e=>e.stopPropagation()} style={{maxHeight:'92vh'}}>
        <div className="flex items-center justify-between mb-3">
          <h2 className="text-lg font-black" style={{color:'var(--text)'}}>{t('editVisitTitle')}</h2>
          <button onClick={onClose} className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="x" s={16} c="var(--text-dim)"/></button>
        </div>

        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('linesHeaderLabel')}</p>
        <div className="space-y-2 mb-4">
          {lines.map((l,i)=>(
            <div key={i} className="rounded-xl p-3 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
              <div className="flex items-center justify-between mb-2">
                <p className="text-sm font-bold" style={{color:'var(--text)'}}>{l.name}</p>
                <button onClick={()=>removeLine(i)} className="w-7 h-7 rounded-lg flex items-center justify-center" style={{background:'var(--surface)'}}><Ic n="x" s={13} c="#ef4444"/></button>
              </div>
              <div className="mb-2"><CInput label={t('priceEuroLabel')} value={l.price} onChange={v2=>setLine(i,{price:v2})} type="number"/></div>
              <p className="text-[10px] font-bold mb-1.5" style={{color:'var(--text-dim)'}}>{t('staffLabel')}</p>
              <div className="flex gap-1.5 flex-wrap">
                {staff.map(s=><button key={s.id} onClick={()=>setLine(i,{staffId:s.id})} className={`chip ${l.staffId===s.id?'on':''}`}>{s.name}</button>)}
              </div>
            </div>
          ))}
          {lines.length===0 && <p className="text-xs text-center py-4" style={{color:'var(--text-dim)'}}>{t('noLinesWarning')}</p>}
        </div>

        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('paymentLabel')}</p>
        <div className="flex gap-2 mb-4">
          {[['cash',t('cashLabel')],['pos','POS']].map(([k,l])=>(
            <button key={k} onClick={()=>setPm(k)} className="flex-1 py-2.5 rounded-xl text-sm font-bold" style={pm===k?{background:'var(--accent-600)',color:'white'}:{background:'var(--soft)',color:'var(--text)'}}>{l}</button>
          ))}
        </div>

        <div className="flex items-center justify-between mb-2">
          <p className="text-xs font-black uppercase tracking-wide" style={{color:'var(--text-dim)'}}>Tip</p>
          {tp>0 && (
            <button onClick={()=>{
              if(tipSplitOn){ setTipStaffId(tipSplitIds[0]||tipStaffId); setTipSplitOn(false); setTipSplitIds([]); }
              else { setTipSplitIds(tipStaffId?[tipStaffId]:[]); setTipSplitOn(true); }
            }} className="flex items-center gap-1 text-[11px] font-black px-2 py-1 rounded-lg" style={tipSplitOn?{background:'var(--accent-600)',color:'white'}:{background:'var(--soft)',color:'var(--text-dim)'}}>
              <Ic n="split" s={12} c={tipSplitOn?'white':'var(--text-dim)'}/> Split
            </button>
          )}
        </div>
        <div className="mb-2"><CInput label={t('amountEuroLabel')} value={tip} onChange={setTip} type="number"/></div>
        {tp>0 && (<React.Fragment>
          <div className="flex gap-1.5 flex-wrap mb-1">
            {staff.map(s=>{
              const on = tipSplitOn ? tipSplitIds.includes(s.id) : tipStaffId===s.id;
              return (
                <button key={s.id} onClick={()=>{
                  if(tipSplitOn) setTipSplitIds(ids=>ids.includes(s.id)?ids.filter(x=>x!==s.id):[...ids,s.id]);
                  else setTipStaffId(s.id);
                }} className={`chip ${on?'on':''}`}>{s.name}</button>
              );
            })}
          </div>
          {tipSplitOn && <p className="text-[11px] mb-2" style={{color:'var(--text-dim)'}}>
            {tipSplitIds.length>=2 ? `${fmt(tp)} ÷ ${tipSplitIds.length} = ${fmt(tp/tipSplitIds.length)} ${t('perPersonLabel')}` : t('pickAtLeast2')}
          </p>}
          <div className="flex gap-2 mb-4">
            {[['cash',t('cashLabel')],['pos','POS']].map(([k,l])=>(
              <button key={k} onClick={()=>setTipPm(k)} className={`chip flex-1 text-center ${tipPm===k?'on':''}`}>{l}</button>
            ))}
          </div>
        </React.Fragment>)}

        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('noteLabel')}</p>
        <div className="card px-4 py-3 mb-4">
          <input type="text" value={note} onChange={e=>setNote(e.target.value)} className="w-full text-sm outline-none bg-transparent" style={{color:'var(--text)'}}/>
        </div>

        <div className="flex gap-2">
          <button onClick={onClose} className="px-4 py-3 rounded-2xl font-bold text-sm" style={{background:'var(--surface)',color:'var(--text-dim)'}}>{t('cancelBtn')}</button>
          <button onClick={save} disabled={!canSave} className="flex-1 py-3 rounded-2xl font-black text-white text-sm disabled:opacity-30" style={{background:'var(--accent-600)'}}>{t('saveChangesBtn')}</button>
        </div>
      </div>
    </div>
  );
};

const VisitDetail = ({v,staff,clients,operator,onClose,onDel,onEdit,locked,onHardDelete}) => {
  const [editing,setEditing] = useState(false);
  if(!v) return null;
  const client = v.clientId ? clients.find(c=>c.id===v.clientId) : null;
  const isMaster = operator.role===ROLE.MASTER;
  /* Hard delete (31/07) — ΜΟΝΟ ίδια μέρα, πριν το Ζ. Το `locked` εδώ σημαίνει ήδη «η μέρα αυτή
     έχει κλειδώσει με Ζ» — αν true, καμία hard-delete, ό,τι κι αν συμβεί. */
  const canHardDelete = isMaster && isDel(v) && v.date===today() && !locked && !!onHardDelete;
  const enteredBy = staff.find(s=>s.id===v.enteredBy)?.name || (v.enteredBy==='master'?'Master':'—');
  return (
    <div className="modal-bg fade" onClick={onClose}>
      <div className="modal pop" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-1">
          <p className="text-xs font-black uppercase tracking-wider" style={{color:'var(--accent-600)'}}>{t('visitLabel')} {locked&&`· 🔒 ${t('lockedZLabel')}`}{isDel(v)&&` · ${t('deletedLabel')}`}</p>
          <button onClick={onClose} className="w-8 h-8 rounded-lg flex items-center justify-center" style={{background:'var(--soft)'}}><Ic n="x" s={14} c="var(--text-dim)"/></button>
        </div>
        {client && <p className="text-lg font-black" style={{color:'var(--text)'}}>{client.name}</p>}
        <p className="text-xs mb-3" style={{color:'var(--text-dim)'}}>{fmtDLong(v.date)} · {v.time} · {pmName(v.pm)} · {t('recordedByLabel')}: {enteredBy}</p>

        <div className="space-y-2 mb-3">
          {v.lines.map((l,i)=>(
            <div key={i} className="rounded-xl px-3 py-2.5 flex items-center gap-2 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold truncate" style={{color:'var(--text)'}}>{l.name}</p>
                <p className="text-xs" style={{color:'var(--text-dim)'}}>{staff.find(s=>s.id===l.staffId)?.name||'—'}{l.dur>0?` · ${l.dur}′`:''}{lineDiscount(l)>0.005?` · ${t('discountFullInline')} −${fmt(lineDiscount(l))}`:''}</p>
              </div>
              <p className="font-black amt text-sm" style={{color:'var(--text)'}}>{fmt(lineTotal(l))}</p>
            </div>
          ))}
        </div>

        <div className="flex justify-between items-center py-2" style={{borderTop:'1px solid var(--border)'}}>
          <span className="text-sm font-black" style={{color:'var(--text)'}}>{t('totalLabel')}</span>
          <span className="text-xl font-black amt" style={{color:'var(--accent-600)'}}>{fmt(visitTotal(v))}</span>
        </div>
        {v.tip>0 && <div className="flex justify-between items-center py-1.5">
          <span className="text-xs font-bold" style={{color:'var(--text-dim)'}}>Tip → {v.tipSplit?.length>1
            ? `${v.tipSplit.map(id=>staff.find(s=>s.id===id)?.name||'—').join(' + ')} (÷${v.tipSplit.length} ${t('perPersonLabel')})`
            : staff.find(s=>s.id===v.tipStaffId)?.name||'—'}</span>
          <span className="font-bold amt text-yellow-500">{fmt(v.tip)}</span>
        </div>}
        {isMaster && <div className="flex justify-between items-center py-1.5">
          <span className="text-xs font-bold" style={{color:'var(--text-dim)'}}>{t('vatEstimateParen')}</span>
          <span className="font-bold amt text-amber-500">{fmt(visitVat(v))}</span>
        </div>}
        {v.note && (
          <div className="mt-2">
            <p className="text-xs font-bold uppercase tracking-wide mb-1.5 flex items-center gap-1" style={{color:'var(--text-dim)'}}><Ic n="note" s={13} c="#f59e0b"/> {t('noteLabel')}</p>
            <p className="text-sm rounded-xl p-3 whitespace-pre-wrap break-words border" style={{background:'#fffbeb',borderColor:'#fef3c7',color:'#78350f'}}>{v.note}</p>
          </div>
        )}
        {isDel(v) && <p className="text-xs mt-3 text-red-500 font-bold">{t('deletedByLabel')}: {staff.find(s=>s.id===v.deleted.by)?.name||'Master'} · {v.deleted.at}</p>}
        {canHardDelete && (
          <button onClick={()=>{ if(window.confirm(t('hardDeleteFinConfirm'))){ onHardDelete(v.id); onClose(); } }}
            className="w-full mt-3 py-2.5 rounded-xl font-black text-white text-sm" style={{background:'#dc2626'}}>
            🗑️ {t('hardDeleteFinBtn')}
          </button>
        )}
        {isDel(v) && !canHardDelete && isMaster && v.date===today() && locked && (
          <p className="text-xs mt-2" style={{color:'var(--text-dim)'}}>{t('hardDeleteFinLockedHint')}</p>
        )}
        {isMaster && !isDel(v) && (
          <div className="flex gap-2 mt-4">
            <button onClick={()=>setEditing(true)} className="flex-1 py-3 rounded-2xl font-bold text-sm border-2" style={{borderColor:'var(--accent-100)',color:'var(--accent-600)',background:'transparent'}}>
              ✏️ {t('editActionLabel')}
            </button>
            <button onClick={()=>{onDel(v.id);onClose();}} className="flex-1 py-3 rounded-2xl font-bold text-red-500 text-sm border-2 border-red-200" style={{background:'transparent'}}>
              🗑️ {t('deleteActionLabel')}
            </button>
          </div>
        )}
        {isMaster && <AuditLog audit={v.audit} staff={staff}/>}
      </div>
      {editing && <VisitEditor v={v} staff={staff} onClose={()=>setEditing(false)}
        onSave={next=>{onEdit(v.id,next);setEditing(false);}}/>}
    </div>
  );
};

/* ═══════════════ + ΝΕΑ ΚΑΤΑΧΩΡΗΣΗ — ΚΑΛΑΘΙ ΕΠΙΣΚΕΨΗΣ ═══════════════
   Ροή 4 taps: + → είδος → υπάλληλος (default ο χειριστής) → Αποθήκευση.
   Πολλαπλές γραμμές, τιμή/έκπτωση ανά γραμμή, attribution ανά γραμμή,
   ελεύθερο είδος, +ΦΠΑ/−ΦΠΑ μόνο στα έσοδα, autocomplete πελάτη. */

/* Picker καταλόγου: chips κατηγοριών + «συχνότερα πρώτα» (από ιστορικό) +
   προϊόντα Μεταπώλησης + ελεύθερο είδος. Ανενεργά είδη δεν εμφανίζονται.
   Master βλέπει και κουμπί «Διαχείριση» → Κατάλογος manager. */
const CatalogPicker = ({services,products,visits,staff,defaultStaffId,onPick,onClose,onManage}) => {
  const [q,setQ] = useState('');
  const [cat,setCat] = useState('all');
  const [freeName,setFreeName] = useState('');
  const [freePrice,setFreePrice] = useState('');
  const [pending,setPending] = useState(null); // item επιλεγμένο, περιμένει "ποιος το έκανε" (βήμα 2)
  const nq = norm(q);

  /* Συχνότητα χρήσης ανά όνομα είδους (ιστορικό, χωρίς deleted) */
  const freq = useMemo(()=>{
    const f = {};
    (visits||[]).filter(v=>!isDel(v)).forEach(v=>v.lines.forEach(l=>{ f[l.name]=(f[l.name]||0)+1; }));
    return f;
  },[visits]);

  const cats = [...new Set(services.filter(s=>s.active!==false).map(s=>s.cat||'Άλλο'))];
  const sv = services
    .filter(s=>s.active!==false)
    .filter(s=>cat==='all'||((s.cat||'Άλλο')===cat))
    .filter(s=>!nq||norm(s.name).includes(nq))
    .sort((a,b)=>(freq[b.name]||0)-(freq[a.name]||0));
  const pr = products
    .filter(p=>p.active!==false && p.use==='resale')
    .filter(p=>!nq||norm(p.name).includes(nq))
    .sort((a,b)=>(freq[b.name]||0)-(freq[a.name]||0));

  /* Βήμα 2 — «ποιος το έκανε»: υπάλληλοι υπηρεσίας πρώτα, Ρεσεψιόν τελευταία
     (η ρεσεψιόν σπάνια είναι αυτή που εξυπηρέτησε — να μην είναι το πρώτο tap-target) */
  const staffOrdered = [...staff].sort((a,b)=>(a.role===ROLE.RECEPTION?1:0)-(b.role===ROLE.RECEPTION?1:0));

  /* Πρόσφατα ελεύθερα είδη (εκτός καταλόγου) — ίδιο ★ πνεύμα, ώστε να μη γράφεις το ίδιο custom item απ' την αρχή κάθε φορά */
  const recentFree = useMemo(()=>{
    const map = {};
    (visits||[]).filter(v=>!isDel(v)).forEach(v=>v.lines.forEach(l=>{
      if(!l.free) return;
      const cur = map[l.name]||{count:0};
      map[l.name] = {name:l.name, price:l.price, vat:l.vat||24, count:cur.count+1};
    }));
    return Object.values(map).sort((a,b)=>b.count-a.count).slice(0,6);
  },[visits]);

  if(pending) return (
    <div className="modal-bg fade" onClick={onClose}>
      <div className="modal pop" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-3 mb-5">
          <button onClick={()=>setPending(null)} className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'var(--soft)'}}><Ic n="back" s={16} c="var(--text-dim)"/></button>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-black truncate" style={{color:'var(--text)'}}>{pending.name}</p>
            <p className="text-xs" style={{color:'var(--text-dim)'}}>{fmt(pending.price)}{pending.dur>0?` · ${pending.dur}′`:''}</p>
          </div>
        </div>
        <p className="text-xs font-black uppercase tracking-wide mb-3" style={{color:'var(--text-dim)'}}>{t('whoDidItLabel')}</p>
        <div className="grid grid-cols-2 gap-2 mb-2">
          {staffOrdered.map(s=>(
            <button key={s.id} onClick={()=>onPick({...pending,staffId:s.id})}
              className="py-4 rounded-2xl font-black text-sm border-2 text-center"
              style={s.id===defaultStaffId?{borderColor:'var(--accent-600)',background:'var(--accent-50)',color:'var(--accent-600)'}:{borderColor:'var(--border)',background:'var(--soft)',color:'var(--text)'}}>
              {s.name}{s.role===ROLE.RECEPTION?<span className="block text-[10px] font-bold mt-0.5 opacity-60">{t('roleReception')}</span>:null}
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  return (
    <div className="modal-bg fade" onClick={onClose}>
      <div className="modal pop" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center gap-2 mb-3">
          <div className="flex-1 flex items-center gap-2 rounded-xl px-3 py-2.5 border" style={{background:'var(--soft)',borderColor:'var(--border)'}}>
            <Ic n="search" s={16} c="var(--text-dim)"/>
            <input autoFocus type="text" value={q} onChange={e=>setQ(e.target.value)} placeholder={t('searchPlaceholder')} className="flex-1 text-sm outline-none bg-transparent" style={{color:'var(--text)'}}/>
          </div>
          {onManage && <button onClick={onManage} className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'var(--accent-50)'}}><Ic n="gear" s={16} c="var(--accent-600)"/></button>}
          <button onClick={onClose} className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'var(--soft)'}}><Ic n="x" s={15} c="var(--text-dim)"/></button>
        </div>

        {/* Chips κατηγοριών υπηρεσιών */}
        <div className="flex gap-2 overflow-x-auto pb-2 mb-2">
          <button onClick={()=>setCat('all')} className={`chip ${cat==='all'?'on':''}`}>{t('allLabel')}</button>
          {cats.map(c=><button key={c} onClick={()=>setCat(c)} className={`chip ${cat===c?'on':''}`}>{catLabel(c)}</button>)}
        </div>

        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('servicesLabel')} {cat!=='all'?`— ${catLabel(cat)}`:''}</p>
        <div className="space-y-1.5 mb-4">
          {sv.map(s=>(
            <button key={s.id} onClick={()=>setPending({name:s.name,price:s.price,dur:s.dur,vat:s.vat,kind:'service',catalogId:s.id})} className="w-full card px-4 py-3 flex items-center justify-between text-left">
              <div><p className="text-sm font-bold" style={{color:'var(--text)'}}>{itemLabel(s)}{(freq[s.name]||0)>1?<span className="text-[10px] ml-1.5 px-1.5 py-0.5 rounded-md font-black" style={{background:'var(--accent-50)',color:'var(--accent-600)'}}>★</span>:null}</p><p className="text-xs" style={{color:'var(--text-dim)'}}>{catLabel(s.cat||'Άλλο')} · {s.dur}′ · {t('vatAbbrev')} {s.vat}%</p></div>
              <p className="font-black amt" style={{color:'var(--accent-600)'}}>{fmt(s.price)}</p>
            </button>
          ))}
          {sv.length===0&&<p className="text-xs py-2 text-center" style={{color:'var(--text-dim)'}}>{t('nothingLabel')}</p>}
        </div>

        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('productsResaleLabel')}</p>
        <div className="space-y-1.5 mb-4">
          {pr.map(p=>(
            <button key={p.id} onClick={()=>setPending({name:p.name,price:p.price,dur:0,vat:p.vat,kind:'product',productId:p.id,catalogId:p.id})} className="w-full card px-4 py-3 flex items-center justify-between text-left">
              <div className="flex-1 min-w-0">
                <p className="text-sm font-bold truncate" style={{color:'var(--text)'}}>{itemLabel(p)}</p>
                <p className="text-xs" style={{color:'var(--text-dim)'}}>{t('vatAbbrev')} {p.vat}%{p.stock!=null?` · ${t('stockLabel')} ${p.stock}`:''}{p.stock!=null&&p.stock<=p.low?' ⚠️':''}</p>
              </div>
              <p className="font-black amt" style={{color:'var(--accent-600)'}}>{fmt(p.price)}</p>
            </button>
          ))}
        </div>

        {/* Ελεύθερο είδος — εκτός καταλόγου, μηδέν επιβάρυνση καταλόγου */}
        <p className="text-xs font-black uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('freeItemLabel')}</p>
        {recentFree.length>0 && (
          <div className="flex gap-2 flex-wrap mb-2">
            {recentFree.map(f=>(
              <button key={f.name} onClick={()=>setPending({name:f.name,price:f.price,dur:0,vat:f.vat,kind:'service',free:true})} className="chip">{f.name} · {fmt(f.price)}</button>
            ))}
          </div>
        )}
        <div className="card p-3 flex gap-2 items-center">
          <input type="text" value={freeName} onChange={e=>setFreeName(e.target.value)} placeholder={t('namePlaceholder')} className="flex-1 min-w-0 text-sm outline-none bg-transparent" style={{color:'var(--text)'}}/>
          <input type="number" value={freePrice} onChange={e=>setFreePrice(e.target.value)} placeholder="€" inputMode="decimal" className="w-20 text-sm font-bold outline-none bg-transparent text-right amt" style={{color:'var(--text)'}}/>
          <button disabled={!freeName.trim()||!(parseFloat(freePrice)>0)} onClick={()=>setPending({name:freeName.trim(),price:parseFloat(freePrice),dur:0,vat:24,kind:'service',free:true})}
            className="px-3 py-2 rounded-xl text-white text-sm font-black disabled:opacity-30" style={{background:'var(--accent-600)'}}>+</button>
        </div>
      </div>
    </div>
  );
};

          <button onClick={()=>setDiscMode(discMode==='pct'?null:'pct')} className={`chip ${discMode==='pct'?'on':''}`}>{t('discountPercentChip')}</button>
          {discMode && <input type="number" value={disc} onChange={e=>setDisc(e.target.value)} placeholder={discMode==='pct'?'%':'€'} inputMode="decimal"
            className="w-24 rounded-xl px-3 py-2 text-sm font-bold outline-none border amt" style={{background:'var(--soft)',color:'var(--text)',borderColor:'var(--border)'}}/>}
        </div>

        <p className="text-xs font-bold uppercase tracking-wide mb-2" style={{color:'var(--text-dim)'}}>{t('whoServedLabel')}</p>
